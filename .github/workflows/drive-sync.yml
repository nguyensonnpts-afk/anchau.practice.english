name: drive-sync
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ofq3ju]
    paths: [tools/drive_sync.py, .github/workflows/drive-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils pandoc
      - run: pip install -q gdown==5.2.0
      - run: python tools/drive_sync.py
      - run: |
          git config user.name "drive-sync"
          git config user.email "drive-sync@users.noreply.github.com"
          git add _source
          git commit -m "Sync IELTS source text from Drive" || echo "nothing to commit"
          git push
