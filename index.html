function addStudentModal(){modal(`<h2>Thêm học viên</h2><p class="small muted">Mỗi dòng một học viên. Có thể thêm nhóm/lớp sau dấu |, ví dụ: <code>Nguyễn Văn An | IELTS tối T3</code></p><textarea id="newstu" placeholder="Nguyễn Văn An&#10;Trần Thị Bình | Lớp 12A"></textarea><div class="row mt"><button class="btn pri" onclick="addStudents()">Tạo mã</button><button class="btn ghost" onclick="modal('')">Hủy</button></div>`)}
function addStudents(){const lines=$('#newstu').value.split('\n').map(x=>x.trim()).filter(Boolean);const made=[];lines.forEach(l=>{const[name,group]=l.split('|').map(x=>x.trim());const s={id:uid('u'),name,group:group||'',code:genCode(),created:Date.now()};D.students.push(s);made.push(s)});save();render();

VIEWS['t-student']=()=>{
 const s=stuById(R.id);if(!s)return '<div class="empty">Không tìm thấy.</div>';
 const m=stuSummary(s.id);const p=P(s.id);const asg=myAssignments(s.id);
 const sets=allSets().map(x=>({x,st:setStats(x,s.id)})).filter(o=>o.st.learned);
 const weak=Object.entries(p.words).filter(([k,r])=>r.lapses>=2).sort((a,b)=>b[1].lapses-a[1].lapses).slice(0,12);
 return `<div class="crumb" onclick="go('t-students')">← Học viên</div>

function parseTest(src){
 const secs=[];let sec=null,q=null,last=null;const errs=[];
 const newSec=t=>{sec={title:t||'',questions:[]};secs.push(sec);q=null};
 src.split('\n').forEach((raw,ln)=>{const l=raw.trim();if(!l){if(last==='passage'&&sec)sec.passage+='\n';return}
  let m;
  if(l.startsWith('##')){newSec(l.slice(2).trim());last='sec';return}
  if(l.startsWith('>>')){if(!sec||sec.questions.length)newSec('');sec.passage=(sec.passage?sec.passage+'\n':'')+l.slice(2).trim();last='passage';return}
  if(l.startsWith('))')&&/\.(mp3|m4a|wav|ogg)(\?.*)?$/i.test(l)){if(!sec||sec.questions.length)newSec('');sec.audioSrc=l.slice(2).trim();last='sec';return}
  if(l.startsWith('))')){if(!sec||sec.questions.length)newSec('');sec.audio=(sec.audio?sec.audio+' ':'')+l.slice(2).trim();last='audio';return}
  if((m=l.match(/^\d+\s*[.)]\s*(.*)$/))){if(!sec)newSec('');q={t:'mc',q:m[1],o:[],a:-1};sec.questions.push(q);last='q';return}
  if(q&&(m=l.match(/^(\*?)\s*([A-Ga-g])\s*[.)]\s*(.*)$/))&&q.t==='mc'){if(m[1])q.a=q.o.length;q.o.push(m[3]);last='o';return}
  if(q&&(m=l.match(/^=\s*(.*)$/))){q.t='fill';q.a=m[1].split('/').map(x=>x.trim()).filter(Boolean);delete q.o;last='a';return}
  if(q&&(m=l.match(/^!essay\s*(\d*)/i))){q.t='essay';q.min=+m[1]||0;delete q.o;delete q.a;last='a';return}
  if(q&&l.startsWith('?')){q.e=l.slice(1).trim();last='e';return}
  if(last==='passage'){sec.passage+='\n'+l;return}
  if(last==='audio'){sec.audio+=' '+l;return}
  if(q&&last==='q'){q.q+='\n'+l;return}
  errs.push(`Dòng ${ln+1}: không hiểu "${l.slice(0,40)}"`);
 });
 let n=0;secs.forEach(s=>s.questions.forEach(q=>{n++;if(q.t==='mc'){if(q.o.length<2)errs.push(`Câu ${n}: cần ít nhất 2 phương án A, B…`);else if(q.a<0)errs.push(`Câu ${n}: chưa đánh dấu * cho đáp án đúng`)}if(q.t==='fill'&&!q.a.length)errs.push(`Câu ${n}: thiếu đáp án sau dấu =`)}));
 if(!n)errs.push('Chưa có câu hỏi nào');
 return {sections:secs.filter(s=>s.questions.length||s.passage),errs,n};
}

 <div class="card"><h2>Đã giao</h2>${D.assignments.length?(()=>{const ORD=['Listening','Reading','Writing','Speaking','Thi 4 kỹ năng','Bộ từ','Phổ thông','Đề thi'];const list=D.assignments.slice().reverse();const labs=[...new Set(list.map(asgLab))].sort((x,y)=>ORD.indexOf(x)-ORD.indexOf(y));
  return labs.map(lb=>`<h3 class="mt" style="margin-bottom:0">${h(lb)}</h3>`+list.filter(a=>asgLab(a)===lb).map(a=>{const it=asgItem(a);const who=a.to==='all'?D.students:D.students.filter(s=>a.to.includes(s.id));const done=who.filter(s=>assignDone(a,s.id)).length;
  return `<div class="list-item"><div><b class="small">${h(it?it.title:'(đã xóa)')}</b><div class="small muted">${a.to==='all'?'Cả lớp':who.map(s=>h(s.name)).join(', ')}${a.due?' · hạn '+fdate(a.due):''}</div></div><div class="row"><span class="tag ${done===who.length&&who.length?'ok':'warn'}">${done}/${who.length} xong</span><button class="btn sm danger" onclick="delItem('assignments','${a.id}')">Xóa</button></div></div>`}).join('')).join('')})():'<div class="empty">Chưa giao bài nào.</div>'}</div></div>`;
};
let aKind='L';
AFTER['t-assign']=()=>asgKind(aKind);
function asgKind(k){if(k==='test')k='L';if(!ASK().some(([x])=>x===k))k='L';aKind=k;ASK().forEach(([x])=>$('#ak-'+x).classList.toggle('on',x===k));let groups;
 const byVol=sk=>{const ts=allTests().filter(t=>t.type==='ielts'&&(t.skill||'Reading')===sk);return [...new Set(ts.map(t=>t.vol||'Đề của giáo viên'))].sort(volSort).map(v=>[v,ts.filter(t=>(t.vol||'Đề của giáo viên')===v).map(t=>[t.id,t.title])])};
 if(k==='L')groups=byVol('Listening');
 else if(k==='R')groups=byVol('Reading');
 else if(k==='thpt')groups=[['',allTests().filter(t=>t.type==='thpt').map(t=>[t.id,t.title])]];
 else if(k==='W')groups=[['Task 1',allW().filter(w=>w.task===1).map(w=>[w.id,w.title])],['Task 2',allW().filter(w=>w.task===2).map(w=>[w.id,w.title])]];
 else if(k==='S')groups=[['Part 1',allP1().map(t=>[t.id,t.title])],['Part 2 & 3',allP2().map(t=>[t.id,t.cue])]];
 else if(k==='set'){const ss=allSets();groups=[...new Set(ss.map(x=>x.cat))].map(c=>[c,ss.filter(x=>x.cat===c).map(x=>[x.id,x.title])])}
 else groups=[['',(D.fulls||[]).filter(f=>f.by==='teacher').map(f=>[f.id,f.title])]];
 groups=groups.filter(g=>g[1].length);const n=groups.reduce((a,g)=>a+g[1].length,0);
 const opt=([v,l])=>`<option value="${v}">${h(l)}</option>`;
 $('#a-ref').innerHTML=groups.map(([g,o])=>g?`<optgroup label="${h(g)}">${o.map(opt).join('')}</optgroup>`:o.map(opt).join('')).join('');$('#a-ref').style.display=n?'':'none';asgInfo()}
function asgInfo(){const el=$('#a-info');if(!el)return;const v=$('#a-ref').value;
 if(aKind!=='full'){el.innerHTML=v?'':'<div class="small muted mt">Chưa có mục nào để giao.</div>';return}
 const f=v&&fullById(v);
 el.innerHTML=f?`<div class="card mt" style="padding:12px 14px;box-shadow:none">${fullSummary(f)}<div class="row mt" style="gap:8px"><button class="btn sm ghost" onclick="asgRandFull()">Ghép ngẫu nhiên đề khác</button><button class="btn sm ghost" onclick="TFTAB='build';go('t-full')">Tự ghép đề</button></div></div>`
  :`<div class="card mt" style="padding:14px;box-shadow:none;background:var(--accent-soft);border-color:transparent"><b class="small">Chưa có đề 4 kỹ năng nào để giao.</b><p class="small muted" style="margin:4px 0 10px">Ghép nhanh một đề ngẫu nhiên từ kho, hoặc tự tick chọn từng phần.</p><div class="row" style="gap:8px"><button class="btn sm pri" onclick="asgRandFull()">Ghép ngẫu nhiên 1 đề</button><button class="btn sm" onclick="TFTAB='build';go('t-full')">Tự ghép đề</button></div></div>`}
function asgRandFull(){const keep=FB;FB={tab:'L',vol:{L:'all',R:'all'}};['L','R','W','S'].forEach(fbRand);
 if(!['L','R','W','S'].every(fbHas)){FB=keep;toast('Kho đề chưa đủ 4 kỹ năng để ghép');return}
 D.fulls=D.fulls||[];const n=D.fulls.filter(f=>f.by==='teacher').length+1;const f=fbObj('Đề 4 kỹ năng số '+n,'teacher');D.fulls.push(f);save();FB=keep;
 asgKind('full');$('#a-ref').value=f.id;asgInfo();toast('Đã ghép '+f.title)}
function saveAssign(){if(!$('#a-ref').value){toast(aKind==='full'?'Hãy ghép một đề 4 kỹ năng trước':'Chưa chọn bài để giao');return}const all=$('#a-all').checked;const to=all?'all':[...document.querySelectorAll('.a-stu:checked')].map(c=>c.value);if(!all&&!to.length){toast('Chọn ít nhất một học viên');return}
 D.assignments.push({id:uid('a'),kind:ASK_DATA[aKind],ref:$('#a-ref').value,to,due:$('#a-due').value||'',note:$('#a-note').value.trim(),created:Date.now()});save();toast('Đã giao bài. Nhớ gửi gói bài học cho học viên nếu các em học trên máy khác.');R.pre=null;render()}

/* --- Dữ liệu --- */
VIEWS['t-data']=()=>`<h1>Dữ liệu & cài đặt</h1><p class="sub">Mọi dữ liệu được lưu ngay trong trình duyệt này. Dùng các nút dưới đây để chia sẻ giữa các máy.</p>
 <div class="grid g2">
 <div class="card"><h2>Gửi bài cho học viên</h2><p class="small muted">Xuất gói gồm danh sách học viên, bộ từ, đề thi, bài giao và điểm/nhận xét bài viết. Gửi file cho học viên, các em bấm "Nhập file từ giáo viên" ở màn hình đăng nhập.</p><button class="btn pri" onclick="download('goi-bai-hoc-'+today()+'.json',classPack(true))">Xuất gói bài học</button></div>
 <div class="card"><h2>Nhận kết quả từ học viên</h2><p class="small muted">Học viên bấm "Xuất kết quả gửi giáo viên" trong mục Kết quả và gửi file cho bạn. Nhập vào đây để xem tiến độ. Có thể nhập nhiều file, dữ liệu sẽ được gộp.</p><button class="btn" onclick="importPack()">Nhập file kết quả</button></div>
 <div class="card"><h2>Sao lưu</h2><p class="small muted">Tải toàn bộ dữ liệu (kể cả tiến độ học) để cất giữ hoặc chuyển sang máy khác.</p><div class="row"><button class="btn" onclick="download('sao-luu-'+today()+'.json',classPack(true))">Tải bản sao lưu</button><button class="btn" onclick="importPack()">Khôi phục / gộp</button></div></div>
 <div class="card"><h2>Cài đặt</h2>
  <label class="f">Tên lớp / trung tâm</label><input type="text" id="cfg-n" value="${h(D.settings.className)}">
  <label class="row small mt"><input type="checkbox" id="cfg-r" ${D.settings.selfReg?'checked':''}> Cho phép học viên tự tạo hồ sơ</label>
  <label class="f">Đổi PIN giáo viên</label><input type="password" id="cfg-p" placeholder="Để trống nếu không đổi">
  <button class="btn pri mt" onclick="saveCfg()">Lưu cài đặt</button>
 </div>
 <div class="card"><h2 style="color:var(--bad)">Xóa toàn bộ</h2><p class="small muted">Xóa mọi học viên, kết quả, bộ từ và đề tự soạn trên máy này.</p><button class="btn danger" onclick="if(confirm('Chắc chắn xóa toàn bộ dữ liệu? Nên tải bản sao lưu trước.')&&prompt('Gõ XOA để xác nhận')==='XOA'){D=blank();save();logout()}">Xóa toàn bộ dữ liệu</button></div>
 </div>`;
function saveCfg(){D.settings.className=$('#cfg-n').value.trim()||'Lớp Tiếng Anh';D.settings.selfReg=$('#cfg-r').checked;const p=$('#cfg-p').value.trim();if(p){if(p.length<4){toast('PIN tối thiểu 4 ký tự');return}D.teacherPin=p}save();render();toast('Đã lưu cài đặt')}
