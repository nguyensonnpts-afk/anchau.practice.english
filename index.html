<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
button,input,select,textarea,optgroup{font-family:inherit;font-weight:400;font-variant-numeric:lining-nums}h4,th,label{font-weight:400}b,strong{font-weight:600}h1,h2,h3{font-weight:500}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
:root{
  --bg:#f1ece2; --bg2:#e8e1d3; --card:#fbf8f2; --ink:#1e2b2c; --ink2:#384646; --muted:#6c7470; --line:#e0d8c8; --line2:#cfc5b1;
  --brand:#2c5e58; --brand-ink:#fbf8f2; --brand-soft:#dfe9e3;
  --accent:#a8762b; --accent-ink:#fbf8f2; --accent-soft:#f3e6cc; --mark:#f2d27a;
  --ok:#2f7a52; --ok-soft:#dcecdf; --bad:#b4483e; --bad-soft:#f6e1dc; --warn:#9a6a1c; --warn-soft:#f4e7cc;
  --shadow:0 1px 2px rgba(60,48,28,.05);
  --c-read:#30598a; --c-read-soft:#e0e7ef; --c-listen:#2c7a64; --c-listen-soft:#dcebe3; --c-write:#ad5a2e; --c-write-soft:#f4e3d6; --c-speak:#76508f; --c-speak-soft:#ebe2ee;
  --shadow-lg:0 2px 4px rgba(60,48,28,.05),0 16px 36px -12px rgba(60,48,28,.18);
  --r:16px; --r-sm:11px;
  --ease:cubic-bezier(.2,.75,.25,1);
  --serif:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a24; --bg2:#1a202c; --card:#1e2533; --ink:#ebe6dc; --ink2:#cfc9bd; --muted:#98a0ad; --line:#2a3242; --line2:#374055;
    --brand:#9cc8bd; --brand-ink:#121a22; --brand-soft:#223a3c;
    --accent:#e0b765; --accent-ink:#1d1708; --accent-soft:#37301f; --mark:#c9a24a;
    --ok:#7fcf9f; --ok-soft:#1c3329; --bad:#ec9a8c; --bad-soft:#3d2629; --warn:#e0b765; --warn-soft:#37301f;
    --shadow:0 1px 1px rgba(0,0,0,.22); --shadow-lg:0 18px 40px -14px rgba(0,0,0,.55);
    --c-read:#94b6e0; --c-read-soft:#233350; --c-listen:#82d1b6; --c-listen-soft:#1e3836; --c-write:#eea67a; --c-write-soft:#3b2d24; --c-speak:#c9a8e3; --c-speak-soft:#30293f;
  }
}
:root[data-theme="dark"]{
    --bg:#151a24; --bg2:#1a202c; --card:#1e2533; --ink:#ebe6dc; --ink2:#cfc9bd; --muted:#98a0ad; --line:#2a3242; --line2:#374055;
    --brand:#9cc8bd; --brand-ink:#121a22; --brand-soft:#223a3c;
    --accent:#e0b765; --accent-ink:#1d1708; --accent-soft:#37301f; --mark:#c9a24a;
    --ok:#7fcf9f; --ok-soft:#1c3329; --bad:#ec9a8c; --bad-soft:#3d2629; --warn:#e0b765; --warn-soft:#37301f;
    --shadow:0 1px 1px rgba(0,0,0,.22); --shadow-lg:0 18px 40px -14px rgba(0,0,0,.55);
    --c-read:#94b6e0; --c-read-soft:#233350; --c-listen:#82d1b6; --c-listen-soft:#1e3836; --c-write:#eea67a; --c-write-soft:#3b2d24; --c-speak:#c9a8e3; --c-speak-soft:#30293f;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-variant-numeric:lining-nums;font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--mark);color:#151c2a}
a{color:var(--brand);text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* header */
header.top{view-transition-name:hdr;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.top.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 24px -18px rgba(0,0,0,.25)}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.logo b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--brand);color:var(--brand);font-family:var(--serif);font-weight:400;font-size:15px;font-style:italic;transition:background .35s var(--ease),color .35s var(--ease)}
.logo:hover b{background:var(--brand);color:var(--brand-ink)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav.tabs button{position:relative;border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--muted);font-weight:400;font-size:14.5px;border-radius:8px;transition:color .25s}
nav.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:var(--line2);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
nav.tabs .tl{position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--tc,var(--brand));view-transition-name:tabline}
nav.tabs button[data-sk=speaking]{--tc:var(--c-speak)}nav.tabs button[data-sk=writing]{--tc:var(--c-write)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button:hover::after{transform:scaleX(.35)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::after{display:none}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.thm{position:relative;flex:none;width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--line2);background:var(--card);border-radius:50%;cursor:pointer;color:var(--ink2);padding:0;transition:border-color .25s,color .25s,transform .15s var(--ease)}
.thm:hover{border-color:var(--ink);color:var(--ink)}
.thm:active{transform:scale(.92)}
.thm svg{position:absolute;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ease),opacity .3s}
.thm .moon{opacity:0;transform:rotate(-70deg) scale(.6)}
.dark-on .thm .sun{opacity:0;transform:rotate(70deg) scale(.6)}
.dark-on .thm .moon{opacity:1;transform:none}
header.top .wrap>.thm{margin-left:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

main{padding:34px 0 80px}
h1,h2,.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:clamp(28px,3.4vw,38px);line-height:1.15;margin:0 0 6px}
h2{font-size:21px;line-height:1.3;margin:0 0 12px}
h3{font-size:15.5px;font-weight:400;margin:0 0 6px;letter-spacing:-.005em}
.sub{color:var(--muted);margin:0 0 26px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.card[onclick],button.card{cursor:pointer}
.card[onclick]:hover,button.card:hover{border-color:var(--ink2)}
button.card{font:inherit;color:inherit;width:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stat{padding:18px 20px}
.stat .n{font-family:var(--serif);font-size:34px;font-weight:400;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:4px;letter-spacing:.01em}

.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:400;font-size:14.5px;text-decoration:none;color:var(--ink);transition:background .25s,border-color .25s,color .25s,transform .15s var(--ease),box-shadow .25s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08);box-shadow:0 8px 20px -8px var(--brand)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.acc:hover{filter:brightness(1.05);box-shadow:0 8px 20px -10px var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:transparent;background:var(--bg2)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:14px}.mt2{margin-top:30px}.mb{margin-bottom:18px}
.tag{font-family:var(--sans);vertical-align:middle;display:inline-block;font-size:12px;padding:2px 9px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-weight:400}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.gray{background:var(--bg2);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--card);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
textarea{min-height:120px;resize:vertical;font-family:var(--sans);font-size:13px}
textarea.prose{font-family:var(--sans);font-size:15.5px;line-height:1.75;min-height:300px}
label.f{display:block;font-size:12.5px;font-weight:400;margin:14px 0 6px;color:var(--ink2);letter-spacing:.01em}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg2);padding:4px;border-radius:999px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:400;font-size:14px;color:var(--muted);transition:background .3s var(--ease),color .25s,box-shadow .3s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px -2px rgba(0,0,0,.08)}
.bar{height:4px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transform-origin:left;transition:width .5s var(--ease)}
#app.enter .bar i{animation:grow 1s .2s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--bg)}
th{color:var(--muted);font-weight:400;font-size:12.5px}
.tbl{overflow-x:auto}
hr{border:0;border-top:1px solid var(--line)}

/* login */
.login{max-width:420px;margin:7vh auto 0}
.login .hero{text-align:center;margin-bottom:26px}
.login .hero b{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;border:1px solid var(--ink);color:var(--ink);font-family:var(--serif);font-style:italic;font-weight:400;font-size:28px;margin-bottom:18px}
.login .hero h1{font-size:clamp(30px,5vw,40px)}
.login .hero .sub{margin:0 auto}
.login .card{padding:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13px;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--ink);background:var(--bg)}

/* flashcard */
.fc-wrap{max-width:580px;margin:0 auto}
.flash{perspective:1400px;cursor:pointer;height:320px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.flash .back{transform:rotateY(180deg);background:var(--brand-soft)}
.flash .word{font-family:var(--serif);font-size:42px;font-weight:400;letter-spacing:-.02em}
.flash .ipa{color:var(--muted);margin-top:6px}
.flash .vi{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--brand)}
.flash .ex{margin-top:14px;font-style:italic;color:var(--ink2);max-width:440px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.rate button{padding:13px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:400;transition:transform .2s var(--ease),border-color .2s,box-shadow .25s}
.rate button:hover{border-color:currentColor}
.rate button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.rate .r1{color:var(--bad)}.rate .r2{color:var(--warn)}.rate .r3{color:var(--brand)}.rate .r4{color:var(--ok)}
.spk{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;display:inline-grid;place-items:center;transition:background .25s,transform .2s var(--ease),border-color .25s}
.spk:hover{background:var(--brand-soft);border-color:var(--brand);transform:scale(1.06)}

/* quiz */
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .2s,background .25s,transform .2s var(--ease)}
.opt:hover{border-color:var(--ink2)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11.5px;font-weight:400;color:var(--muted);transition:all .25s}
.opt.sel{border-color:var(--ink);background:var(--bg)}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);animation:pop .4s var(--ease)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes pop{50%{transform:scale(1.015)}}
@keyframes shake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.qbig{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.01em}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:center;font-weight:400;min-height:56px;transition:border-color .2s,background .2s,transform .2s var(--ease),opacity .3s}
.mi:hover{border-color:var(--ink2)}
.mi.sel{border-color:var(--ink);background:var(--bg)}
.mi.done{visibility:hidden}
.mi.err{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}

/* exam */
.exam-head{position:sticky;top:var(--hdr,64px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.timer{font-variant-numeric:tabular-nums;font-weight:400;font-size:17px;padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line2);letter-spacing:.02em}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 16%,transparent)}}
.passage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;white-space:pre-wrap;font-family:var(--serif);line-height:1.9;font-size:16.5px;color:var(--ink2);max-width:72ch}
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:400;font-size:12.5px;margin-right:10px;padding:0 8px;font-variant-numeric:tabular-nums}
.q .opts{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fill{max-width:300px;margin-top:10px}
.qnav{display:flex;flex-wrap:wrap;gap:5px}
.qnav span{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:11.5px;font-weight:400;background:var(--bg2);color:var(--muted);cursor:pointer;transition:background .25s,color .25s,transform .2s var(--ease)}
.qnav span:hover{background:var(--line2);color:var(--ink)}
.qnav span.done{background:var(--ink);color:var(--bg)}
.review .ok{color:var(--ok);font-weight:400}.review .bad{color:var(--bad);font-weight:400}
.explain{margin-top:8px;padding:10px 14px;background:var(--warn-soft);border-radius:var(--r-sm);font-size:14px}
.big-score{font-family:var(--serif);font-size:64px;font-weight:400;color:var(--brand);line-height:1;letter-spacing:-.03em}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14.5px}
.empty::before{content:"";display:block;width:44px;height:44px;margin:0 auto 12px;background:var(--line2);-webkit-mask:var(--empty-ico) center/contain no-repeat;mask:var(--empty-ico) center/contain no-repeat;opacity:.9}

/* vol sections */

.fsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

button.card:hover .mode-ico{background:var(--mc);color:var(--card)}

/* decor: ambient light + footer */

  radial-gradient(40% 35% at 18% 22%,color-mix(in srgb,var(--c-read) 34%,transparent),transparent 70%),

/* stats + reports + install */
.gx2{grid-template-columns:repeat(2,minmax(0,1fr))}.gx4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.gx2{grid-template-columns:1fr}.gx4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:641px){header.top .wrap{flex-wrap:nowrap}nav.tabs{flex-wrap:nowrap;min-width:0;overflow-x:auto;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}nav.tabs button{padding:8px 8px;white-space:nowrap}}
.rep-link{color:var(--muted);font-size:12.5px;text-decoration:underline dotted;text-underline-offset:3px}
.rep-link:hover{color:var(--bad)}
.install{display:flex;align-items:center;gap:14px;padding:14px 18px;margin:14px 0 4px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(100deg,var(--brand-soft),var(--card) 70%)}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install .t{flex:1;min-width:0;font-size:14px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .v{fill:var(--ink);font-weight:400}
.hbar{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 64px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hbar:last-child{border-bottom:0}
.hbar .tr{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px;background:var(--bad);transform-origin:left;animation:grow .9s var(--ease) both}
.hbar .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:400}
@media (max-width:640px){.hbar{grid-template-columns:1fr 64px}.hbar .tr{grid-column:1/-1;grid-row:2}}

/* motion: entrance on view change */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.enter>*,#app.enter .grid>*{animation:rise .5s var(--ease) both}
#app.enter>.login-bg{animation:none}
#app.enter>*:nth-child(2){animation-delay:.05s}
#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}
#app.enter>*:nth-child(5){animation-delay:.2s}
#app.enter>*:nth-child(n+6){animation-delay:.25s}
#app.enter .grid>*:nth-child(1){animation-delay:.08s}
#app.enter .grid>*:nth-child(2){animation-delay:.13s}
#app.enter .grid>*:nth-child(3){animation-delay:.18s}
#app.enter .grid>*:nth-child(4){animation-delay:.23s}
#app.enter .grid>*:nth-child(5){animation-delay:.28s}
#app.enter .grid>*:nth-child(6){animation-delay:.33s}
#app.enter .grid>*:nth-child(n+7){animation-delay:.38s}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* scroll motion: reveal, parallax title, progress, back to top */
#app .sr{animation:none!important;transition:opacity .7s var(--ease),transform .7s var(--ease)}
#app .sr:not(.in){opacity:0;transform:translateY(24px) scale(.985)}
#app h2.sr:not(.in),#app h3.sr:not(.in),#app .list-item.sr:not(.in),#app .q.sr:not(.in){transform:translateY(12px)}
#app .sr:not(.in) .tr i,#app .hbar.sr:not(.in) .tr i{animation-name:none;transform:scaleX(0)}
#app .sr:not(.in) .heat i{opacity:0}
#app.enter .heat i,#app .sr.in .heat i{animation:cell .45s var(--ease) both;animation-delay:calc(var(--i,0) * 14ms + .15s)}
@keyframes cell{from{opacity:0;transform:scale(.4)}}
#app>h1,#app>.sub{will-change:translate,opacity}
.login-bg::before{translate:calc(var(--mx,0) * -18px) calc(var(--my,0) * -12px + var(--l1,0px))}
.login-bg::after{translate:calc(var(--mx,0) * 8px) calc(var(--my,0) * 6px + var(--l2,0px))}
.sprog{position:fixed;left:0;right:0;top:max(0px,calc(var(--hdr,64px) - 2px));height:2px;z-index:21;background:var(--pg,var(--brand));transform-origin:0 50%;transform:scaleX(0);opacity:0;transition:opacity .3s;pointer-events:none}
.sprog.on{opacity:.85}
.totop{position:fixed;right:20px;bottom:22px;z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink2);box-shadow:var(--shadow-lg);display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease),color .2s,border-color .2s}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop:hover{color:var(--pg,var(--brand));border-color:var(--pg,var(--brand))}
.totop svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.totop{right:14px;bottom:16px;width:40px;height:40px}}
@media print{#app .sr{opacity:1!important;transform:none!important}.sprog,.totop{display:none}}

@media (max-width:640px){
  .wrap{padding:0 16px}
  header.top .wrap{padding-top:8px;padding-bottom:4px;gap:8px;min-height:56px}
  nav.tabs{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin:0 -16px;padding:0 10px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{white-space:nowrap}
  main{padding-top:24px}
  .card{padding:18px}
  .flash{height:270px}.flash .word{font-size:32px}
  .rate{grid-template-columns:repeat(2,1fr)}
  .who{margin-left:auto;gap:6px}
  .who>span:first-child{display:none}
  .passage{padding:18px}
  .stat .n{font-size:28px}
  .g2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .login-bg::before{animation:none}
  .quote span,.quote small{opacity:1;transform:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
  #app .sr{opacity:1!important;transform:none!important}
}
</style>

const KEY='lopta_data_v1', SKEY='lopta_session_v1';
const DAY=86400000;
function blank(){return {teacherPin:'1234',settings:{selfReg:true,className:'Lớp Tiếng Anh'},students:[],sets:[],tests:[],assignments:[],progress:{}}}
let D=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.students)return Object.assign(blank(),x)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Không lưu được dữ liệu trên trình duyệt này')}if(window.SYNC)SYNC.dirty()}
function getSession(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}}
function setSession(s){try{s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY)}catch(e){}}

const allSets=()=>[...SAMPLE_SETS,...D.sets];
const allTests=()=>[...SAMPLE_TESTS,...D.tests];
const setById=id=>allSets().find(s=>s.id===id);

function grade(key,q){
 const p=P();const now=Date.now();
 const c=p.words[key]||{ef:2.5,iv:0,reps:0,due:0,lapses:0,seen:0};
 c.seen=(c.seen||0)+1;
 if(q<3){c.reps=0;c.iv=0;c.lapses++;c.due=now+10*60000}
 else{c.reps++;c.iv=c.reps===1?(q===5?3:1):c.reps===2?(q===5?6:3):Math.round(c.iv*c.ef*(q===5?1.3:q===3?0.8:1));c.iv=Math.max(1,c.iv);c.due=now+c.iv*DAY}
 c.ef=Math.max(1.3,Math.min(3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02))));
 c.last=now;p.words[key]=c;bump();save();
}
function bump(sid){const p=P(sid);const d=today();p.activity[d]=(p.activity[d]||0)+1}
function wstatus(rec){if(!rec)return 'new';if(rec.iv>=7)return 'mastered';return 'learning'}
function setStats(set,sid){const p=P(sid);let n=0,l=0,m=0,due=0;const now=Date.now();set.words.forEach(w=>{const r=p.words[wkey(set.id,w.w)];const s=wstatus(r);if(s==='new')n++;else if(s==='mastered')m++;else l++;if(r&&r.due<=now)due++});return{total:set.words.length,n,l,m,due,learned:l+m}}
function dueList(sid){const p=P(sid),now=Date.now(),out=[];allSets().forEach(s=>s.words.forEach(w=>{const r=p.words[wkey(s.id,w.w)];if(r&&r.due<=now)out.push({set:s,w})}));return out}
function streak(sid){const a=P(sid).activity;let n=0;let d=new Date();if(!a[today()])d=new Date(Date.now()-DAY);while(a[d.toISOString().slice(0,10)]){n++;d=new Date(d.getTime()-DAY)}return n}
function stuSummary(sid){const p=P(sid);const vals=Object.values(p.words);return{learned:vals.length,mastered:vals.filter(r=>r.iv>=7).length,due:dueList(sid).length,tests:p.results.length,streak:streak(sid),last:Math.max(0,...vals.map(r=>r.last||0),...p.results.map(r=>r.date))}}

function isRight(q,ans){if(ans==null||ans==='')return false;if(q.t==='mc')return ans===q.a;if(q.t==='fill')return q.a.map(norm).includes(norm(ans));return false}
function ieltsBand(score,total){const r=Math.round(score/total*40);const m=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];for(const[k,b]of m)if(r>=k)return b;return 2}

 if(r.essay&&r.total===0){return r.essay.band!=null&&r.essay.band!==''?`Band ${r.essay.band}`:'Chờ chấm'}

}

/* --- Tổng hợp: mỗi câu một dạng (trắc nghiệm / ghép từ / nghe viết) xen kẽ --- */
let MX=null;
const MXLAB={mc:'Trắc nghiệm',match:'Ghép từ',spell:'Nghe & viết'};
function mxBuild(s){
 let ws=shuffle(s.words).slice(0,Math.min(16,s.words.length));const steps=[];
 const mc=w=>{const dir=Math.random()<.6?'en':'vi';const f=dir==='en'?'vi':'w';const opts=shuffle([w[f],...distractors(s,w,f)]);return{t:'mc',w,dir,opts,ans:opts.indexOf(w[f]),pick:null}};
 const mt=g=>({t:'match',ws:g,L:shuffle(g.map((_,i)=>i)),Rr:shuffle(g.map((_,i)=>i)),sl:null,sr:null,done:new Set(),err:0,bad:null});
 const sp=w=>({t:'spell',w,res:null,hint:0});
 let order=shuffle(['mc','match','spell']),last=null;
 while(ws.length){let t=order.length?order.shift():['mc','spell','match'][Math.floor(Math.random()*3)];
  if(t===last){const o=['mc','spell','match'].filter(y=>y!==last);t=o[Math.floor(Math.random()*o.length)]}
  if(t==='match'&&ws.length<4)t=last==='mc'?'spell':'mc';
  if(t==='match'){const n=Math.min(ws.length,4+Math.floor(Math.random()*2));steps.push(mt(ws.splice(0,n)))}
  else steps.push(t==='mc'?mc(ws.shift()):sp(ws.shift()));last=t}
 return {src:s.id,steps,i:0,ok:0,total:steps.reduce((a,x)=>a+(x.t==='match'?x.ws.length:1),0),per:{mc:[0,0],match:[0,0],spell:[0,0]},spoken:-1};
}
function mxScore(t,ok,n){MX.ok+=ok;MX.per[t][0]+=ok;MX.per[t][1]+=n}
VIEWS.mixed=()=>{
 const s=setById(R.id);if(!s)return '<div class="empty">Không tìm thấy bộ từ.</div>';
 if(!MX||MX.src!==s.id)MX=mxBuild(s);
 const x=MX,back=`MX=null;go('set',{id:'${s.id}'})`;
 if(x.i>=x.steps.length){const pct=x.total?Math.round(x.ok/x.total*100):0;if(!x.cele){x.cele=1;if(pct>=50)setTimeout(celebrate,250)}
  return `<div class="fc-wrap"><div class="card" style="text-align:center">${DONE_RING}<h2>Hoàn thành bài tổng hợp</h2><div class="big-score">${x.ok}/${x.total}</div><p class="muted">${pct}% đúng · ${h(s.title)}</p>
  <div class="mt" style="text-align:left">${Object.entries(x.per).filter(([k,v])=>v[1]).map(([k,v])=>`<div class="list-item"><span>${MXLAB[k]}</span><span class="tag ${v[0]/v[1]>=.7?'ok':v[0]/v[1]>=.4?'warn':'bad'}">${v[0]}/${v[1]}</span></div>`).join('')}</div>
  <div class="row mt" style="justify-content:center"><button class="btn" onclick="MX=null;render()">Làm lại</button><button class="btn pri" onclick="${back}">Xong</button></div></div></div>`}
 const st=x.steps[x.i];let body='';
 if(st.t==='mc'){const it=st;
  body=`<div class="small muted">${it.dir==='en'?'Nghĩa của từ này là gì?':'Từ tiếng Anh nào có nghĩa này?'}</div>
  <div class="row mt"><div class="qbig">${h(it.dir==='en'?it.w.w:it.w.vi)}</div>${it.dir==='en'?`<button class="spk" onclick="speak('${jsq(it.w.w)}')"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>`:''}</div>
  <div class="opts">${it.opts.map((o,i)=>{let c='';if(it.pick!=null){if(i===it.ans)c='right';else if(i===it.pick)c='wrong'}return `<button class="opt ${c}" onclick="mxMC(${i})" ${it.pick!=null?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${h(o)}</span></button>`}).join('')}</div>
  ${it.pick!=null?`<div class="mt small">${it.pick===it.ans?'<b style="color:var(--ok)">Chính xác!</b>':'<b style="color:var(--bad)">Chưa đúng.</b>'} <b>${h(it.w.w)}</b> = ${h(it.w.vi)}</div><button class="btn pri mt" onclick="mxNext()">Tiếp →</button>`:''}`}
 else if(st.t==='spell'){const w=st.w;const hint=w.w.split('').map((c,i)=>i<st.hint||c===' '?c:'_').join(' ');
  body=`<div style="text-align:center"><div class="small muted">Nghe rồi gõ lại từ</div><div class="row mt" style="justify-content:center"><button class="spk" style="width:64px;height:64px" onclick="speak('${jsq(w.w)}')"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button><button class="spk" title="Đọc chậm" onclick="speak('${jsq(w.w)}',0.55)">🐢</button></div>
  <p class="mt"><b>Nghĩa:</b> ${h(w.vi)} <span class="muted small">(${h(w.pos||'')})</span></p><p class="muted" style="letter-spacing:2px;font-family:var(--sans)">${h(hint)}</p>
  <input type="text" id="mxin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ bạn nghe được" style="text-align:center;font-size:18px;max-width:340px" onkeydown="if(event.key==='Enter')${st.res?'mxNext()':'mxSpell()'}" ${st.res?'disabled':''} value="${st.res?h(st.res.v):''}">
  ${st.res?`<div class="mt">${st.res.ok?'<b style="color:var(--ok)">Chính xác!</b>':`<b style="color:var(--bad)">Đáp án:</b> <b>${h(w.w)}</b>`}</div><button class="btn pri mt" onclick="mxNext()">Tiếp →</button>`:`<div class="row mt" style="justify-content:center"><button class="btn" onclick="MX.steps[MX.i].hint++;render()">Gợi ý chữ cái</button><button class="btn pri" onclick="mxSpell()">Kiểm tra</button></div>`}</div>`}
 else{const m=st;const fin=m.done.size===m.ws.length;
  body=`<div class="small muted mb">Chọn một từ bên trái và nghĩa tương ứng bên phải.</div><div class="match"><div class="grid" style="gap:10px">${m.L.map(i=>`<div class="mi ${m.done.has(i)?'done':''} ${m.sl===i?'sel':''} ${m.bad&&m.bad[0]===i?'err':''}" onclick="mxPick('l',${i})">${h(m.ws[i].w)}</div>`).join('')}</div>

/* --- Thẻ ghi nhớ --- */
let FC=null;
function buildFC(items,title,back,limit){
 const p=P();const now=Date.now();
 const sc=it=>{const r=p.words[wkey(it.set.id,it.w.w)];if(!r)return 1;if(r.due<=now)return 0;return 2};
 items=shuffle(items).sort((a,b)=>sc(a)-sc(b));
 if(limit)items=items.slice(0,limit);
 FC={q:items,i:0,flip:false,title,back,done:0,more:!!limit};
}
VIEWS.flash=()=>{
 if(!FC||FC.src!==R.id){const s=setById(R.id);buildFC(s.words.map(w=>({set:s,w})),s.title,`go('set',{id:'${s.id}'})`,20);FC.src=R.id}
 return fcView();
};
VIEWS.review=()=>{
 if(!FC||FC.src!=='__review'){buildFC(dueList(U.id),'Ôn tập hôm nay',`go('vocab')`);FC.src='__review'}

};

 const it=f.q[f.i];const w=it.w;
 return `<div class="fc-wrap"><div class="crumb" onclick="FC=null;${f.back}">← ${h(f.title)}</div>
 <div class="row between mb"><span class="small muted">Thẻ ${f.i+1}/${f.q.length}</span><span class="small muted">Dấu cách: lật · 1–4: đánh giá</span></div>
 <div class="bar mb"><i style="width:${f.i/f.q.length*100}%"></i></div>
 <div class="flash ${f.flip?'flip':''} ${f.dealt!==f.i?'deal':''}" onclick="fcFlip()" onpointermove="fcTilt(event,this)" onpointerleave="fcTilt(null,this)"><div class="in">
  <div class="face"><div class="word">${h(w.w)}</div><div class="ipa">${h(w.pos||'')} ${h(w.ipa||'')}</div><div class="mt"><button class="spk" onclick="event.stopPropagation();speak('${jsq(w.w)}')"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button></div><div class="small muted mt">Bấm vào thẻ để xem nghĩa</div></div>
  <div class="face back"><div class="vi">${h(w.vi)}</div><div class="ipa">${h(w.w)} ${h(w.ipa||'')}</div>${w.ex?`<div class="ex">“${h(w.ex)}”</div>`:''}</div>
 </div></div>
 ${(f.dealt=f.i,'')}${f.flip?(()=>{const k=wkey(it.set.id,w.w);return `<div class="rate"><button class="r1" onclick="fcRate(1)">Quên<small>ôn lại ${ivPreview(k,1)}</small></button><button class="r2" onclick="fcRate(3)">Khó<small>ôn lại ${ivPreview(k,3)}</small></button><button class="r3" onclick="fcRate(4)">Nhớ<small>ôn lại ${ivPreview(k,4)}</small></button><button class="r4" onclick="fcRate(5)">Dễ<small>ôn lại ${ivPreview(k,5)}</small></button></div>`})():`<button class="btn pri mt" style="width:100%" onclick="fcFlip()">Lật thẻ</button>`}
 </div>`;
}
function ivPreview(key,q){const c=Object.assign({ef:2.5,iv:0,reps:0},P().words[key]||{});if(q<3)return 'sau 10 phút';const reps=c.reps+1;let iv=reps===1?(q===5?3:1):reps===2?(q===5?6:3):Math.round(c.iv*c.ef*(q===5?1.3:q===3?0.8:1));iv=Math.max(1,iv);return iv===1?'ngày mai':iv<31?`sau ${iv} ngày`:`sau ${Math.round(iv/30)} tháng`}
function fcTilt(e,el){if(matchMedia('(prefers-reduced-motion: reduce)').matches||(e&&e.pointerType!=='mouse'))return;const inn=el.querySelector('.in');if(!e){inn.style.removeProperty('--rx');inn.style.removeProperty('--ry');return}const b=el.getBoundingClientRect();const x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;inn.style.setProperty('--rx',(-y*7).toFixed(2)+'deg');inn.style.setProperty('--ry',(x*9).toFixed(2)+'deg')}
function fcFlip(){FC.flip=!FC.flip;if(FC.flip)speak(FC.q[FC.i].w.w);render()}
function fcRate(q){const it=FC.q[FC.i];grade(wkey(it.set.id,it.w.w),q);FC.done++;if(q===1)FC.q.push(it);FC.i++;FC.flip=false;render()}
document.addEventListener('keydown',e=>{

let QZ=null;
function distractors(set,w,field){const pool=[...set.words,...allSets().filter(s=>s.id!==set.id).flatMap(s=>s.words)].filter(x=>x.w!==w.w);const seen=new Set([w[field]]);const out=[];for(const x of shuffle(pool)){if(!seen.has(x[field])){seen.add(x[field]);out.push(x[field])}if(out.length===3)break}return out}

 const it=q.items[q.i];
 return `<div class="fc-wrap"><div class="crumb" onclick="QZ=null;go('set',{id:'${s.id}'})">← ${h(s.title)}</div>

 <div class="card"><div class="small muted">${it.dir==='en'?'Nghĩa của từ này là gì?':'Từ tiếng Anh nào có nghĩa này?'}</div>
 <div class="row mt"><div class="qbig">${h(it.dir==='en'?it.w.w:it.w.vi)}</div>${it.dir==='en'?`<button class="spk" onclick="speak('${jsq(it.w.w)}')"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>`:''}</div>
 <div class="opts">${it.opts.map((o,i)=>{let c='';if(it.pick!=null){if(i===it.ans)c='right';else if(i===it.pick)c='wrong'}return `<button class="opt ${c}" onclick="qzPick(${i})" ${it.pick!=null?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${h(o)}</span></button>`}).join('')}</div>
 ${it.pick!=null?`<div class="mt small">${it.pick===it.ans?'<b style="color:var(--ok)">Chính xác!</b>':'<b style="color:var(--bad)">Chưa đúng.</b>'} <b>${h(it.w.w)}</b> = ${h(it.w.vi)}${it.w.ex?` · <i>${h(it.w.ex)}</i>`:''}</div><button class="btn pri mt" onclick="QZ.i++;render()">Tiếp →</button>`:''}
 </div></div>`;
};

function testCard(t,asg){const n=flatQs(t).length;const b=bestPct(U.id,t.id);const tries=P().results.filter(r=>r.testId===t.id).length;
 return `<div class="card tcard" ${t.skill?`data-skill="${h(t.skill)}"`:''}><div class="row between"><span class="tag ${t.skill?'sk':t.type==='ielts'?'':'acc'}">${h(t.skill||(t.type==='ielts'?'IELTS':'THPT'))}</span>${asg.has(t.id)?'<span class="tag warn">Được giao</span>':''}</div>
  <h3 class="mt" data-vt="${t.id}">${h(t.title)}</h3><p class="small muted" style="margin:0">${h(t.desc||'')}</p>
  <p class="small muted">${n} câu · ${t.minutes} phút${tries?` · đã làm ${tries} lần`:''}${b!=null?` · tốt nhất ${Math.round(b*100)}%`:''}</p>
  <button class="btn pri" onclick="go('test',{id:'${t.id}'})">${tries?'Làm lại':'Bắt đầu'}</button></div>`}
const volNum=v=>{const m=/(\d+)/.exec(v||'');return m?+m[1]:999};
const volSort=(a,b)=>volNum(a)-volNum(b)||String(a).localeCompare(String(b));
const VOLSEL={Reading:'all',Listening:'all'};
function skillTests(sk){
 const asg=new Set(myAssignments(U.id).filter(a=>a.kind==='test').map(a=>a.ref));
 const all=allTests().filter(t=>t.type==='ielts'&&(t.skill||'Reading')===sk);
 const vols=[...new Set(all.map(t=>t.vol||'Đề của giáo viên'))].sort(volSort);
 if(VOLSEL[sk]!=='all'&&!vols.includes(VOLSEL[sk]))VOLSEL[sk]='all';
 const show=VOLSEL[sk]==='all'?vols:[VOLSEL[sk]];
 const doneIds=new Set(P().results.map(r=>r.testId));
 const intro=sk==='Reading'?'Đọc hiểu theo bộ đề Vol: True/False/Not Given, trắc nghiệm, điền từ. Có bút dạ và chế độ tập trung khi làm bài.':'Nghe theo bộ đề Vol, 4 section và 40 câu mỗi đề. Hãy đeo tai nghe trước khi bắt đầu.';
 return `<h1>IELTS ${sk}</h1><p class="sub">${intro}</p>
 <div class="seg mb"><button class="${VOLSEL[sk]==='all'?'on':''}" onclick="VOLSEL['${sk}']='all';render()">Tất cả</button>${vols.map(v=>`<button class="${VOLSEL[sk]===v?'on':''}" onclick="VOLSEL['${sk}']=${h(JSON.stringify(v))};render()">${h(v)}</button>`).join('')}</div>
 ${show.length?show.map(v=>{const ts=all.filter(t=>(t.vol||'Đề của giáo viên')===v);const dn=ts.filter(t=>doneIds.has(t.id)).length;
  return `<div class="volhead"><h2>${h(v)}</h2><span class="vm">${ts.length} đề${dn?` · đã làm ${dn}`:''}</span></div><div class="grid g2">${ts.map(t=>testCard(t,asg)).join('')}</div>`}).join(''):'<div class="card empty">Chưa có đề nào trong mục này.</div>'}`;
}
VIEWS.reading=()=>skillTests('Reading');
VIEWS.listening=()=>skillTests('Listening');
VIEWS.exam=()=>{
 const asg=new Set(myAssignments(U.id).filter(a=>a.kind==='test').map(a=>a.ref));
 const ts=allTests().filter(t=>t.type==='thpt');
 return `<h1>Tiếng Anh phổ thông</h1><p class="sub">Đề do giáo viên soạn, có tính giờ và chấm điểm ngay.</p><div class="grid g2">${ts.length?ts.map(t=>testCard(t,asg)).join(''):'<div class="card empty">Chưa có đề nào.</div>'}</div>`;
};

let EX=null;
VIEWS.test=()=>{
 const t=testById(R.id);if(!t)return '<div class="empty">Không tìm thấy đề.</div>';

function initPlayer(el){
 if(el._init)return;el._init=1;
 const a=new Audio();a.preload='metadata';a.src=el.dataset.src;
 const btn=el.querySelector('.pp'),cv=el.querySelector('.wv'),tm=el.querySelector('.tm');
 const N=160;let seed=0;for(const ch of el.dataset.src)seed=(seed*31+ch.charCodeAt(0))>>>0;
 const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 const base=Array.from({length:N},(_,i)=>.28+.5*Math.abs(Math.sin(i*.37+rnd()*2))*(.6+.4*rnd()));
 let live=new Float32Array(N).fill(0),raf=0;
 const fmtT=x=>isFinite(x)?`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`:'--:--';
 const css=v=>getComputedStyle(el).getPropertyValue(v).trim();
 function draw(){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,hh=cv.clientHeight;if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=hh*dpr}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,hh);
  const pr=a.duration?a.currentTime/a.duration:0,on=css('--sk')||'#233f7a',off=css('--line2')||'#ccc';
  const M=Math.max(24,Math.min(N,Math.floor(w/6)));
  if(!a.paused){const t=performance.now()/1000,ph=pr*M;for(let i=0;i<M;i++){const near=Math.max(0,1-Math.abs(i-ph)/9);const v=near*(.35+.3*Math.sin(t*7+i*1.3)*Math.sin(t*3.1+i*.7));live[i]+=(v-live[i])*.25}}
  else for(let i=0;i<M;i++)live[i]*=.9;
  const gap=3,bw=Math.max(1.5,(w-gap*(M-1))/M);
  for(let i=0;i<M;i++){const amp=Math.min(1,base[i]*.55+live[i]*.75);const bh=Math.max(3,amp*hh);const x=i*(bw+gap);
   g.fillStyle=(i+.5)/M<=pr?on:off;g.beginPath();g.roundRect?g.roundRect(x,(hh-bh)/2,bw,bh,bw/2):g.rect(x,(hh-bh)/2,bw,bh);g.fill()}
  tm.textContent=`${fmtT(a.currentTime)} / ${fmtT(a.duration)}`;
  if(!a.paused||live.some(v=>v>.01))raf=requestAnimationFrame(draw);else raf=0;
 }
 const kick=()=>{if(!raf)raf=requestAnimationFrame(draw)};
 const icon=()=>{btn.innerHTML=a.paused?'<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>':'<svg viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="4" height="13" rx="1"/><rect x="13.5" y="5.5" width="4" height="13" rx="1"/></svg>'};
 btn.onclick=()=>{
  if(a.paused){
   document.querySelectorAll('.player').forEach(o=>{if(o!==el&&o._a&&!o._a.paused)o._a.pause()});
   a.play().catch(()=>{});

 };
 el._a=a;

 let drag=false;cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);seek(e)};cv.onpointermove=e=>{if(drag)seek(e)};cv.onpointerup=()=>{drag=false};
 a.addEventListener('loadedmetadata',()=>{el.classList.remove('loading');kick()});

 a.addEventListener('timeupdate',kick);
 a.addEventListener('error',()=>{if(!el.dataset.fb){tm.textContent='Không phát được';return}const w=document.createElement('div');w.className='dframe';const f=document.createElement('iframe');f.src=el.dataset.fb;f.allow='autoplay';f.title='Bài nghe';f.setAttribute('scrolling','no');w.appendChild(f);el.replaceWith(w)});
 requestAnimationFrame(draw);
}

function chartSVG(c){
 const W=560,H=300,pl=46,pr=12,pt=14,pb=56;const cols=['#1f6f5c','#e0913a','#5b7bd5','#b04a8a'];
 const max=Math.max(...c.series.flatMap(s=>s.data));const top=Math.ceil(max/(max>100?100:10))*(max>100?100:10)||10;
 const iw=W-pl-pr,ih=H-pt-pb;const y=v=>pt+ih-(v/top)*ih;let g='';
 for(let i=0;i<=5;i++){const v=top*i/5;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".12"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".7">${Math.round(v)}</text>`}
 const n=c.labels.length;const bw=iw/n;
 c.labels.forEach((l,i)=>{g+=`<text x="${pl+bw*i+bw/2}" y="${pt+ih+16}" text-anchor="middle" font-size="12" fill="currentColor">${h(l)}</text>`});
 if(c.type==='line'){c.series.forEach((s,si)=>{const pts=s.data.map((v,i)=>`${pl+bw*i+bw/2},${y(v)}`).join(' ');g+=`<polyline points="${pts}" fill="none" stroke="${cols[si%4]}" stroke-width="2.5"/>`+s.data.map((v,i)=>`<circle cx="${pl+bw*i+bw/2}" cy="${y(v)}" r="3.5" fill="${cols[si%4]}"><title>${h(s.name)}: ${v}</title></circle>`).join('')})}
 else{const k=c.series.length;const gw=bw*0.72;const one=gw/k;c.series.forEach((s,si)=>s.data.forEach((v,i)=>{const x=pl+bw*i+(bw-gw)/2+one*si;g+=`<rect x="${x}" y="${y(v)}" width="${one-2}" height="${pt+ih-y(v)}" fill="${cols[si%4]}" rx="2"><title>${h(s.name)}: ${v}</title></rect>`}))}
 const lg=c.series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="width:12px;height:12px;border-radius:3px;background:${cols[si%4]};display:inline-block"></i>${h(s.name)}</span>`).join('');
 return `<div style="color:var(--ink)"><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img"><text x="${pl}" y="${pt-2}" font-size="11" fill="currentColor" opacity=".7">${h(c.unit||'')}</text>${g}</svg><div class="small">${lg}</div></div>`;
}

/* --- Phân tích văn bản tự động --- */
const LINKERS=['however','moreover','furthermore','in addition','therefore','consequently','as a result','for example','for instance','on the other hand','in contrast','although','whereas','while','firstly','secondly','finally','in conclusion','to sum up','overall','in my opinion','because','since','despite','nevertheless','similarly','meanwhile','such as','thus','hence'];
const STOP=new Set('the a an and or but of to in on at for with is are was were be been being it this that these those i you he she we they my your our their its as by from not have has had do does did can could will would should may might must so if than then there here what which who when where why how very more most also about into over just some any all no one two'.split(' '));
const FILLERS=['um','uh','er','erm','ah','hmm','you know','i mean','basically'];
function textStats(t){
 const words=(t.toLowerCase().match(/[a-z']+/g)||[]);const n=words.length;
 const sents=t.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
 const paras=t.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).length||(t.trim()?1:0);
 const low=' '+t.toLowerCase().replace(/[^a-z' ]+/g,' ')+' ';
 const link=LINKERS.filter(l=>low.includes(' '+l+' '));
 const freq={};words.filter(w=>!STOP.has(w)&&w.length>3).forEach(w=>freq[w]=(freq[w]||0)+1);
 const rep=Object.entries(freq).filter(([w,c])=>c>=4).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const uniq=new Set(words).size;const longW=words.filter(w=>w.length>=8).length;
 const fill=FILLERS.map(f=>[f,(low.match(new RegExp(' '+f+' ','g'))||[]).length]).filter(x=>x[1]);
 return{n,sents:sents.length,paras,link,rep,uniq,ttr:n?uniq/n:0,longW,avgSent:sents.length?n/sents.length:0,fill};
}
function statsHTML(st,opt){
 opt=opt||{};const tips=[];
 if(opt.min&&st.n<opt.min)tips.push(`Bài mới có ${st.n} từ, cần tối thiểu ${opt.min} từ.`);
 if(opt.writing){if(st.paras<(opt.task===1?3:4))tips.push(`Nên chia ${opt.task===1?'3–4':'4–5'} đoạn (hiện có ${st.paras}). Để một dòng trống giữa các đoạn.`);
  if(st.link.length<4)tips.push('Dùng thêm từ nối (however, moreover, as a result…) để bài mạch lạc hơn.');
  if(st.avgSent>30)tips.push('Câu khá dài, thử tách bớt cho dễ đọc.');}
 if(st.rep.length)tips.push('Từ lặp nhiều: '+st.rep.map(([w,c])=>`<b>${h(w)}</b> ×${c}`).join(', ')+'. Thử dùng từ đồng nghĩa.');
 if(opt.speaking){if(opt.wpm&&opt.wpm<90)tips.push('Tốc độ nói hơi chậm, hãy luyện nói trôi chảy hơn.');if(st.fill.length)tips.push('Từ đệm: '+st.fill.map(([w,c])=>`<b>${h(w)}</b> ×${c}`).join(', ')+'.');if(opt.dur&&opt.dur<opt.target*0.5)tips.push(`Câu trả lời hơi ngắn, nên nói khoảng ${opt.target} giây.`)}
 return `<div class="grid g4 mt" style="gap:8px">
  <div class="card stat"><div class="n">${st.n}</div><div class="l">Số từ</div></div>
  ${opt.speaking?`<div class="card stat"><div class="n">${opt.wpm||'–'}</div><div class="l">Từ/phút</div></div><div class="card stat"><div class="n">${opt.dur||0}s</div><div class="l">Thời lượng</div></div>`:`<div class="card stat"><div class="n">${st.paras}</div><div class="l">Đoạn văn</div></div><div class="card stat"><div class="n">${st.link.length}</div><div class="l">Từ nối</div></div>`}
  <div class="card stat"><div class="n">${Math.round(st.ttr*100)}%</div><div class="l">Độ đa dạng từ</div></div></div>
  ${tips.length?`<div class="explain mt">💡 ${tips.join('<br>💡 ')}</div>`:'<div class="explain mt" style="background:var(--ok-soft)">👍 Không có vấn đề lớn về độ dài và cách dùng từ.</div>'}
  <p class="small muted">Đây là gợi ý tự động dựa trên số liệu, không phải điểm. Giáo viên sẽ chấm band.</p>`;
}
const bandAvg=a=>{const v=a.map(Number).filter(x=>!isNaN(x));if(v.length<a.length)return null;return Math.round(v.reduce((s,x)=>s+x,0)/v.length*2)/2};

/* --- IndexedDB lưu file ghi âm --- */
const IDB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open('lopta_audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
 async put(k,v){try{const db=await this.open();db.transaction('a','readwrite').objectStore('a').put(v,k)}catch(e){}},
 async get(k){try{const db=await this.open();return await new Promise(r=>{const q=db.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const REC={on:false,mr:null,chunks:[],stream:null,rec:null,final:'',interim:'',t0:0,tick:null,blob:null,url:null,limit:0};
async function recStart(limit){
 if(REC.on)return;REC.final='';REC.interim='';REC.chunks=[];REC.blob=null;if(REC.url){URL.revokeObjectURL(REC.url);REC.url=null}REC.limit=limit||0;
 try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Không truy cập được micro. Hãy cho phép trình duyệt dùng micro.');return false}
 try{REC.mr=new MediaRecorder(REC.stream);REC.mr.ondataavailable=e=>e.data.size&&REC.chunks.push(e.data);REC.mr.onstop=()=>{REC.blob=new Blob(REC.chunks,{type:REC.mr.mimeType||'audio/webm'});REC.url=URL.createObjectURL(REC.blob);REC.stream.getTracks().forEach(t=>t.stop());if(REC.onDone)REC.onDone()};REC.mr.start()}catch(e){toast('Trình duyệt không hỗ trợ ghi âm');return false}
 if(SR){try{const r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=true;r.onresult=ev=>{let it='';for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)REC.final+=x[0].transcript.trim()+' ';else it+=x[0].transcript}REC.interim=it;const el=$('#live');if(el)el.textContent=(REC.final+REC.interim)||'…'};r.onend=()=>{if(REC.on)try{r.start()}catch(e){}};r.start();REC.rec=r}catch(e){}}
 REC.on=true;REC.t0=Date.now();
 REC.tick=setInterval(()=>{const s=Math.floor((Date.now()-REC.t0)/1000);const el=$('#rtime');if(el)el.textContent=fmtSec(s)+(REC.limit?' / '+fmtSec(REC.limit):'');if(REC.limit&&s>=REC.limit)recStop()},250);
 return true;
}
function recStop(){if(!REC.on)return;REC.on=false;clearInterval(REC.tick);REC.dur=Math.round((Date.now()-REC.t0)/1000);try{REC.rec&&REC.rec.stop()}catch(e){}REC.rec=null;try{REC.mr.state!=='inactive'&&REC.mr.stop()}catch(e){}}
const fmtSec=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

function reviewView(){
 const sid=R.sid;const p=P(sid);const isT=U.role==='teacher';const back=isT?(R.tf?`go('t-fullrun',{id:'${R.tf}',sid:'${sid}'})`:`go('t-grade')`):R.full?`go('fullrun',{id:'${R.full}'})`:(R.kind==='speaking'?`go('speaking')`:`go('writing')`);
 if(R.kind==='speaking'){
  const x=(p.speaking||[]).find(a=>a.id===R.rid);if(!x)return '<div class="empty">Không tìm thấy.</div>';const g=x.grade||{};
  return `<div class="crumb" onclick="${back}">← Quay lại</div>${fullBar()}<h1>${x.mock?'Thi thử Speaking':'Speaking · '+h(x.title)}</h1><p class="sub">${isT?h((stuById(sid)||{}).name||'')+' · ':''}${fdt(x.date)}</p>
  ${gradeBox('speaking',sid,x,['Fluency & Coherence','Lexical Resource','Grammar Range & Accuracy','Pronunciation'],['fc','lr','gra','pr'])}
  ${x.items.map((it,i)=>{const st=textStats(it.text);return `<div class="card mt"><span class="tag ${it.part===2?'acc':''}">Part ${it.part}</span> <b>${h(it.q)}</b>${it.audio?`<audio controls id="au_${x.id}_${i}" style="width:100%;margin-top:10px"></audio>`:''}<div class="passage mt" style="background:var(--bg)">${h(it.text)||'<i class="muted">(không có lời chép)</i>'}</div><div class="small muted mt">${it.dur}s · ${it.words} từ · ${it.wpm} từ/phút · đa dạng từ ${Math.round(st.ttr*100)}%${st.fill.length?' · từ đệm: '+st.fill.map(f=>f[0]+'×'+f[1]).join(', '):''}</div></div>`}).join('')}`;
 }
 const x=(p.writings||[]).find(a=>a.id===R.rid);if(!x)return '<div class="empty">Không tìm thấy.</div>';const w=wById(x.promptId);
 return `<div class="crumb" onclick="${back}">← Quay lại</div>${fullBar()}<h1>Writing Task ${w?w.task:''} · ${h(w?w.title:'(đề đã xóa)')}</h1><p class="sub">${isT?h((stuById(sid)||{}).name||'')+' · ':''}${fdt(x.date)} · ${wc(x.text)} từ · làm trong ${Math.round(x.dur/60)} phút</p>
 ${gradeBox('writing',sid,x,[w&&w.task===1?'Task Achievement':'Task Response','Coherence & Cohesion','Lexical Resource','Grammar Range & Accuracy'],['tr','cc','lr','gra'])}
 ${w?`<details class="card mt"><summary><b>Xem đề bài</b></summary><p>${fmt(w.prompt)}</p>${w.chart?chartSVG(w.chart):''}${w.img?`<img src="${h(w.img)}" style="max-width:100%">`:''}</details>`:''}
 ${w&&w.model?`<details class="card mt"><summary><b>Xem bài mẫu (band 8.0+)</b></summary><p class="small muted">Bài mẫu để tham khảo cách triển khai ý, không phải đáp án duy nhất.</p><p>${fmt(w.model)}</p></details>`:''}
 <div class="card mt"><h3>Bài viết</h3><div class="passage" style="background:var(--bg)">${h(x.text)}</div>${statsHTML(textStats(x.text),{writing:true,task:w?w.task:2,min:w?w.min:0})}</div>`;
}
AFTER.skres=AFTER['t-review']=()=>{if(R.kind!=='speaking')return;const x=(P(R.sid).speaking||[]).find(a=>a.id===R.rid);if(!x)return;x.items.forEach(async(it,i)=>{if(!it.audio)return;const b=await IDB.get(x.id+'_'+i);const el=$(`#au_${x.id}_${i}`);if(el){if(b)el.src=URL.createObjectURL(b);else el.replaceWith(Object.assign(document.createElement('div'),{className:'small muted',textContent:'(File ghi âm chỉ nghe được trên máy học viên đã ghi)'}))}})};
function gradeBox(kind,sid,x,labels,keys){
 const g=x.grade||{};
 if(U.role==='teacher')return `<div class="card"><h2>Chấm điểm</h2><div class="grid g4" style="gap:10px">${labels.map((l,i)=>`<div><label class="f">${l}</label><input type="number" min="0" max="9" step="0.5" id="g_${keys[i]}" value="${g[keys[i]]??''}"></div>`).join('')}</div>
  <label class="f">Nhận xét cho học viên</label><textarea class="prose" style="min-height:110px" id="g_com">${h(g.comment||'')}</textarea>
  <div class="row mt"><button class="btn pri" onclick="saveSWGrade('${kind}','${sid}','${x.id}',${h(JSON.stringify(keys))})">Lưu điểm</button>${g.band!=null?`<span class="tag ok">Overall ${g.band}</span>`:''}</div></div>`;
 if(g.band==null)return `<div class="card"><span class="tag warn">Đang chờ giáo viên chấm</span></div>`;
 return `<div class="card" style="text-align:center"><div class="big-score">Band ${g.band}</div><div class="grid g4 mt" style="gap:8px">${labels.map((l,i)=>`<div class="card stat"><div class="n">${g[keys[i]]??'–'}</div><div class="l">${l}</div></div>`).join('')}</div>${g.comment?`<div class="explain mt" style="text-align:left"><b>Nhận xét của giáo viên:</b><br>${fmt(g.comment)}</div>`:''}</div>`;
}
function saveSWGrade(kind,sid,id,keys){const list=kind==='speaking'?P(sid).speaking:P(sid).writings;const x=list.find(a=>a.id===id);const g={};keys.forEach(k=>{const v=$('#g_'+k).value;g[k]=v===''?null:+v});g.band=bandAvg(keys.map(k=>g[k]));g.comment=$('#g_com').value;g.gradedAt=Date.now();x.grade=g;save();render();toast(g.band!=null?`Đã lưu. Overall band ${g.band}`:'Đã lưu nhận xét (chưa đủ 4 tiêu chí để tính band)')}

 ${wTab==='mine'?wHistory(U.id):`<div class="grid g2">${allW().filter(w=>w.task===wTab).map(w=>`<div class="card"><div class="row between"><span class="tag ${w.task===1?'acc':''}">Task ${w.task}</span>${asg.has(w.id)?'<span class="tag warn">Được giao</span>':''}</div><h3 class="mt">${h(w.title)}</h3><p class="small muted" style="margin:0 0 8px">${h(w.prompt.split('\n')[0]).slice(0,150)}</p><p class="small muted">${w.minutes} phút · tối thiểu ${w.min} từ${cnt(w.id)?` · đã viết ${cnt(w.id)} lần`:''}</p><button class="btn pri" onclick="wStart('${w.id}')">Viết bài</button></div>`).join('')}</div>`}`;

function wHistory(sid){const l=(P(sid).writings||[]).slice().reverse();if(!l.length)return '<div class="card empty">Chưa có bài viết nào.</div>';
 return `<div class="card">${l.map(x=>{const w=wById(x.promptId);return `<div class="list-item"><div><b class="small">${w?'Task '+w.task+' · '+h(w.title):'(đề đã xóa)'}</b><div class="small muted">${fdt(x.date)} · ${wc(x.text)} từ</div></div><div class="row">${x.grade&&x.grade.band!=null?`<span class="tag ok">Band ${x.grade.band}</span>`:'<span class="tag warn">Chờ chấm</span>'}<button class="btn sm" onclick="go('${U.role==='teacher'?'t-review':'wres'}',{kind:'writing',rid:'${x.id}',sid:'${sid}'})">Xem</button></div></div>`}).join('')}</div>`}

function wStart(id,o){const w=wById(id);let d='';try{d=localStorage.getItem(draftKey(id))||''}catch(e){}WR=Object.assign({id,t0:Date.now(),end:Date.now()+w.minutes*60000,text:d},o||{});render()}

 return `<div class="exam-head"><div class="row between"><b style="flex:1;min-width:0">Writing Task ${w.task} · ${h(w.title)}</b><span class="timer" id="timer"></span><button class="btn ghost" onclick="wQuit()">Thoát</button><button class="btn pri" onclick="wSubmit()">Nộp bài</button></div></div>

 <div class="card"><p>${fmt(w.prompt)}</p>${w.chart?chartSVG(w.chart):''}${w.img?`<img src="${h(w.img)}" style="max-width:100%">`:''}<p class="small muted">Viết ít nhất ${w.min} từ.</p></div>
 <div class="card"><textarea class="prose" id="wtext" style="min-height:420px" placeholder="Viết bài ở đây. Để một dòng trống giữa các đoạn." oninput="wInput(this.value)">${h(WR.text)}</textarea><div class="row between small mt"><span>Số từ: <b id="wwc">${wc(WR.text)}</b> / ${w.min}</span><span class="muted" id="wsaved">Bản nháp tự lưu</span></div></div></div>`}
AFTER.writing=()=>{if(!WR)return;clearInterval(timerH);const tick=()=>{const left=Math.max(0,WR.end-Date.now());const el=$('#timer');if(!el){clearInterval(timerH);return}el.textContent=fmtSec(Math.floor(left/1000));el.classList.toggle('low',left<120000);if(left<=0){clearInterval(timerH);el.textContent='Hết giờ';}};tick();timerH=setInterval(tick,1000)};
function wInput(v){WR.text=v;$('#wwc').textContent=wc(v);try{localStorage.setItem(draftKey(WR.id),v)}catch(e){}}
function wQuit(){if(WR.text.trim()&&!confirm('Bản nháp được giữ lại để viết tiếp sau. Thoát?'))return;const fr=WR.full;WR=null;clearInterval(timerH);fr?go('fullrun',{id:fr}):go('writing')}
function wSubmit(){const w=wById(WR.id);const n=wc(WR.text);if(n<20){toast('Bài viết quá ngắn');return}if(!confirm(n<w.min?`Bài mới có ${n}/${w.min} từ. Vẫn nộp?`:'Nộp bài?'))return;
 const p=P();p.writings=p.writings||[];const x={id:uid('w'),promptId:w.id,text:WR.text,date:Date.now(),dur:Math.round((Date.now()-WR.t0)/1000),grade:null};p.writings.push(x);const fr=WR.full;if(fr)fullMark(fr,WR.fpart,x.id);bump();save();try{localStorage.removeItem(draftKey(w.id))}catch(e){}WR=null;clearInterval(timerH);go('wres',{kind:'writing',rid:x.id,sid:U.id,full:fr})}

 const all=[];D.students.forEach(s=>{const p=P(s.id);(p.writings||[]).forEach(x=>all.push({s,kind:'writing',x}));(p.speaking||[]).forEach(x=>all.push({s,kind:'speaking',x}))});
 const pend=all.filter(a=>!a.x.grade||a.x.grade.band==null);const list=(gradeTab==='pending'?pend:all).sort((a,b)=>b.x.date-a.x.date);

 <div class="card">${list.length?list.map(({s,kind,x})=>{const t=kind==='writing'?(()=>{const w=wById(x.promptId);return w?'Writing Task '+w.task+' · '+w.title:'Writing'})():(x.mock?'Speaking · Thi thử':'Speaking · '+x.title);
  return `<div class="list-item"><div><b>${h(s.name)}</b> <span class="small muted">${h(s.code)}</span><div class="small">${h(t)}</div><div class="small muted">${fdt(x.date)}</div></div><div class="row">${x.grade&&x.grade.band!=null?`<span class="tag ok">Band ${x.grade.band}</span>`:'<span class="tag warn">Chờ chấm</span>'}<button class="btn sm pri" onclick="go('t-review',{kind:'${kind}',rid:'${x.id}',sid:'${s.id}'})">Chấm</button></div></div>`}).join(''):'<div class="empty">Không có bài nào.</div>'}</div>`;

 <div class="volhead"><h2>Part 1</h2><span class="vm">${p1.length} chủ đề</span></div><div class="card">${p1.map(t=>`<div class="list-item"><div><b class="small">${h(t.title)}</b><div class="small muted">${t.qs.length} câu hỏi</div></div>${SP1.includes(t)?'<span class="tag gray">Mẫu</span>':`<div class="row"><button class="btn sm" onclick="spEditor(1,'${t.id}')">Sửa</button><button class="btn sm danger" onclick="delItem('sp1','${t.id}')">Xóa</button></div>`}</div>`).join('')||'<div class="empty">Chưa có chủ đề.</div>'}</div>
 <div class="volhead"><h2>Part 2 & 3</h2><span class="vm">${p2.length} đề</span></div><div class="card">${p2.map(t=>`<div class="list-item"><div><b class="small">${h(t.cue)}</b><div class="small muted">${t.p3.length} câu Part 3</div></div>${SP2.includes(t)?'<span class="tag gray">Mẫu</span>':`<div class="row"><button class="btn sm" onclick="spEditor(2,'${t.id}')">Sửa</button><button class="btn sm danger" onclick="delItem('sp2','${t.id}')">Xóa</button></div>`}</div>`).join('')||'<div class="empty">Chưa có đề.</div>'}</div>`};

function wEditor(id){const w=id?wById(id):null;modal(`<h2>${w?'Sửa':'Thêm'} đề Writing</h2>
 <div class="grid g2" style="gap:10px;grid-template-columns:1fr 1fr"><div><label class="f">Task</label><select id="we-t"><option value="1" ${w&&w.task===1?'selected':''}>Task 1</option><option value="2" ${!w||w.task===2?'selected':''}>Task 2</option></select></div><div><label class="f">Số phút</label><input type="number" id="we-m" value="${w?w.minutes:40}"></div></div>
 <label class="f">Tên ngắn</label><input type="text" id="we-n" value="${h(w?w.title:'')}">
 <label class="f">Đề bài</label><textarea class="prose" style="min-height:140px" id="we-p">${h(w?w.prompt:'')}</textarea>
 <label class="f">Link ảnh biểu đồ (Task 1, tùy chọn)</label><input type="text" id="we-i" value="${h(w&&w.img||'')}" placeholder="https://… hoặc images/ten-anh.png">
 <div class="row mt"><button class="btn pri" onclick="saveW('${w?w.id:''}')">Lưu</button><button class="btn ghost" onclick="modal('')">Hủy</button></div>`)}
function saveW(id){const t=+$('#we-t').value;const o={id:id||uid('wp'),task:t,title:$('#we-n').value.trim()||'Đề Writing',prompt:$('#we-p').value.trim(),minutes:+$('#we-m').value||(t===1?20:40),min:t===1?150:250,img:$('#we-i').value.trim()};if(!o.prompt){toast('Nhập đề bài');return}D.wprompts=D.wprompts||[];const i=D.wprompts.findIndex(x=>x.id===o.id);if(i>=0)D.wprompts[i]=o;else D.wprompts.push(o);save();modal('');render()}
function spEditor(part,id){const t=id?spTopicById(id):null;
 if(part===1)modal(`<h2>${t?'Sửa':'Thêm'} chủ đề Part 1</h2><label class="f">Chủ đề</label><input type="text" id="se1-t" value="${h(t?t.title:'')}" placeholder="Ví dụ: Music"><label class="f">Câu hỏi (mỗi dòng một câu)</label><textarea class="prose" id="se1-q">${h(t?t.qs.join('\n'):'')}</textarea><div class="row mt"><button class="btn pri" onclick="saveSP(1,'${t?t.id:''}')">Lưu</button><button class="btn ghost" onclick="modal('')">Hủy</button></div>`);
 else modal(`<h2>${t?'Sửa':'Thêm'} đề Part 2 & 3</h2><label class="f">Đề Part 2 (cue card)</label><input type="text" id="se2-c" value="${h(t?t.cue:'')}" placeholder="Describe a…"><label class="f">Gợi ý "You should say" (mỗi dòng một ý)</label><textarea class="prose" style="min-height:100px" id="se2-p">${h(t?t.points.join('\n'):'')}</textarea><label class="f">Câu hỏi Part 3 (mỗi dòng một câu)</label><textarea class="prose" style="min-height:100px" id="se2-q">${h(t?t.p3.join('\n'):'')}</textarea><div class="row mt"><button class="btn pri" onclick="saveSP(2,'${t?t.id:''}')">Lưu</button><button class="btn ghost" onclick="modal('')">Hủy</button></div>`)}
function saveSP(part,id){const lines=s=>$(s).value.split('\n').map(x=>x.trim()).filter(Boolean);let o,k;
 if(part===1){o={id:id||uid('p1'),title:$('#se1-t').value.trim(),qs:lines('#se1-q')};k='sp1';if(!o.title||!o.qs.length){toast('Nhập chủ đề và câu hỏi');return}}
 else{const c=$('#se2-c').value.trim();o={id:id||uid('p2'),title:c.replace(/^describe\s+/i,''),cue:c,points:lines('#se2-p'),p3:lines('#se2-q')};k='sp2';if(!c){toast('Nhập đề Part 2');return}}
 D[k]=D[k]||[];const i=D[k].findIndex(x=>x.id===o.id);if(i>=0)D[k][i]=o;else D[k].push(o);save();modal('');render()}


/* =========================================================
   LUYỆN THI 4 KỸ NĂNG: ghép đề Listening + Reading + Writing + Speaking
   ========================================================= */
const fullById=id=>(D.fulls||[]).find(f=>f.id===id);
const FPARTS=[['L','Listening','30 phút'],['R','Reading','60 phút'],['W','Writing','60 phút'],['S','Speaking','11–14 phút']];
const planKeys=pl=>['L','R','W1','W2','S'].filter(k=>k==='S'?(pl.P1||pl.P2):pl[k]);
const runById=(id,sid)=>(P(sid).fullruns||[]).find(r=>r.id===id);
function fullDone(r){return planKeys(r.plan).every(k=>r.parts[k])}
function fullMark(runId,k,rid){const r=runById(runId);if(r){r.parts[k]=rid;save()}}
function fullStart(fid){const f=fullById(fid);if(!f){toast('Không tìm thấy đề');return}
 const r={id:uid('fr'),fid,title:f.title,plan:{L:f.L,R:f.R,W1:f.W1,W2:f.W2,P1:f.P1,P2:f.P2},date:Date.now(),parts:{}};P().fullruns.push(r);save();go('fullrun',{id:r.id})}
function fullGo(runId,k){const r=runById(runId);const pl=r.plan;
 if(k==='L'||k==='R')return go('test',{id:pl[k],full:runId,fpart:k});
 if(k==='W1'||k==='W2'){go('writing');wStart(pl[k],{full:runId,fpart:k});return}
 go('speaking');const a=pl.P1&&spTopicById(pl.P1),b=pl.P2&&spTopicById(pl.P2);
 const items=[...(a?a.qs.slice(0,5).map(q=>({part:1,q,target:30})):[]),...(b?[{part:2,q:b.cue,points:b.points,target:120,prep:60},...b.p3.map(q=>({part:3,q,target:45}))]:[])];
 SK={topic:'full',mock:true,title:'Speaking · '+[a&&a.title,b&&b.title].filter(Boolean).join(' / '),items,i:0,res:[],phase:'ready',full:runId};render()}
function fullBands(r,sid){const p=P(sid),pl=r.plan,o={};
 ['L','R'].forEach(k=>{const x=r.parts[k]&&p.results.find(y=>y.id===r.parts[k]);if(x&&x.total)o[k]=ieltsBand(x.score,x.total)});
 const wb=k=>{const x=r.parts[k]&&p.writings.find(y=>y.id===r.parts[k]);return x&&x.grade&&x.grade.band!=null?+x.grade.band:null};
 if(pl.W1&&pl.W2){const a=wb('W1'),b=wb('W2');if(a!=null&&b!=null)o.W=Math.round((a+2*b)/3*2)/2}else{const v=wb(pl.W1?'W1':'W2');if(v!=null)o.W=v}
 const sx=r.parts.S&&p.speaking.find(y=>y.id===r.parts.S);if(sx&&sx.grade&&sx.grade.band!=null)o.S=+sx.grade.band;

function fullDetail(r,sid){const p=P(sid),pl=r.plan,b=fullBands(r,sid),T=U.role==='teacher',o={};
 const lk=(v,a)=>`go('${v}',${h(JSON.stringify(a))})`;
 ['L','R'].forEach(k=>{if(!pl[k]){o[k]={st:'none'};return}const x=r.parts[k]&&p.results.find(y=>y.id===r.parts[k]);
  o[k]=x?{st:'done',band:b[k],sub:x.score+'/'+x.total+' câu đúng',go:lk('result',T?{rid:x.id,sid,tf:r.id}:{rid:x.id,full:r.id})}:{st:'todo',sub:'Chưa làm'}});
 const wk=['W1','W2'].filter(k=>pl[k]);
 if(!wk.length)o.W={st:'none'};else{const xs=wk.map(k=>[k,r.parts[k]&&p.writings.find(y=>y.id===r.parts[k])]);
  const sub=xs.map(([k,x])=>'Task '+k[1]+': '+(!x?'chưa làm':x.grade&&x.grade.band!=null?x.grade.band:'chờ chấm')).join(' · ');
  const firstPend=xs.find(([k,x])=>x&&!(x.grade&&x.grade.band!=null)),first=xs.find(([k,x])=>x);
  const tgt=firstPend||first;const go_=tgt?lk(T?'t-review':'wres',T?{kind:'writing',rid:tgt[1].id,sid,tf:r.id}:{kind:'writing',rid:tgt[1].id,sid,full:r.id}):'';
  o.W={st:b.W!=null?'done':xs.every(([k,x])=>!x)?'todo':xs.some(([k,x])=>!x)?'part':'pending',band:b.W,sub,go:go_,tasks:xs.length}}
 if(!(pl.P1||pl.P2))o.S={st:'none'};else{const x=r.parts.S&&p.speaking.find(y=>y.id===r.parts.S);
  o.S=x?{st:b.S!=null?'done':'pending',band:b.S,sub:b.S!=null?'Đã chấm':'Chờ giáo viên chấm',go:lk(T?'t-review':'skres',T?{kind:'speaking',rid:x.id,sid,tf:r.id}:{kind:'speaking',rid:x.id,sid,full:r.id})}:{st:'todo',sub:'Chưa làm'}}
 o.all=b.all;return o}

  const pend=x.st==='pending'||(x.st==='part'&&x.go);
  return `<div class="btile" data-k="${k}"><span class="bl">${l}</span><div class="bv ${x.band==null?'na':''}">${x.band!=null?x.band:'—'}</div><div class="bs">${x.st==='pending'&&k==='W'&&x.tasks===1?'Chờ giáo viên chấm':h(x.sub||'')}</div>${x.go?`<button class="btn sm ${T&&pend?'pri':'ghost'}" onclick="${x.go}">${T&&pend?'Chấm':'Xem bài'}</button>`:''}</div>`};
 const miss=FPARTS.filter(([k])=>d[k].st!=='none'&&d[k].band==null);
 const wait=miss.filter(([k])=>d[k].st==='pending'||d[k].st==='part'),todo=miss.filter(([k])=>d[k].st==='todo'||(d[k].st==='part'));

 return `<div class="bsheet">${FPARTS.map(tile).join('')}<div class="btile all"><span class="bl" style="color:var(--brand)">Overall</span><div class="bv ${d.all==null?'na':''}">${d.all!=null?d.all:'—'}</div><div class="bs">${h(note)}</div></div></div>`}

function reportQ(tid,n){
 const t=testById(tid);const q=flatQs(t).find(x=>x.n===n);
 modal(`<h2>Báo lỗi câu ${n}</h2><p class="small muted">${h(t.title)}</p><div class="explain" style="background:var(--bg2)">${fmt(q.q)}</div>
 <label class="f">Bạn thấy sai ở đâu?</label><textarea class="prose" style="min-height:110px" id="repnote" placeholder="Ví dụ: đáp án đúng phải là B vì đoạn 3 viết..."></textarea>
 <p class="small muted">Báo lỗi được gửi cho giáo viên cùng file kết quả khi bạn bấm "Xuất kết quả gửi giáo viên" ở mục Kết quả.</p>
 <div class="row mt"><button class="btn pri" onclick="saveReport('${tid}',${n})">Gửi báo lỗi</button><button class="btn ghost" onclick="modal('')">Hủy</button></div>`);
 setTimeout(()=>{const e=$('#repnote');e&&e.focus()},50);
}
function saveReport(tid,n){const note=$('#repnote').value.trim();if(note.length<3){toast('Hãy ghi ngắn gọn chỗ bạn thấy sai');return}const p=P();p.reports=p.reports||[];p.reports.push({id:uid('rp'),testId:tid,n,note,date:Date.now()});save();modal('');render();toast('Đã ghi lại. Nhớ xuất kết quả gửi giáo viên nhé.')}
function allReports(){const out=[];for(const sid in D.progress){(D.progress[sid].reports||[]).forEach(x=>out.push({...x,sid}))}return out.sort((a,b)=>b.date-a.date)}
function resolveReport(sid,id){const x=(P(sid).reports||[]).find(y=>y.id===id);if(x){x.done=Date.now();save();render()}}
function showReportQ(tid,n){const t=testById(tid);if(!t){toast('Đề này đã bị xóa');return}const q=flatQs(t).find(x=>x.n===n);if(!q)return;
 const ans=q.t==='mc'?`${'ABCDEFGHIJ'[q.a]}. ${fmt(q.o[q.a])}`:h((q.a||[]).join(' / '));
 modal(`<h2>${h(t.title)} · câu ${n}</h2><div class="mt">${fmt(q.q)}</div>${q.t==='mc'?`<div class="small muted mt">Phương án: ${q.o.map((o,i)=>'ABCDEFGHIJ'[i]+'. '+fmt(o)).join(' · ')}</div>`:''}<p class="mt">Đáp án hiện tại: <b>${ans}</b></p>${q.e?`<div class="explain">💡 ${fmt(q.e)}</div>`:''}<p class="small muted mt">Nếu đáp án sai, sửa trong file nguồn của đề (tools/ielts_src) hoặc trong mục Đề thi với đề tự soạn.</p><div class="row mt"><button class="btn pri" onclick="modal('')">Đóng</button></div>`)}

function qKind(q){if(q.t==='fill')return 'Điền từ';if(q.t!=='mc')return null;const o=q.o.map(x=>String(x).trim().toUpperCase());if(o.includes('NOT GIVEN'))return o.includes('TRUE')?'True / False / Not Given':'Yes / No / Not Given';if(o.every(x=>/^[A-Z]$/.test(x)))return 'Chọn chữ cái, ghép thông tin';return 'Trắc nghiệm'}
function wkStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
let statSid='all';
VIEWS['t-stats']=()=>{
 const sids=statSid==='all'?D.students.map(s=>s.id):[statSid];
 const res=[];sids.forEach(sid=>P(sid).results.forEach(r=>{if(r.total){const t=testById(r.testId);if(t)res.push({r,t,sid})}}));
 // weekly
 const W=10,now=wkStart(Date.now()),weeks=[];for(let i=W-1;i>=0;i--){const st=now-i*7*DAY;const rs=res.filter(o=>wkStart(o.r.date)===st);weeks.push({st,n:rs.length,avg:rs.length?rs.reduce((a,o)=>a+o.r.score/o.r.total,0)/rs.length:null})}
 const cw=640,ch=200,pl=34,pb=26,bw=(cw-pl)/W;
 const y=v=>ch-pb-(ch-pb-12)*v;
 const chart=`<svg class="chart" viewBox="0 0 ${cw} ${ch}" role="img" aria-label="Điểm trung bình theo tuần">
  ${[0,.25,.5,.75,1].map(v=>`<line x1="${pl}" x2="${cw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`).join('')}
  ${weeks.map((w,i)=>{const x=pl+i*bw+bw*.2,wd=bw*.6;const d=new Date(w.st);const lab=`${d.getDate()}/${d.getMonth()+1}`;
   return (w.avg!=null?`<rect x="${x}" y="${y(w.avg)}" width="${wd}" height="${Math.max(2,y(0)-y(w.avg))}" rx="4" fill="var(--brand)"><title>${lab}: ${Math.round(w.avg*100)}% (${w.n} bài)</title></rect><text class="v" x="${x+wd/2}" y="${y(w.avg)-6}" text-anchor="middle">${Math.round(w.avg*100)}%</text>`:'')+`<text x="${x+wd/2}" y="${ch-8}" text-anchor="middle">${lab}</text>`}).join('')}
 </svg>`;
 // by question type
 const kinds={};const miss={};
 res.forEach(({r,t})=>flatQs(t).forEach(q=>{const k=qKind(q);if(!k)return;const ok=isRight(q,r.ans[q.n]);kinds[k]=kinds[k]||{n:0,bad:0};kinds[k].n++;if(!ok)kinds[k].bad++;
  const key=t.id+'#'+q.n;miss[key]=miss[key]||{t,q,n:0,bad:0};miss[key].n++;if(!ok)miss[key].bad++}));
 const kl=Object.entries(kinds).sort((a,b)=>b[1].bad/b[1].n-a[1].bad/a[1].n);
 const ml=Object.values(miss).filter(m=>m.n>=2&&m.bad>0).sort((a,b)=>b.bad/b.n-a.bad/a.n||b.n-a.n).slice(0,8);
 const skills={};res.forEach(({r,t})=>{const k=t.type==='ielts'?(t.skill||'IELTS'):'THPT';skills[k]=skills[k]||{n:0,s:0};skills[k].n++;skills[k].s+=r.score/r.total});
 const reps=allReports().filter(x=>statSid==='all'||x.sid===statSid);const open=reps.filter(x=>!x.done);
 const avgAll=res.length?Math.round(res.reduce((a,o)=>a+o.r.score/o.r.total,0)/res.length*100):0;
 return `<div class="row between"><div><h1>Thống kê</h1><p class="sub">Từ các bài học viên đã nộp. Nhập file kết quả của học viên ở mục Học viên để số liệu cập nhật.</p></div>
 <select style="width:auto;min-width:200px" onchange="statSid=this.value;render()"><option value="all">Cả lớp (${D.students.length} học viên)</option>${D.students.map(s=>`<option value="${s.id}" ${statSid===s.id?'selected':''}>${h(s.name)}</option>`).join('')}</select></div>
 <div class="grid gx4"><div class="card stat"><div class="n">${res.length}</div><div class="l">Bài đã chấm tự động</div></div><div class="card stat"><div class="n">${avgAll}%</div><div class="l">Tỉ lệ đúng trung bình</div></div>
 ${Object.entries(skills).slice(0,2).map(([k,v])=>`<div class="card stat"><div class="n">${Math.round(v.s/v.n*100)}%</div><div class="l">${h(k)} · ${v.n} bài</div></div>`).join('')}</div>
 <div class="grid gx2 mt">
  <div class="card"><h2>Điểm trung bình theo tuần</h2>${res.length?chart+'<p class="small muted" style="margin:6px 0 0">Mỗi cột là tỉ lệ câu đúng trung bình của các bài nộp trong tuần (tính từ thứ Hai).</p>':'<div class="empty">Chưa có bài nộp.</div>'}</div>
  <div class="card"><h2>Dạng câu hay sai</h2>${kl.length?kl.map(([k,v])=>{const pc=Math.round(v.bad/v.n*100);return `<div class="hbar"><span class="small"><b>${h(k)}</b><br><span class="muted">${v.n} lượt trả lời</span></span><span class="tr"><i style="width:${pc}%"></i></span><span class="pc">${pc}% sai</span></div>`}).join(''):'<div class="empty">Chưa có dữ liệu.</div>'}</div>
 </div>
 <div class="grid gx2 mt">
  <div class="card"><h2>Câu sai nhiều nhất</h2>${ml.length?ml.map(m=>`<div class="list-item"><div style="min-width:0"><b class="small">${h(m.t.title)} · câu ${m.q.n}</b><div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(String(m.q.q).replace(/<[^>]+>/g,'').slice(-90))}</div></div><div class="row" style="flex-wrap:nowrap"><span class="tag bad">${m.bad}/${m.n} sai</span><button class="btn sm" onclick="showReportQ('${m.t.id}',${m.q.n})">Xem</button></div></div>`).join(''):'<div class="empty">Cần ít nhất 2 lượt làm cùng một đề.</div>'}</div>
  <div class="card"><h2>Học viên báo lỗi ${open.length?`<span class="tag bad">${open.length} chưa xử lý</span>`:''}</h2>${reps.length?reps.slice(0,30).map(x=>{const t=testById(x.testId);const s=stuById(x.sid);return `<div class="list-item" style="${x.done?'opacity:.55':''}"><div style="min-width:0"><b class="small">${h(t?t.title:'(đề đã xóa)')} · câu ${x.n}</b><div class="small">${h(x.note)}</div><div class="small muted">${h(s?s.name:'')} · ${fdt(x.date)}</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm" onclick="showReportQ('${x.testId}',${x.n})">Xem câu</button>${x.done?'<span class="tag ok">Đã xử lý</span>':`<button class="btn sm pri" onclick="resolveReport('${x.sid}','${x.id}')">Đã xử lý</button>`}</div></div>`}).join(''):'<div class="empty">Chưa có báo lỗi nào.</div>'}</div>
 </div>`;
};

   NHẬP / XUẤT & GỘP DỮ LIỆU
   ========================================================= */
function upsert(list,items){(items||[]).forEach(x=>{if(!x||!x.id||x.builtin)return;const i=list.findIndex(y=>y.id===x.id);if(i>=0)list[i]=x;else list.push(x)})}
function mergeData(inc){
 if(!inc||inc.app!=='lopta')throw new Error('bad');
 let n={stu:0,res:0};
 if(inc.students){inc.students.forEach(s=>{const ex=D.students.find(x=>x.id===s.id)||D.students.find(x=>x.code===s.code);if(ex){Object.assign(ex,{name:s.name,note:s.note??ex.note})}else{D.students.push(s);n.stu++}})}
 upsert(D.sets,inc.sets);upsert(D.tests,inc.tests);upsert(D.assignments,inc.assignments);['wprompts','sp1','sp2','fulls'].forEach(k=>{D[k]=D[k]||[];upsert(D[k],inc[k])});
 if(inc.deleted){['sets','tests','assignments','wprompts','sp1','sp2','fulls'].forEach(k=>(inc.deleted[k]||[]).forEach(id=>{D[k]=(D[k]||[]).filter(x=>x.id!==id)}))}
 if(inc.settings&&inc.kind==='class-pack'){D.settings.className=inc.settings.className||D.settings.className}
 for(const sid in (inc.progress||{})){const a=P(sid),b=inc.progress[sid];
  for(const k in (b.words||{})){if(!a.words[k]||(b.words[k].last||0)>(a.words[k].last||0))a.words[k]=b.words[k]}
  (b.results||[]).forEach(r=>{const ex=a.results.find(x=>x.id===r.id);if(!ex){a.results.push(r);n.res++}else if(r.essay&&ex.essay&&(r.essay.gradedAt||0)>(ex.essay.gradedAt||0))ex.essay=r.essay});
  a.results.sort((x,y)=>x.date-y.date);
  ['writings','speaking'].forEach(k=>(b[k]||[]).forEach(r=>{const ex=a[k].find(x=>x.id===r.id);if(!ex){a[k].push(r);n.res++}else if(r.grade&&(r.grade.gradedAt||0)>((ex.grade&&ex.grade.gradedAt)||0))ex.grade=r.grade}));
  a.fullruns=a.fullruns||[];(b.fullruns||[]).forEach(r=>{const ex=a.fullruns.find(x=>x.id===r.id);if(!ex)a.fullruns.push(r);else for(const k in r.parts)if(r.parts[k])ex.parts[k]=r.parts[k]});
  for(const d in (b.activity||{}))a.activity[d]=Math.max(a.activity[d]||0,b.activity[d]);
  a.reports=a.reports||[];(b.reports||[]).forEach(x=>{const ex=a.reports.find(y=>y.id===x.id);if(!ex){a.reports.push(x);n.rep=(n.rep||0)+1}else if(x.done&&!ex.done)ex.done=x.done});
 }
 save();return n;
}
function importPack(){pickFile(x=>{try{const n=mergeData(x);toast(`Đã nhập dữ liệu${n.stu?` · ${n.stu} học viên mới`:''}${n.res?` · ${n.res} kết quả mới`:''}${n.rep?` · ${n.rep} báo lỗi mới`:''}`);render()}catch(e){toast('File không đúng định dạng của ứng dụng này')}})}
function classPack(withProgress){return {kind:'class-pack',app:'lopta',date:Date.now(),settings:{className:D.settings.className},students:D.students,sets:D.sets,tests:D.tests,wprompts:D.wprompts||[],sp1:D.sp1||[],sp2:D.sp2||[],fulls:(D.fulls||[]).filter(f=>f.by==='teacher'),assignments:D.assignments,deleted:D.deleted||{},progress:withProgress?D.progress:undefined}}
