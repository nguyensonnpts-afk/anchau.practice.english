<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d2330; --muted:#667085; --line:#e4e2db;
  --brand:#1f6f5c; --brand-ink:#ffffff; --brand-soft:#e3f1ec;
  --accent:#e0913a; --accent-soft:#fbeedd;
  --ok:#2e8b57; --ok-soft:#e2f3e8; --bad:#c2423b; --bad-soft:#f8e3e1; --warn:#b7791f; --warn-soft:#fbf0d9;
  --shadow:0 1px 2px rgba(20,25,35,.06),0 4px 14px rgba(20,25,35,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --card:#1d2128; --ink:#e8eaee; --muted:#9aa3b2; --line:#2e333c;
    --brand:#4fb394; --brand-ink:#0d1a15; --brand-soft:#1f3530;
    --accent:#eba65a; --accent-soft:#3a2c1c;
    --ok:#5ec48a; --ok-soft:#1c3326; --bad:#ec7a73; --bad-soft:#3b2120; --warn:#e3b55a; --warn-soft:#3a3020;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --card:#1d2128; --ink:#e8eaee; --muted:#9aa3b2; --line:#2e333c;
  --brand:#4fb394; --brand-ink:#0d1a15; --brand-soft:#1f3530;
  --accent:#eba65a; --accent-soft:#3a2c1c;
  --ok:#5ec48a; --ok-soft:#1c3326; --bad:#ec7a73; --bad-soft:#3b2120; --warn:#e3b55a; --warn-soft:#3a3020;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);font-size:15px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button.on{background:var(--brand-soft);color:var(--brand)}
nav.tabs button:hover{color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
main{padding:22px 0 60px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stat{padding:14px 16px}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:14px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.gray{background:var(--line);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
textarea.prose{font-family:inherit;font-size:15px;min-height:280px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.seg{display:inline-flex;background:var(--line);padding:3px;border-radius:11px;gap:2px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tbl{overflow-x:auto}
/* login */
.login{max-width:440px;margin:6vh auto 0}
.login .hero{text-align:center;margin-bottom:18px}
.login .hero b{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-size:26px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--brand)}
/* flashcard */
.fc-wrap{max-width:560px;margin:0 auto}
.flash{perspective:1200px;cursor:pointer;height:300px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.flash .back{transform:rotateY(180deg);background:var(--brand-soft)}
.flash .word{font-size:34px;font-weight:700}
.flash .ipa{color:var(--muted);margin-top:4px}
.flash .vi{font-size:24px;font-weight:600;color:var(--brand)}
.flash .ex{margin-top:12px;font-style:italic;color:var(--ink);max-width:440px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate button{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.rate button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.rate .r1{color:var(--bad)}.rate .r2{color:var(--warn)}.rate .r3{color:var(--brand)}.rate .r4{color:var(--ok)}
.spk{border:0;background:var(--brand-soft);color:var(--brand);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px;display:inline-grid;place-items:center}
/* quiz */
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--brand)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qbig{font-size:22px;font-weight:700}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:center;font-weight:500;min-height:54px}
.mi.sel{border-color:var(--brand);background:var(--brand-soft)}
.mi.done{visibility:hidden}
.mi.err{border-color:var(--bad);background:var(--bad-soft)}
/* exam */
.exam-head{position:sticky;top:58px;z-index:10;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;padding:5px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.passage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;white-space:pre-wrap;line-height:1.75}
.q{padding:14px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;margin-right:8px;padding:0 6px}
.q .opts{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.fill{max-width:280px;margin-top:8px}
.qnav{display:flex;flex-wrap:wrap;gap:4px}
.qnav span{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted);cursor:pointer}
.qnav span.done{background:var(--brand);color:var(--brand-ink)}
.review .ok{color:var(--ok);font-weight:600}.review .bad{color:var(--bad);font-weight:600}
.explain{margin-top:6px;padding:8px 12px;background:var(--warn-soft);border-radius:9px;font-size:14px}
.big-score{font-size:48px;font-weight:700;color:var(--brand);line-height:1}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--brand) 35%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--brand) 65%,var(--line))}
.heat i.l3{background:var(--brand)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:99;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.crumb{color:var(--muted);font-size:14px;margin-bottom:8px;cursor:pointer}
.crumb:hover{color:var(--brand)}
pre.help{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;white-space:pre-wrap;margin:8px 0 0}
@media (max-width:640px){
  header.top .wrap{padding-top:6px;padding-bottom:6px}
  nav.tabs{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap}
  nav.tabs button{white-space:nowrap}
  .flash{height:260px}.flash .word{font-size:28px}
  .rate{grid-template-columns:repeat(2,1fr)}
  .exam-head{top:96px}
  h1{font-size:21px}
}
</style>
</head>

 {id:'t-ielts-r1',type:'ielts',skill:'Reading',title:'IELTS Reading · Urban beekeeping',minutes:15,builtin:true,

  sections:[{title:'Reading Passage',passage:`Urban beekeeping

Over the past two decades, beekeeping has moved from the countryside into the heart of many cities. Rooftops in London, Paris and New York now host thousands of hives, many of them managed by amateurs who have taken short training courses. Supporters argue that cities can be surprisingly good places for bees. Parks, gardens and tree-lined streets offer a wide variety of flowers, and urban areas are often free from the pesticides used on large farms.

However, some scientists have begun to question whether the trend is as beneficial as it seems. A study in one European capital found that the number of honeybee colonies had grown so quickly that there were no longer enough flowers to feed them. Honeybees, which live in large colonies, may compete with wild bees for nectar and pollen. Wild bees, which include hundreds of solitary species, are often more important pollinators of native plants than honeybees are.

Researchers therefore recommend that city authorities focus less on adding hives and more on planting. Replacing short-cut lawns with meadows of native wildflowers, for example, would benefit all pollinating insects. Some cities have already started to leave road verges uncut during the summer months. Early results suggest that this simple change can double the number of insect species recorded in an area.

For those who still wish to keep bees, experts advise registering hives with local authorities so that colony density can be monitored.`,

/* =========================================================
   LƯU TRỮ
   ========================================================= */
const KEY='lopta_data_v1', SKEY='lopta_session_v1';
const DAY=86400000;
function blank(){return {teacherPin:'1234',settings:{selfReg:true,className:'Lớp Tiếng Anh'},students:[],sets:[],tests:[],assignments:[],progress:{}}}
let D=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.students)return Object.assign(blank(),x)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Không lưu được dữ liệu trên trình duyệt này')}}
function getSession(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}}
function setSession(s){try{s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY)}catch(e){}}

const allSets=()=>[...SAMPLE_SETS,...D.sets];
const allTests=()=>[...SAMPLE_TESTS,...D.tests];
const setById=id=>allSets().find(s=>s.id===id);
const testById=id=>allTests().find(t=>t.id===id);
const stuById=id=>D.students.find(s=>s.id===id);
function P(sid){sid=sid||U.id;if(!D.progress[sid])D.progress[sid]={words:{},results:[],activity:{}};return D.progress[sid]}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const wkey=(setId,w)=>setId+'::'+w.toLowerCase();

/* =========================================================
   TIỆN ÍCH
   ========================================================= */
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>h(s).replace(/\{\{(.+?)\}\}/g,'<u>$1</u>').replace(/\n/g,'<br>');
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;:"]+$/,'').replace(/\s+/g,' ').trim();
const fdate=t=>new Date(t).toLocaleDateString('vi-VN');
const fdt=t=>new Date(t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(html){$('#modal').innerHTML=html?`<div class="modal-bg" onclick="if(event.target===this)modal('')"><div class="modal">${html}</div></div>`:''}
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,rate=0.9){if(!('speechSynthesis' in window)){toast('Trình duyệt không hỗ trợ đọc');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u)}
function download(name,obj){const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){toast('File không hợp lệ')}};r.readAsText(f)};i.click()}

/* =========================================================
   LẶP LẠI NGẮT QUÃNG (SM-2 rút gọn)
   q: 1=Quên, 3=Khó, 4=Nhớ, 5=Dễ
   ========================================================= */
function grade(key,q){
 const p=P();const now=Date.now();
 const c=p.words[key]||{ef:2.5,iv:0,reps:0,due:0,lapses:0,seen:0};
 c.seen=(c.seen||0)+1;
 if(q<3){c.reps=0;c.iv=0;c.lapses++;c.due=now+10*60000}
 else{c.reps++;c.iv=c.reps===1?(q===5?3:1):c.reps===2?(q===5?6:3):Math.round(c.iv*c.ef*(q===5?1.3:q===3?0.8:1));c.iv=Math.max(1,c.iv);c.due=now+c.iv*DAY}
 c.ef=Math.max(1.3,Math.min(3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02))));
 c.last=now;p.words[key]=c;bump();save();
}
function bump(sid){const p=P(sid);const d=today();p.activity[d]=(p.activity[d]||0)+1}
function wstatus(rec){if(!rec)return 'new';if(rec.iv>=7)return 'mastered';return 'learning'}
function setStats(set,sid){const p=P(sid);let n=0,l=0,m=0,due=0;const now=Date.now();set.words.forEach(w=>{const r=p.words[wkey(set.id,w.w)];const s=wstatus(r);if(s==='new')n++;else if(s==='mastered')m++;else l++;if(r&&r.due<=now)due++});return{total:set.words.length,n,l,m,due,learned:l+m}}
function dueList(sid){const p=P(sid),now=Date.now(),out=[];allSets().forEach(s=>s.words.forEach(w=>{const r=p.words[wkey(s.id,w.w)];if(r&&r.due<=now)out.push({set:s,w})}));return out}
function streak(sid){const a=P(sid).activity;let n=0;let d=new Date();if(!a[today()])d=new Date(Date.now()-DAY);while(a[d.toISOString().slice(0,10)]){n++;d=new Date(d.getTime()-DAY)}return n}
function stuSummary(sid){const p=P(sid);const vals=Object.values(p.words);return{learned:vals.length,mastered:vals.filter(r=>r.iv>=7).length,due:dueList(sid).length,tests:p.results.length,streak:streak(sid),last:Math.max(0,...vals.map(r=>r.last||0),...p.results.map(r=>r.date))}}

/* =========================================================
   CHẤM ĐIỂM
   ========================================================= */
function flatQs(t){const out=[];t.sections.forEach((s,si)=>s.questions.forEach((q,qi)=>out.push({...q,si,qi,n:out.length+1})));return out}
function isRight(q,ans){if(ans==null||ans==='')return false;if(q.t==='mc')return ans===q.a;if(q.t==='fill')return q.a.map(norm).includes(norm(ans));return false}
function ieltsBand(score,total){const r=Math.round(score/total*40);const m=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];for(const[k,b]of m)if(r>=k)return b;return 2}
function resultLabel(t,r){
 if(r.essay&&r.total===0){return r.essay.band!=null&&r.essay.band!==''?`Band ${r.essay.band}`:'Chờ chấm'}
 if(t&&t.type==='ielts')return `${r.score}/${r.total} · Band ~${ieltsBand(r.score,r.total)}`;
 return `${r.score}/${r.total} · ${(Math.round(r.score/r.total*10*100)/100)} điểm`;
}
function bestPct(sid,testId){const rs=P(sid).results.filter(r=>r.testId===testId&&r.total>0);if(!rs.length)return null;return Math.max(...rs.map(r=>r.score/r.total))}

/* =========================================================
   GIAO BÀI
   ========================================================= */
function myAssignments(sid){return D.assignments.filter(a=>a.to==='all'||(a.to||[]).includes(sid))}
function assignDone(a,sid){
 if(a.kind==='test')return P(sid).results.some(r=>r.testId===a.ref&&r.date>=a.created);
 const s=setById(a.ref);if(!s)return false;const st=setStats(s,sid);return st.n===0;
}

/* =========================================================
   TRẠNG THÁI & ĐIỀU HƯỚNG
   ========================================================= */
let U=null; // {role,id,name}
let R={v:'home'}; // route
let timerH=null;
function go(v,extra){if(R.v==='test'&&R.running&&v!=='result'){if(!confirm('Bạn đang làm bài. Thoát sẽ mất bài làm. Vẫn thoát?'))return}clearInterval(timerH);if('speechSynthesis' in window)speechSynthesis.cancel();R=Object.assign({v},extra||{});render();window.scrollTo(0,0)}
function logout(){if(R.v==='test'&&R.running&&!confirm('Thoát khi đang làm bài?'))return;R.running=false;U=null;loginTab='stu';setSession(null);go('login')}

function header(){
 const el=$('#hdr');
 if(!U){el.innerHTML=`<div class="wrap"><div class="logo"><b>A</b>${h(D.settings.className)}</div></div>`;return}
 const st=[['home','Trang chủ'],['vocab','Luyện từ'],['exam','Luyện đề'],['history','Kết quả']];
 const tt=[['t-students','Học viên'],['t-sets','Bộ từ'],['t-tests','Đề thi'],['t-assign','Giao bài'],['t-data','Dữ liệu']];
 const tabs=U.role==='teacher'?tt:st;
 const cur=R.v;
 const isOn=k=>cur===k||(k==='vocab'&&['set','flash','quiz','spell','match','review'].includes(cur))||(k==='exam'&&['test','result'].includes(cur))||(k==='t-students'&&cur==='t-student');
 el.innerHTML=`<div class="wrap"><div class="logo" onclick="go('${tabs[0][0]}')"><b>A</b><span>${h(D.settings.className)}</span></div>
 <nav class="tabs">${tabs.map(([k,l])=>`<button class="${isOn(k)?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav>
 <div class="who">${U.role==='teacher'?'<span class="tag acc">Giáo viên</span>':`<span>${h(U.name)}</span><span class="tag gray">${h(U.code)}</span>`}<button class="btn sm ghost" onclick="logout()">Đăng xuất</button></div></div>`;
}

function render(){
 if(!U&&R.v!=='login')R={v:'login'};
 if(U&&U.role==='student'&&R.v.startsWith('t-'))R={v:'home'};
 if(U&&U.role==='teacher'&&!R.v.startsWith('t-')&&!(R.v==='result'&&R.sid))R={v:'t-students'};
 header();
 const f=VIEWS[R.v]||VIEWS.home;
 $('#app').innerHTML=f();
 if(AFTER[R.v])AFTER[R.v]();
}
const VIEWS={},AFTER={};

/* =========================================================
   ĐĂNG NHẬP
   ========================================================= */
let loginTab='stu';
VIEWS.login=()=>{
 const recent=D.students.slice().sort((a,b)=>(b.lastLogin||0)-(a.lastLogin||0)).slice(0,8);
 return `<div class="login"><div class="hero"><b>A</b><h1>${h(D.settings.className)}</h1><p class="sub">Luyện từ vựng và luyện đề IELTS, THPT</p></div>
 <div class="card"><div class="row" style="justify-content:center"><div class="seg"><button class="${loginTab==='stu'?'on':''}" onclick="loginTab='stu';render()">Học viên</button><button class="${loginTab==='tea'?'on':''}" onclick="loginTab='tea';render()">Giáo viên</button></div></div>
 ${loginTab==='stu'?`
  <label class="f">Mã học viên</label><input type="text" id="lcode" placeholder="Ví dụ: HV1234" onkeydown="if(event.key==='Enter')stuLogin()">
  <button class="btn pri mt" style="width:100%" onclick="stuLogin()">Vào học</button>
  ${recent.length?`<p class="small muted mt">Hồ sơ đã dùng trên máy này:</p><div class="chips">${recent.map(s=>`<span class="chip" onclick="$('#lcode').value='${h(s.code)}';stuLogin()">${h(s.name)}</span>`).join('')}</div>`:''}
  ${D.settings.selfReg?`<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">

 <button class="btn ${due?'acc':''}" onclick="go('review')" ${due?'':'disabled'}>Ôn tập hôm nay (${due})</button></div>
 <div class="seg mb">${cats.map(c=>`<button class="${vocabCat===c?'on':''}" onclick="vocabCat='${h(c)}';render()">${c==='all'?'Tất cả':h(c)}</button>`).join('')}</div>

  <div class="bar"><i style="width:${pct}%"></i></div><div class="small muted mt" style="margin-top:6px">Đã học ${pct}%</div></div>`}).join('')}</div>`;

VIEWS.set=()=>{
 const s=setById(R.id);if(!s)return '<div class="empty">Không tìm thấy bộ từ.</div>';
 const st=setStats(s,U.id);const p=P();
 const lab={new:'<span class="tag gray">Mới</span>',learning:'<span class="tag warn">Đang học</span>',mastered:'<span class="tag ok">Đã thuộc</span>'};
 return `<div class="crumb" onclick="go('vocab')">← Luyện từ</div><h1>${h(s.title)}</h1><p class="sub">${st.total} từ · ${st.n} mới · ${st.l} đang học · ${st.m} đã thuộc</p>
 <div class="grid g4">
  <button class="card" style="cursor:pointer;text-align:left" onclick="go('flash',{id:'${s.id}'})"><div style="font-size:24px">🃏</div><b>Thẻ ghi nhớ</b><div class="small muted">Lật thẻ, tự đánh giá</div></button>
  <button class="card" style="cursor:pointer;text-align:left" onclick="go('quiz',{id:'${s.id}'})"><div style="font-size:24px">✅</div><b>Trắc nghiệm</b><div class="small muted">Chọn nghĩa đúng</div></button>
  <button class="card" style="cursor:pointer;text-align:left" onclick="go('spell',{id:'${s.id}'})"><div style="font-size:24px">🎧</div><b>Nghe & viết</b><div class="small muted">Nghe rồi gõ lại từ</div></button>
  <button class="card" style="cursor:pointer;text-align:left" onclick="go('match',{id:'${s.id}'})"><div style="font-size:24px">🧩</div><b>Ghép từ</b><div class="small muted">Nối từ với nghĩa</div></button>
 </div>
 <div class="card mt2 tbl"><table><thead><tr><th></th><th>Từ</th><th>Nghĩa</th><th>Trạng thái</th></tr></thead><tbody>
 ${s.words.map(w=>{const r=p.words[wkey(s.id,w.w)];return `<tr><td><button class="spk" onclick="speak('${h(w.w).replace(/&#39;/g,"\\'")}')">🔊</button></td><td><b>${h(w.w)}</b> <span class="muted small">${h(w.pos||'')} ${h(w.ipa||'')}</span><div class="small muted"><i>${h(w.ex||'')}</i></div></td><td>${h(w.vi)}</td><td>${lab[wstatus(r)]}${r&&r.due>Date.now()?`<div class="small muted">ôn lại ${fdate(r.due)}</div>`:''}</td></tr>`}).join('')}
 </tbody></table></div>`;
};
function jsq(s){return h(s).replace(/&#39;/g,"\\'")}

/* --- Thẻ ghi nhớ --- */
let FC=null;
function buildFC(items,title,back,limit){
 const p=P();const now=Date.now();
 const sc=it=>{const r=p.words[wkey(it.set.id,it.w.w)];if(!r)return 1;if(r.due<=now)return 0;return 2};
 items=shuffle(items).sort((a,b)=>sc(a)-sc(b));
 if(limit)items=items.slice(0,limit);
 FC={q:items,i:0,flip:false,title,back,done:0,more:!!limit};
}
VIEWS.flash=()=>{
 if(!FC||FC.src!==R.id){const s=setById(R.id);buildFC(s.words.map(w=>({set:s,w})),s.title,`go('set',{id:'${s.id}'})`,20);FC.src=R.id}
 return fcView();
};
VIEWS.review=()=>{
 if(!FC||FC.src!=='__review'){buildFC(dueList(U.id),'Ôn tập hôm nay',`go('vocab')`);FC.src='__review'}
 return fcView();
};
function fcView(){
 const f=FC;
 if(!f.q.length)return `<div class="crumb" onclick="${f.back}">← Quay lại</div><div class="card empty">Không có từ nào cần ôn. Tuyệt vời!</div>`;
 if(f.i>=f.q.length){const t=f.done;FC=null;return `<div class="fc-wrap"><div class="card" style="text-align:center"><div style="font-size:44px">🎉</div><h2>Hoàn thành!</h2><p class="muted">Bạn vừa ôn ${t} lượt thẻ. Các từ sẽ được nhắc lại đúng lúc sắp quên.</p><div class="row" style="justify-content:center">${f.more?`<button class="btn" onclick="render()">Học tiếp 20 thẻ</button>`:''}<button class="btn pri" onclick="${f.back}">Xong</button></div></div></div>`}
 const it=f.q[f.i];const w=it.w;
 return `<div class="fc-wrap"><div class="crumb" onclick="FC=null;${f.back}">← ${h(f.title)}</div>
 <div class="row between mb"><span class="small muted">Thẻ ${f.i+1}/${f.q.length}</span><span class="small muted">Dấu cách: lật · 1–4: đánh giá</span></div>
 <div class="bar mb"><i style="width:${f.i/f.q.length*100}%"></i></div>
 <div class="flash ${f.flip?'flip':''}" onclick="fcFlip()"><div class="in">
  <div class="face"><div class="word">${h(w.w)}</div><div class="ipa">${h(w.pos||'')} ${h(w.ipa||'')}</div><div class="mt"><button class="spk" onclick="event.stopPropagation();speak('${jsq(w.w)}')">🔊</button></div><div class="small muted mt">Bấm vào thẻ để xem nghĩa</div></div>
  <div class="face back"><div class="vi">${h(w.vi)}</div><div class="ipa">${h(w.w)} ${h(w.ipa||'')}</div>${w.ex?`<div class="ex">“${h(w.ex)}”</div>`:''}</div>
 </div></div>
 ${f.flip?`<div class="rate"><button class="r1" onclick="fcRate(1)">Quên<small>xem lại ngay</small></button><button class="r2" onclick="fcRate(3)">Khó<small>sớm hơn</small></button><button class="r3" onclick="fcRate(4)">Nhớ<small>bình thường</small></button><button class="r4" onclick="fcRate(5)">Dễ<small>giãn xa</small></button></div>`:`<button class="btn pri mt" style="width:100%" onclick="fcFlip()">Lật thẻ</button>`}
 </div>`;
}
function fcFlip(){FC.flip=!FC.flip;if(FC.flip)speak(FC.q[FC.i].w.w);render()}
function fcRate(q){const it=FC.q[FC.i];grade(wkey(it.set.id,it.w.w),q);FC.done++;if(q===1)FC.q.push(it);FC.i++;FC.flip=false;render()}
document.addEventListener('keydown',e=>{
 if(!FC||!['flash','review'].includes(R.v)||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 if(e.code==='Space'){e.preventDefault();fcFlip()}
 else if(FC.flip&&['1','2','3','4'].includes(e.key))fcRate([1,3,4,5][+e.key-1]);
});

/* --- Trắc nghiệm từ --- */
let QZ=null;
function distractors(set,w,field){const pool=[...set.words,...allSets().filter(s=>s.id!==set.id).flatMap(s=>s.words)].filter(x=>x.w!==w.w);const seen=new Set([w[field]]);const out=[];for(const x of shuffle(pool)){if(!seen.has(x[field])){seen.add(x[field]);out.push(x[field])}if(out.length===3)break}return out}
VIEWS.quiz=()=>{
 const s=setById(R.id);
 if(!QZ||QZ.src!==R.id){const ws=shuffle(s.words).slice(0,10);QZ={src:R.id,i:0,ok:0,items:ws.map(w=>{const dir=Math.random()<.6?'en':'vi';const f=dir==='en'?'vi':'w';const opts=shuffle([w[f],...distractors(s,w,f)]);return{w,dir,opts,ans:opts.indexOf(w[f]),pick:null}})}}
 const q=QZ;
 if(q.i>=q.items.length){const r=`<div class="fc-wrap"><div class="card" style="text-align:center"><div class="big-score">${q.ok}/${q.items.length}</div><p class="muted">câu đúng</p><div class="row" style="justify-content:center"><button class="btn" onclick="QZ=null;render()">Làm lại</button><button class="btn pri" onclick="QZ=null;go('set',{id:'${s.id}'})">Xong</button></div></div></div>`;return r}
 const it=q.items[q.i];
 return `<div class="fc-wrap"><div class="crumb" onclick="QZ=null;go('set',{id:'${s.id}'})">← ${h(s.title)}</div>
 <div class="row between mb"><span class="small muted">Câu ${q.i+1}/${q.items.length}</span><span class="small muted">Đúng: ${q.ok}</span></div><div class="bar mb"><i style="width:${q.i/q.items.length*100}%"></i></div>
 <div class="card"><div class="small muted">${it.dir==='en'?'Nghĩa của từ này là gì?':'Từ tiếng Anh nào có nghĩa này?'}</div>
 <div class="row mt"><div class="qbig">${h(it.dir==='en'?it.w.w:it.w.vi)}</div>${it.dir==='en'?`<button class="spk" onclick="speak('${jsq(it.w.w)}')">🔊</button>`:''}</div>
 <div class="opts">${it.opts.map((o,i)=>{let c='';if(it.pick!=null){if(i===it.ans)c='right';else if(i===it.pick)c='wrong'}return `<button class="opt ${c}" onclick="qzPick(${i})" ${it.pick!=null?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${h(o)}</span></button>`}).join('')}</div>
 ${it.pick!=null?`<div class="mt small">${it.pick===it.ans?'<b style="color:var(--ok)">Chính xác!</b>':'<b style="color:var(--bad)">Chưa đúng.</b>'} <b>${h(it.w.w)}</b> = ${h(it.w.vi)}${it.w.ex?` · <i>${h(it.w.ex)}</i>`:''}</div><button class="btn pri mt" onclick="QZ.i++;render()">Tiếp →</button>`:''}
 </div></div>`;
};
function qzPick(i){const it=QZ.items[QZ.i];if(it.pick!=null)return;it.pick=i;const ok=i===it.ans;if(ok)QZ.ok++;grade(wkey(QZ.src,it.w.w),ok?4:1);if(it.dir==='vi'||ok)speak(it.w.w);render()}

/* --- Nghe & viết --- */
let SP=null;
VIEWS.spell=()=>{
 const s=setById(R.id);
 if(!SP||SP.src!==R.id)SP={src:R.id,i:0,ok:0,items:shuffle(s.words).slice(0,10),res:null,hint:0};
 const q=SP;
 if(q.i>=q.items.length)return `<div class="fc-wrap"><div class="card" style="text-align:center"><div class="big-score">${q.ok}/${q.items.length}</div><p class="muted">từ viết đúng</p><div class="row" style="justify-content:center"><button class="btn" onclick="SP=null;render()">Làm lại</button><button class="btn pri" onclick="SP=null;go('set',{id:'${s.id}'})">Xong</button></div></div></div>`;
 const w=q.items[q.i];
 const hint=w.w.split('').map((c,i)=>i<q.hint||c===' '?c:'_').join(' ');
 return `<div class="fc-wrap"><div class="crumb" onclick="SP=null;go('set',{id:'${s.id}'})">← ${h(s.title)}</div>
 <div class="row between mb"><span class="small muted">Từ ${q.i+1}/${q.items.length}</span><span class="small muted">Đúng: ${q.ok}</span></div><div class="bar mb"><i style="width:${q.i/q.items.length*100}%"></i></div>
 <div class="card" style="text-align:center"><div class="row" style="justify-content:center"><button class="spk" style="width:64px;height:64px;font-size:26px" onclick="speak('${jsq(w.w)}')">🔊</button><button class="spk" title="Đọc chậm" onclick="speak('${jsq(w.w)}',0.55)">🐢</button></div>
 <p class="mt"><b>Nghĩa:</b> ${h(w.vi)} <span class="muted small">(${h(w.pos||'')})</span></p>
 <p class="muted" style="letter-spacing:2px;font-family:monospace">${h(hint)}</p>
 <input type="text" id="spin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ bạn nghe được" style="text-align:center;font-size:18px;max-width:340px" onkeydown="if(event.key==='Enter')${q.res?'spNext()':'spCheck()'}" ${q.res?'disabled':''} value="${q.res?h(q.res.v):''}">
 ${q.res?`<div class="mt">${q.res.ok?'<b style="color:var(--ok)">Chính xác!</b>':`<b style="color:var(--bad)">Đáp án:</b> <b>${h(w.w)}</b>`}</div><button class="btn pri mt" onclick="spNext()">Tiếp →</button>`:`<div class="row mt" style="justify-content:center"><button class="btn" onclick="SP.hint++;render()">Gợi ý chữ cái</button><button class="btn pri" onclick="spCheck()">Kiểm tra</button></div>`}
 </div></div>`;
};
AFTER.spell=()=>{if(SP&&SP.i<SP.items.length){if(!SP.res&&!SP.spoken){SP.spoken=true;setTimeout(()=>{if(SP&&R.v==='spell'&&SP.items[SP.i])speak(SP.items[SP.i].w)},250)}const el=$('#spin');if(el&&!SP.res)el.focus();if(SP.res)setTimeout(()=>window.addEventListener('keydown',spEnter,{once:true}),50)}};
function spEnter(e){if(e.key==='Enter'&&R.v==='spell'&&SP&&SP.res)spNext()}
function spCheck(){const v=$('#spin').value;if(!v.trim())return;const w=SP.items[SP.i];const ok=norm(v)===norm(w.w);if(ok)SP.ok++;SP.res={ok,v};grade(wkey(SP.src,w.w),ok?(SP.hint?3:4):1);render()}
function spNext(){SP.i++;SP.res=null;SP.hint=0;SP.spoken=false;render()}

/* --- Ghép từ --- */
let MT=null;
VIEWS.match=()=>{
 const s=setById(R.id);
 if(!MT||MT.src!==R.id){const ws=shuffle(s.words).slice(0,6);MT={src:R.id,ws,L:shuffle(ws.map((w,i)=>i)),Rr:shuffle(ws.map((w,i)=>i)),sl:null,sr:null,done:new Set(),err:0,t0:Date.now(),bad:null}}
 const m=MT;
 if(m.done.size===m.ws.length){const sec=Math.round((Date.now()-m.t0)/1000);return `<div class="fc-wrap"><div class="card" style="text-align:center"><div style="font-size:44px">🧩</div><h2>Ghép xong ${m.ws.length} cặp!</h2><p class="muted">Thời gian ${sec} giây · ${m.err} lần sai</p><div class="row" style="justify-content:center"><button class="btn" onclick="MT=null;render()">Chơi lại</button><button class="btn pri" onclick="MT=null;go('set',{id:'${s.id}'})">Xong</button></div></div></div>`}
 return `<div class="fc-wrap"><div class="crumb" onclick="MT=null;go('set',{id:'${s.id}'})">← ${h(s.title)}</div><p class="sub">Chọn một từ bên trái và nghĩa tương ứng bên phải.</p>
 <div class="match"><div class="grid" style="gap:10px">${m.L.map(i=>`<div class="mi ${m.done.has(i)?'done':''} ${m.sl===i?'sel':''} ${m.bad&&m.bad[0]===i?'err':''}" onclick="mtPick('l',${i})">${h(m.ws[i].w)}</div>`).join('')}</div>
 <div class="grid" style="gap:10px">${m.Rr.map(i=>`<div class="mi ${m.done.has(i)?'done':''} ${m.sr===i?'sel':''} ${m.bad&&m.bad[1]===i?'err':''}" onclick="mtPick('r',${i})">${h(m.ws[i].vi)}</div>`).join('')}</div></div>

function mtPick(side,i){const m=MT;if(m.done.has(i))return;m.bad=null;if(side==='l'){m.sl=i;speak(m.ws[i].w)}else m.sr=i;
 if(m.sl!=null&&m.sr!=null){if(m.sl===m.sr){m.done.add(i);grade(wkey(m.src,m.ws[i].w),4)}else{m.err++;m.bad=[m.sl,m.sr];grade(wkey(m.src,m.ws[m.sl].w),1)}m.sl=m.sr=null}

 let score=0,total=0;const essay=qs.find(q=>q.t==='essay');
 qs.forEach(q=>{if(q.t==='essay')return;total++;if(isRight(q,EX.ans[q.n]))score++});

 if(essay)r.essay={text:EX.ans[essay.n]||'',band:null,comment:''};

function upsert(list,items){(items||[]).forEach(x=>{if(!x||!x.id||x.builtin)return;const i=list.findIndex(y=>y.id===x.id);if(i>=0)list[i]=x;else list.push(x)})}
function mergeData(inc){
 if(!inc||inc.app!=='lopta')throw new Error('bad');
 let n={stu:0,res:0};
 if(inc.students){inc.students.forEach(s=>{const ex=D.students.find(x=>x.id===s.id)||D.students.find(x=>x.code===s.code);if(ex){Object.assign(ex,{name:s.name,note:s.note??ex.note})}else{D.students.push(s);n.stu++}})}
 upsert(D.sets,inc.sets);upsert(D.tests,inc.tests);upsert(D.assignments,inc.assignments);
 if(inc.deleted){['sets','tests','assignments'].forEach(k=>(inc.deleted[k]||[]).forEach(id=>{D[k]=D[k].filter(x=>x.id!==id)}))}
 if(inc.settings&&inc.kind==='class-pack'){D.settings.className=inc.settings.className||D.settings.className}
 for(const sid in (inc.progress||{})){const a=P(sid),b=inc.progress[sid];
  for(const k in (b.words||{})){if(!a.words[k]||(b.words[k].last||0)>(a.words[k].last||0))a.words[k]=b.words[k]}
  (b.results||[]).forEach(r=>{const ex=a.results.find(x=>x.id===r.id);if(!ex){a.results.push(r);n.res++}else if(r.essay&&ex.essay&&(r.essay.gradedAt||0)>(ex.essay.gradedAt||0))ex.essay=r.essay});
  a.results.sort((x,y)=>x.date-y.date);
  for(const d in (b.activity||{}))a.activity[d]=Math.max(a.activity[d]||0,b.activity[d]);
 }
 save();return n;
}
function importPack(){pickFile(x=>{try{const n=mergeData(x);toast(`Đã nhập dữ liệu${n.stu?` · ${n.stu} học viên mới`:''}${n.res?` · ${n.res} kết quả mới`:''}`);render()}catch(e){toast('File không đúng định dạng của ứng dụng này')}})}
function classPack(withProgress){return {kind:'class-pack',app:'lopta',date:Date.now(),settings:{className:D.settings.className},students:D.students,sets:D.sets,tests:D.tests,assignments:D.assignments,deleted:D.deleted||{},progress:withProgress?D.progress:undefined}}

const TEST_HELP=`## Tên phần (tùy chọn, mở phần mới)
>> Dòng bắt đầu bằng >> là đoạn văn đọc hiểu (nhiều dòng được)
)) Dòng bắt đầu bằng )) là nội dung bài nghe (máy sẽ đọc)

1. Câu hỏi trắc nghiệm ______ ?
A. đáp án sai
*B. đáp án đúng (đánh dấu * ở đầu)
C. đáp án sai
D. đáp án sai
? Giải thích (tùy chọn)

2. Câu điền từ: The capital of France is ______.
= Paris
? Nhiều đáp án chấp nhận thì cách nhau bằng /  ví dụ: = 10 / ten

3. Đề bài viết luận...
!essay 250

Mẹo: viết {{từ}} để gạch chân (dùng cho câu ngữ âm).`;
function parseTest(src){
 const secs=[];let sec=null,q=null,last=null;const errs=[];
 const newSec=t=>{sec={title:t||'',questions:[]};secs.push(sec);q=null};
 src.split('\n').forEach((raw,ln)=>{const l=raw.trim();if(!l){if(last==='passage'&&sec)sec.passage+='\n';return}
  let m;
  if(l.startsWith('##')){newSec(l.slice(2).trim());last='sec';return}
  if(l.startsWith('>>')){if(!sec||sec.questions.length)newSec('');sec.passage=(sec.passage?sec.passage+'\n':'')+l.slice(2).trim();last='passage';return}
  if(l.startsWith('))')){if(!sec||sec.questions.length)newSec('');sec.audio=(sec.audio?sec.audio+' ':'')+l.slice(2).trim();last='audio';return}
  if((m=l.match(/^\d+\s*[.)]\s*(.*)$/))){if(!sec)newSec('');q={t:'mc',q:m[1],o:[],a:-1};sec.questions.push(q);last='q';return}
  if(q&&(m=l.match(/^(\*?)\s*([A-Ga-g])\s*[.)]\s*(.*)$/))&&q.t==='mc'){if(m[1])q.a=q.o.length;q.o.push(m[3]);last='o';return}
  if(q&&(m=l.match(/^=\s*(.*)$/))){q.t='fill';q.a=m[1].split('/').map(x=>x.trim()).filter(Boolean);delete q.o;last='a';return}
  if(q&&(m=l.match(/^!essay\s*(\d*)/i))){q.t='essay';q.min=+m[1]||0;delete q.o;delete q.a;last='a';return}
  if(q&&l.startsWith('?')){q.e=l.slice(1).trim();last='e';return}
  if(last==='passage'){sec.passage+='\n'+l;return}
  if(last==='audio'){sec.audio+=' '+l;return}
  if(q&&last==='q'){q.q+='\n'+l;return}
  errs.push(`Dòng ${ln+1}: không hiểu "${l.slice(0,40)}"`);
 });
 let n=0;secs.forEach(s=>s.questions.forEach(q=>{n++;if(q.t==='mc'){if(q.o.length<2)errs.push(`Câu ${n}: cần ít nhất 2 phương án A, B…`);else if(q.a<0)errs.push(`Câu ${n}: chưa đánh dấu * cho đáp án đúng`)}if(q.t==='fill'&&!q.a.length)errs.push(`Câu ${n}: thiếu đáp án sau dấu =`)}));
 if(!n)errs.push('Chưa có câu hỏi nào');
 return {sections:secs.filter(s=>s.questions.length||s.passage),errs,n};
}
