<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --bg2:#edf0f7; --card:#ffffff; --ink:#151c2a; --ink2:#323b4c; --muted:#667085; --line:#e1e4ea; --line2:#cfd4dd;
  --brand:#2a55d6; --brand-ink:#ffffff; --brand-soft:#e7eeff;
  --accent:#b0620a; --accent-ink:#ffffff; --accent-soft:#fff0d9; --mark:#ffd84a;
  --ok:#14864f; --ok-soft:#dff6e9; --bad:#d23c3c; --bad-soft:#fde6e6; --warn:#a76300; --warn-soft:#fff1d6;
  --shadow:0 1px 2px rgba(21,28,42,.04);
  --c-read:#2a55d6; --c-read-soft:#e5ecff; --c-listen:#0b8a6a; --c-listen-soft:#d9f5eb; --c-write:#c4561a; --c-write-soft:#fde8dc; --c-speak:#8b3cc8; --c-speak-soft:#f2e5fd;
  --shadow-lg:0 2px 4px rgba(21,28,42,.04),0 16px 36px -12px rgba(21,28,42,.16);
  --r:16px; --r-sm:11px;
  --ease:cubic-bezier(.2,.75,.25,1);
  --serif:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --bg2:#151b29; --card:#161d2c; --ink:#e7eaf0; --ink2:#c8cdd8; --muted:#8e98aa; --line:#252e40; --line2:#323c50;
    --brand:#86a6ff; --brand-ink:#0b1020; --brand-soft:#1b2750;
    --accent:#ffc54d; --accent-ink:#1a1405; --accent-soft:#33280f; --mark:#d9a92a;
    --ok:#5ad69a; --ok-soft:#132e20; --bad:#ff8a8a; --bad-soft:#3a1c1f; --warn:#e2b864; --warn-soft:#2f2717;
    --shadow:0 1px 1px rgba(0,0,0,.25); --shadow-lg:0 18px 40px -14px rgba(0,0,0,.65);
    --c-read:#86a6ff; --c-read-soft:#1b2750; --c-listen:#56d8b3; --c-listen-soft:#103329; --c-write:#ff9d66; --c-write-soft:#3a2416; --c-speak:#cd9cff; --c-speak-soft:#2e1f44;
  }
}
:root[data-theme="dark"]{
    --bg:#0f1420; --bg2:#151b29; --card:#161d2c; --ink:#e7eaf0; --ink2:#c8cdd8; --muted:#8e98aa; --line:#252e40; --line2:#323c50;
    --brand:#86a6ff; --brand-ink:#0b1020; --brand-soft:#1b2750;
    --accent:#ffc54d; --accent-ink:#1a1405; --accent-soft:#33280f; --mark:#d9a92a;
    --ok:#5ad69a; --ok-soft:#132e20; --bad:#ff8a8a; --bad-soft:#3a1c1f; --warn:#e2b864; --warn-soft:#2f2717;
    --shadow:0 1px 1px rgba(0,0,0,.25); --shadow-lg:0 18px 40px -14px rgba(0,0,0,.65);
    --c-read:#86a6ff; --c-read-soft:#1b2750; --c-listen:#56d8b3; --c-listen-soft:#103329; --c-write:#ff9d66; --c-write-soft:#3a2416; --c-speak:#cd9cff; --c-speak-soft:#2e1f44;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--mark);color:#151c2a}
a{color:var(--brand);text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* header */
header.top{view-transition-name:hdr;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.top.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 24px -18px rgba(0,0,0,.25)}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.logo b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--brand);color:var(--brand);font-family:var(--serif);font-weight:500;font-size:15px;font-style:italic;transition:background .35s var(--ease),color .35s var(--ease)}
.logo:hover b{background:var(--brand);color:var(--brand-ink)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav.tabs button{position:relative;border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14.5px;border-radius:8px;transition:color .25s}
nav.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:var(--line2);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
nav.tabs .tl{position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--tc,var(--brand));view-transition-name:tabline}
nav.tabs button[data-sk=speaking]{--tc:var(--c-speak)}nav.tabs button[data-sk=writing]{--tc:var(--c-write)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button:hover::after{transform:scaleX(.35)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::after{display:none}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}

main{padding:34px 0 80px}
h1,h2,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:clamp(28px,3.4vw,38px);line-height:1.15;margin:0 0 6px}
h2{font-size:21px;line-height:1.3;margin:0 0 12px}
h3{font-size:15.5px;font-weight:600;margin:0 0 6px;letter-spacing:-.005em}
.sub{color:var(--muted);margin:0 0 26px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.card[onclick],button.card{cursor:pointer}
.card[onclick]:hover,button.card:hover{border-color:var(--ink2)}
button.card{font:inherit;color:inherit;width:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stat{padding:18px 20px}
.stat .n{font-family:var(--serif);font-size:34px;font-weight:400;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:4px;letter-spacing:.01em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14.5px;text-decoration:none;color:var(--ink);transition:background .25s,border-color .25s,color .25s,transform .15s var(--ease),box-shadow .25s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08);box-shadow:0 8px 20px -8px var(--brand)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.acc:hover{filter:brightness(1.05);box-shadow:0 8px 20px -10px var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:transparent;background:var(--bg2)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:14px}.mt2{margin-top:30px}.mb{margin-bottom:18px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-weight:500}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.gray{background:var(--bg2);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--card);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
textarea.prose{font-family:var(--sans);font-size:15.5px;line-height:1.75;min-height:300px}
label.f{display:block;font-size:12.5px;font-weight:600;margin:14px 0 6px;color:var(--ink2);letter-spacing:.01em}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg2);padding:4px;border-radius:999px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted);transition:background .3s var(--ease),color .25s,box-shadow .3s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px -2px rgba(0,0,0,.08)}
.bar{height:4px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transform-origin:left;transition:width .5s var(--ease)}
#app.enter .bar i{animation:grow 1s .2s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--bg)}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.tbl{overflow-x:auto}
hr{border:0;border-top:1px solid var(--line)}

/* login */
.login{max-width:420px;margin:7vh auto 0}
.login .hero{text-align:center;margin-bottom:26px}
.login .hero b{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;border:1px solid var(--ink);color:var(--ink);font-family:var(--serif);font-style:italic;font-weight:400;font-size:28px;margin-bottom:18px}
.login .hero h1{font-size:clamp(30px,5vw,40px)}
.login .hero .sub{margin:0 auto}
.login .card{padding:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13px;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--ink);background:var(--bg)}

/* flashcard */
.fc-wrap{max-width:580px;margin:0 auto}
.flash{perspective:1400px;cursor:pointer;height:320px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.flash .back{transform:rotateY(180deg);background:var(--brand-soft)}
.flash .word{font-family:var(--serif);font-size:42px;font-weight:400;letter-spacing:-.02em}
.flash .ipa{color:var(--muted);margin-top:6px}
.flash .vi{font-family:var(--serif);font-size:28px;font-weight:500;color:var(--brand)}
.flash .ex{margin-top:14px;font-style:italic;color:var(--ink2);max-width:440px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.rate button{padding:13px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;transition:transform .2s var(--ease),border-color .2s,box-shadow .25s}
.rate button:hover{border-color:currentColor}
.rate button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.rate .r1{color:var(--bad)}.rate .r2{color:var(--warn)}.rate .r3{color:var(--brand)}.rate .r4{color:var(--ok)}
.spk{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;display:inline-grid;place-items:center;transition:background .25s,transform .2s var(--ease),border-color .25s}
.spk:hover{background:var(--brand-soft);border-color:var(--brand);transform:scale(1.06)}

/* quiz */
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .2s,background .25s,transform .2s var(--ease)}
.opt:hover{border-color:var(--ink2)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted);transition:all .25s}
.opt.sel{border-color:var(--ink);background:var(--bg)}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);animation:pop .4s var(--ease)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes pop{50%{transform:scale(1.015)}}
@keyframes shake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.qbig{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.01em}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:center;font-weight:500;min-height:56px;transition:border-color .2s,background .2s,transform .2s var(--ease),opacity .3s}
.mi:hover{border-color:var(--ink2)}
.mi.sel{border-color:var(--ink);background:var(--bg)}
.mi.done{visibility:hidden}
.mi.err{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}

/* exam */
.exam-head{position:sticky;top:var(--hdr,64px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line2);letter-spacing:.02em}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 16%,transparent)}}
.passage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;white-space:pre-wrap;font-family:var(--serif);line-height:1.9;font-size:16.5px;color:var(--ink2);max-width:72ch}
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12.5px;margin-right:10px;padding:0 8px;font-variant-numeric:tabular-nums}
.q .opts{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fill{max-width:300px;margin-top:10px}
.qnav{display:flex;flex-wrap:wrap;gap:5px}
.qnav span{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:11.5px;font-weight:600;background:var(--bg2);color:var(--muted);cursor:pointer;transition:background .25s,color .25s,transform .2s var(--ease)}
.qnav span:hover{background:var(--line2);color:var(--ink)}
.qnav span.done{background:var(--ink);color:var(--bg)}
.review .ok{color:var(--ok);font-weight:600}.review .bad{color:var(--bad);font-weight:600}
.explain{margin-top:8px;padding:10px 14px;background:var(--warn-soft);border-radius:var(--r-sm);font-size:14px}
.big-score{font-family:var(--serif);font-size:64px;font-weight:400;color:var(--brand);line-height:1;letter-spacing:-.03em}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14.5px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--bg2)}
.heat i.l1{background:color-mix(in srgb,var(--brand) 30%,var(--bg2))}
.heat i.l2{background:color-mix(in srgb,var(--brand) 62%,var(--bg2))}
.heat i.l3{background:var(--brand)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:99;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);font-size:14px;animation:toastIn .45s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}}
.modal-bg{position:fixed;inset:0;background:rgba(15,16,17,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .3s ease}
.modal{background:var(--card);border-radius:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:28px;box-shadow:var(--shadow-lg);animation:modalIn .45s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-bottom:12px;cursor:pointer;transition:color .2s,transform .25s var(--ease)}
.crumb:hover{color:var(--ink);transform:translateX(-3px)}
pre.help{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;font-size:12.5px;white-space:pre-wrap;margin:8px 0 0}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary b::before{content:"+";display:inline-block;width:1em;color:var(--muted);transition:transform .3s var(--ease)}
details[open]>summary b::before{transform:rotate(45deg)}
details[open]>*:not(summary){animation:rise .4s var(--ease) both}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mode-ico{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--bg2);color:var(--ink);margin-bottom:14px;transition:background .35s var(--ease),color .35s var(--ease),transform .35s var(--ease)}
button.card .mode-ico{--mc:var(--c-read);--mcs:var(--c-read-soft);background:var(--mcs);color:var(--mc)}
.grid>button.card:nth-child(2) .mode-ico{--mc:var(--c-listen);--mcs:var(--c-listen-soft)}
.grid>button.card:nth-child(3) .mode-ico{--mc:var(--c-write);--mcs:var(--c-write-soft)}
.grid>button.card:nth-child(4) .mode-ico{--mc:var(--c-speak);--mcs:var(--c-speak-soft)}
button.card:hover .mode-ico{background:var(--mc);color:var(--card)}
.grid>.stat:nth-child(1) .n{color:var(--c-read)}.grid>.stat:nth-child(2) .n{color:var(--c-listen)}.grid>.stat:nth-child(4) .n{color:var(--c-speak)}.grid>.stat:nth-child(5) .n{color:var(--c-write)}

/* skill colours */
#app{--sk:var(--brand);--sk-soft:var(--brand-soft)}
#app[data-skill=Reading],.tcard[data-skill=Reading]{--sk:var(--c-read);--sk-soft:var(--c-read-soft)}
#app[data-skill=Listening],.tcard[data-skill=Listening]{--sk:var(--c-listen);--sk-soft:var(--c-listen-soft)}
#app[data-skill=Writing],.tcard[data-skill=Writing]{--sk:var(--c-write);--sk-soft:var(--c-write-soft)}
#app[data-skill=Speaking],.tcard[data-skill=Speaking]{--sk:var(--c-speak);--sk-soft:var(--c-speak-soft)}
.tag.sk{background:var(--sk-soft);color:var(--sk)}
#app .qn{background:var(--sk-soft);color:var(--sk)}
#app .bar i,#app .qnav span.done{background:var(--sk)}
#app .qnav span.done{color:var(--card)}
.sk-line{display:block;width:36px;height:3px;border-radius:3px;background:var(--sk);margin:0 0 14px}

#app[data-v=exam] .seg button.on{color:var(--sk)}

/* view transitions */
::view-transition-old(root){animation:vtOut .22s ease both}
::view-transition-new(root){animation:vtIn .5s var(--ease) both}
::view-transition-group(hero),::view-transition-group(tabline){animation-duration:.5s;animation-timing-function:var(--ease)}
::view-transition-old(hdr),::view-transition-new(hdr){animation:none}
@keyframes vtOut{to{opacity:0;transform:translateY(-4px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}

/* flashcard depth */
.flash{position:relative}
.flash .in{transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--fy,0deg)));transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.flash.tilting .in{transition:transform .7s cubic-bezier(.3,.7,.2,1),--rx 0s}
.flash.flip .in{--fy:180deg}
.flash::after{content:"";position:absolute;left:12%;right:12%;bottom:-18px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(21,28,42,.18),transparent);filter:blur(4px);transition:transform .7s var(--ease),opacity .7s;z-index:-1}
.flash.flip::after{transform:scaleX(.82);opacity:.7}
.flash .face{box-shadow:0 1px 2px rgba(21,28,42,.05),0 22px 44px -22px rgba(21,28,42,.28)}
.flash.deal .in{animation:deal .55s var(--ease)}
@keyframes deal{from{opacity:0;transform:translateX(40px) rotateY(-14deg)}}
.rate button small{margin-top:2px}

/* celebration */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;opacity:0;animation:fall var(--d,1.6s) cubic-bezier(.2,.6,.35,1) var(--dl,0s) forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,80vh)) rotate(var(--rot,360deg))}}
.done-ring{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);margin-bottom:10px}
.done-ring svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* reading tools, split screen, focus mode */
:root{--pfs:16.5px;--eh:0px}
.passage{font-size:var(--pfs)}
.rtools{display:flex;gap:4px;align-items:center}
.rtools .btn{padding:6px 11px;font-size:13px}
.rtools .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
mark.hl{background:color-mix(in srgb,var(--mark) 70%,transparent);color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
:root.hl-on .passage{cursor:text}
:root.focus{--hdr:0px!important}
:root.focus header.top{display:none}
:root.focus body{background:var(--card)}
:root.focus .passage{border-color:transparent;box-shadow:none}
@media (min-width:1024px){
  :root[data-view=test] .wrap{max-width:1360px}
  .split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
  .split>.passage{position:sticky;top:calc(var(--hdr,64px) + var(--eh) + 14px);max-height:calc(100vh - var(--hdr,64px) - var(--eh) - 28px);overflow:auto;max-width:none;margin:0;overscroll-behavior:contain}
  .split>.card{margin:0}
}

/* login scene */
.login-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.login-bg::before{content:"";position:absolute;inset:-20%;background:
  radial-gradient(40% 35% at 18% 22%,color-mix(in srgb,var(--c-read) 34%,transparent),transparent 70%),
  radial-gradient(35% 30% at 85% 30%,color-mix(in srgb,var(--c-listen) 30%,transparent),transparent 70%),
  radial-gradient(40% 35% at 70% 88%,color-mix(in srgb,var(--c-write) 28%,transparent),transparent 70%),
  radial-gradient(30% 28% at 10% 85%,color-mix(in srgb,var(--c-speak) 26%,transparent),transparent 70%);
  filter:blur(10px);animation:drift 28s ease-in-out infinite alternate}
.login-bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 31px,color-mix(in srgb,var(--ink) 6%,transparent) 31px 32px);-webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
@keyframes drift{to{transform:translate(3%,-2%) rotate(4deg) scale(1.05)}}
.login .card{background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.quote{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.55;color:var(--ink2);max-width:36ch;margin:14px auto 0}
.quote span{display:inline-block;opacity:0;transform:translateY(6px);animation:word .6s var(--ease) forwards}
.quote small{display:block;font-family:var(--sans);font-style:normal;font-size:12.5px;color:var(--muted);margin-top:6px;opacity:0;animation:word .6s 1.4s var(--ease) forwards}
@keyframes word{to{opacity:1;transform:none}}

/* audio player */
.player{display:flex;align-items:center;gap:16px;padding:16px 18px}
.player .pp{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--sk);color:var(--card);cursor:pointer;display:grid;place-items:center;transition:transform .2s var(--ease),box-shadow .3s}
.player .pp:hover{box-shadow:0 0 0 6px var(--sk-soft)}
.player .pp:active{transform:scale(.95)}
.player .pp svg{width:22px;height:22px;fill:currentColor}
.player .wv{flex:1;min-width:0;height:48px;cursor:pointer;display:block;touch-action:none}
.player .tm{flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:92px;text-align:right}
.player.loading .pp{opacity:.6}
.player-note{margin:8px 2px 0}
@media (max-width:640px){.exam-head .row.between>b{flex:1 1 100%!important}.rtools .btn{white-space:nowrap}.exam-head .qnav span{width:24px;height:24px;font-size:10.5px}.rtools{flex:1;gap:2px}.rtools .btn{padding:5px 9px;font-size:12.5px}.exam-head .timer{font-size:15px;padding:5px 11px}.player{gap:10px;padding:12px}.player .pp{width:44px;height:44px}.player .tm{min-width:0;font-size:12px}}

/* motion: entrance on view change */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.enter>*,#app.enter .grid>*{animation:rise .5s var(--ease) both}
#app.enter>.login-bg{animation:none}
#app.enter>*:nth-child(2){animation-delay:.05s}
#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}
#app.enter>*:nth-child(5){animation-delay:.2s}
#app.enter>*:nth-child(n+6){animation-delay:.25s}
#app.enter .grid>*:nth-child(1){animation-delay:.08s}
#app.enter .grid>*:nth-child(2){animation-delay:.13s}
#app.enter .grid>*:nth-child(3){animation-delay:.18s}
#app.enter .grid>*:nth-child(4){animation-delay:.23s}
#app.enter .grid>*:nth-child(5){animation-delay:.28s}
#app.enter .grid>*:nth-child(6){animation-delay:.33s}
#app.enter .grid>*:nth-child(n+7){animation-delay:.38s}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}

@media (max-width:640px){
  .wrap{padding:0 16px}
  header.top .wrap{padding-top:8px;padding-bottom:4px;gap:8px;min-height:56px}
  nav.tabs{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin:0 -16px;padding:0 10px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{white-space:nowrap}
  main{padding-top:24px}
  .card{padding:18px}
  .flash{height:270px}.flash .word{font-size:32px}
  .rate{grid-template-columns:repeat(2,1fr)}
  .who{margin-left:auto;gap:6px}
  .who>span:first-child{display:none}
  .passage{padding:18px}
  .stat .n{font-size:28px}
  .g2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .login-bg::before{animation:none}
  .quote span,.quote small{opacity:1;transform:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>

  sections:[{title:'Reading Passage',passage:`Urban beekeeping

Over the past two decades, beekeeping has moved from the countryside into the heart of many cities. Rooftops in London, Paris and New York now host thousands of hives, many of them managed by amateurs who have taken short training courses. Supporters argue that cities can be surprisingly good places for bees. Parks, gardens and tree-lined streets offer a wide variety of flowers, and urban areas are often free from the pesticides used on large farms.

However, some scientists have begun to question whether the trend is as beneficial as it seems. A study in one European capital found that the number of honeybee colonies had grown so quickly that there were no longer enough flowers to feed them. Honeybees, which live in large colonies, may compete with wild bees for nectar and pollen. Wild bees, which include hundreds of solitary species, are often more important pollinators of native plants than honeybees are.

Researchers therefore recommend that city authorities focus less on adding hives and more on planting. Replacing short-cut lawns with meadows of native wildflowers, for example, would benefit all pollinating insects. Some cities have already started to leave road verges uncut during the summer months. Early results suggest that this simple change can double the number of insect species recorded in an area.

For those who still wish to keep bees, experts advise registering hives with local authorities so that colony density can be monitored.`,

SAMPLE_TESTS.push(...(window.IELTS_DATA||[])); /* đề IELTS theo Vol: data/ielts/*.js */

/* =========================================================
   LƯU TRỮ
   ========================================================= */
const KEY='lopta_data_v1', SKEY='lopta_session_v1';
const DAY=86400000;
function blank(){return {teacherPin:'1234',settings:{selfReg:true,className:'Lớp Tiếng Anh'},students:[],sets:[],tests:[],assignments:[],progress:{}}}
let D=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.students)return Object.assign(blank(),x)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Không lưu được dữ liệu trên trình duyệt này')}}
function getSession(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}}
function setSession(s){try{s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY)}catch(e){}}

const allSets=()=>[...SAMPLE_SETS,...D.sets];
const allTests=()=>[...SAMPLE_TESTS,...D.tests];
const setById=id=>allSets().find(s=>s.id===id);
const testById=id=>allTests().find(t=>t.id===id);
const stuById=id=>D.students.find(s=>s.id===id);
function P(sid){sid=sid||U.id;if(!D.progress[sid])D.progress[sid]={words:{},results:[],activity:{}};const p=D.progress[sid];p.writings=p.writings||[];p.speaking=p.speaking||[];return p}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const wkey=(setId,w)=>setId+'::'+w.toLowerCase();

/* =========================================================
   TIỆN ÍCH
   ========================================================= */
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>h(s).replace(/\{\{(.+?)\}\}/g,'<u>$1</u>').replace(/\n/g,'<br>');
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;:"]+$/,'').replace(/\s+/g,' ').trim();
const fdate=t=>new Date(t).toLocaleDateString('vi-VN');
const fdt=t=>new Date(t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(html){$('#modal').innerHTML=html?`<div class="modal-bg" onclick="if(event.target===this)modal('')"><div class="modal">${html}</div></div>`:''}
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,rate=0.9){if(!('speechSynthesis' in window)){toast('Trình duyệt không hỗ trợ đọc');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u)}
function download(name,obj){const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){toast('File không hợp lệ')}};r.readAsText(f)};i.click()}

/* =========================================================
   LẶP LẠI NGẮT QUÃNG (SM-2 rút gọn)
   q: 1=Quên, 3=Khó, 4=Nhớ, 5=Dễ
   ========================================================= */
function grade(key,q){
 const p=P();const now=Date.now();
 const c=p.words[key]||{ef:2.5,iv:0,reps:0,due:0,lapses:0,seen:0};
 c.seen=(c.seen||0)+1;
 if(q<3){c.reps=0;c.iv=0;c.lapses++;c.due=now+10*60000}
 else{c.reps++;c.iv=c.reps===1?(q===5?3:1):c.reps===2?(q===5?6:3):Math.round(c.iv*c.ef*(q===5?1.3:q===3?0.8:1));c.iv=Math.max(1,c.iv);c.due=now+c.iv*DAY}
 c.ef=Math.max(1.3,Math.min(3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02))));
 c.last=now;p.words[key]=c;bump();save();
}
function bump(sid){const p=P(sid);const d=today();p.activity[d]=(p.activity[d]||0)+1}
function wstatus(rec){if(!rec)return 'new';if(rec.iv>=7)return 'mastered';return 'learning'}
function setStats(set,sid){const p=P(sid);let n=0,l=0,m=0,due=0;const now=Date.now();set.words.forEach(w=>{const r=p.words[wkey(set.id,w.w)];const s=wstatus(r);if(s==='new')n++;else if(s==='mastered')m++;else l++;if(r&&r.due<=now)due++});return{total:set.words.length,n,l,m,due,learned:l+m}}
function dueList(sid){const p=P(sid),now=Date.now(),out=[];allSets().forEach(s=>s.words.forEach(w=>{const r=p.words[wkey(s.id,w.w)];if(r&&r.due<=now)out.push({set:s,w})}));return out}
function streak(sid){const a=P(sid).activity;let n=0;let d=new Date();if(!a[today()])d=new Date(Date.now()-DAY);while(a[d.toISOString().slice(0,10)]){n++;d=new Date(d.getTime()-DAY)}return n}
function stuSummary(sid){const p=P(sid);const vals=Object.values(p.words);return{learned:vals.length,mastered:vals.filter(r=>r.iv>=7).length,due:dueList(sid).length,tests:p.results.length,streak:streak(sid),last:Math.max(0,...vals.map(r=>r.last||0),...p.results.map(r=>r.date))}}

/* =========================================================
   CHẤM ĐIỂM
   ========================================================= */
function flatQs(t){const out=[];t.sections.forEach((s,si)=>s.questions.forEach((q,qi)=>out.push({...q,si,qi,n:out.length+1})));return out}
function isRight(q,ans){if(ans==null||ans==='')return false;if(q.t==='mc')return ans===q.a;if(q.t==='fill')return q.a.map(norm).includes(norm(ans));return false}
function ieltsBand(score,total){const r=Math.round(score/total*40);const m=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];for(const[k,b]of m)if(r>=k)return b;return 2}
function resultLabel(t,r){
 if(r.essay&&r.total===0){return r.essay.band!=null&&r.essay.band!==''?`Band ${r.essay.band}`:'Chờ chấm'}
 if(t&&t.type==='ielts')return `${r.score}/${r.total} · Band ~${ieltsBand(r.score,r.total)}`;
 return `${r.score}/${r.total} · ${(Math.round(r.score/r.total*10*100)/100)} điểm`;
}
function bestPct(sid,testId){const rs=P(sid).results.filter(r=>r.testId===testId&&r.total>0);if(!rs.length)return null;return Math.max(...rs.map(r=>r.score/r.total))}

/* =========================================================
   GIAO BÀI
   ========================================================= */
function myAssignments(sid){return D.assignments.filter(a=>a.to==='all'||(a.to||[]).includes(sid))}
const KLAB={test:'Đề thi',set:'Bộ từ',writing:'Writing',speaking:'Speaking'};
function asgItem(a){if(a.kind==='test')return testById(a.ref);if(a.kind==='set')return setById(a.ref);if(a.kind==='writing'){const w=wById(a.ref);return w&&{title:'Writing Task '+w.task+' · '+w.title}}const t=spTopicById(a.ref);return t&&{title:'Speaking · '+(t.cue||t.title)}}
function asgOpen(a){if(a.kind==='test')return `go('test',{id:'${a.ref}'})`;if(a.kind==='set')return `go('set',{id:'${a.ref}'})`;if(a.kind==='writing')return `go('writing');wStart('${a.ref}')`;return `go('speaking');skStart('${a.ref}')`}
function assignDone(a,sid){
 if(a.kind==='writing')return (P(sid).writings||[]).some(r=>r.promptId===a.ref&&r.date>=a.created);
 if(a.kind==='speaking')return (P(sid).speaking||[]).some(r=>r.topic===a.ref&&r.date>=a.created);
 if(a.kind==='test')return P(sid).results.some(r=>r.testId===a.ref&&r.date>=a.created);
 const s=setById(a.ref);if(!s)return false;const st=setStats(s,sid);return st.n===0;
}

/* =========================================================
   TRẠNG THÁI & ĐIỀU HƯỚNG
   ========================================================= */
let U=null; // {role,id,name}
let R={v:'home'}; // route
let timerH=null;
function go(v,extra){if(typeof REC!=='undefined'&&REC.on)recStop();if(v!=='speaking'&&typeof SK!=='undefined')SK=null;if(v!=='writing'&&typeof WR!=='undefined')WR=null;if(R.v==='test'&&R.running&&v!=='result'){if(!confirm('Bạn đang làm bài. Thoát sẽ mất bài làm. Vẫn thoát?'))return}clearInterval(timerH);if('speechSynthesis' in window)speechSynthesis.cancel();document.querySelectorAll('.player').forEach(o=>o._a&&o._a.pause());
 const upd=()=>{R=Object.assign({v},extra||{});render();window.scrollTo(0,0)};
 if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&U){
  const id=extra&&extra.id;if(id){const src=document.querySelector(`[data-vt="${CSS.escape(id)}"]`);if(src)src.style.viewTransitionName='hero'}
  _vt=true;try{const vt=document.startViewTransition(()=>{try{upd()}finally{_vt=false}});[vt.ready,vt.finished,vt.updateCallbackDone].forEach(x=>x&&x.catch(()=>{}))}catch(e){_vt=false;upd()}
 }else upd()}
let _vt=false;
function logout(){if(R.v==='test'&&R.running&&!confirm('Thoát khi đang làm bài?'))return;R.running=false;U=null;loginTab='stu';setSession(null);go('login')}

function header(){
 const el=$('#hdr');
 if(!U){el.innerHTML=`<div class="wrap"><div class="logo"><b>A</b>${h(D.settings.className)}</div></div>`;return}
 const st=[['home','Trang chủ'],['vocab','Luyện từ'],['exam','Luyện đề'],['speaking','Speaking'],['writing','Writing'],['history','Kết quả']];
 const tt=[['t-students','Học viên'],['t-grade','Chấm bài'],['t-sets','Bộ từ'],['t-tests','Đề thi'],['t-sw','Đề Nói/Viết'],['t-assign','Giao bài'],['t-data','Dữ liệu']];
 const tabs=U.role==='teacher'?tt:st;
 const cur=R.v;
 const isOn=k=>cur===k||(k==='vocab'&&['set','flash','quiz','spell','match','review'].includes(cur))||(k==='exam'&&['test','result'].includes(cur))||(k==='t-students'&&cur==='t-student')||(k==='speaking'&&cur==='skres')||(k==='writing'&&cur==='wres')||(k==='t-grade'&&cur==='t-review');
 el.innerHTML=`<div class="wrap"><div class="logo" onclick="go('${tabs[0][0]}')"><b>A</b><span>${h(D.settings.className)}</span></div>
 <nav class="tabs">${tabs.map(([k,l])=>`<button class="${isOn(k)?'on':''}" data-sk="${k}" onclick="go('${k}')">${l}${isOn(k)?'<i class="tl"></i>':''}</button>`).join('')}</nav>
 <div class="who">${U.role==='teacher'?'<span class="tag acc">Giáo viên</span>':`<span>${h(U.name)}</span><span class="tag gray">${h(U.code)}</span>`}<button class="btn sm ghost" onclick="logout()">Đăng xuất</button></div></div>`;
}

function render(){
 if(!U&&R.v!=='login')R={v:'login'};
 if(U&&U.role==='student'&&R.v.startsWith('t-'))R={v:'home'};

let FC=null;

}

function fcView(){
 const f=FC;
 if(!f.q.length)return `<div class="crumb" onclick="${f.back}">← Quay lại</div><div class="card empty">Không có từ nào cần ôn. Tuyệt vời!</div>`;
 if(f.i>=f.q.length){const t=f.done;FC=null;setTimeout(celebrate,250);return `<div class="fc-wrap"><div class="card" style="text-align:center">${DONE_RING}<h2>Hoàn thành!</h2><p class="muted">Bạn vừa ôn ${t} lượt thẻ. Các từ sẽ được nhắc lại đúng lúc sắp quên.</p><div class="row" style="justify-content:center">${f.more?`<button class="btn" onclick="render()">Học tiếp 20 thẻ</button>`:''}<button class="btn pri" onclick="${f.back}">Xong</button></div></div></div>`}
 const it=f.q[f.i];const w=it.w;
 return `<div class="fc-wrap"><div class="crumb" onclick="FC=null;${f.back}">← ${h(f.title)}</div>
 <div class="row between mb"><span class="small muted">Thẻ ${f.i+1}/${f.q.length}</span><span class="small muted">Dấu cách: lật · 1–4: đánh giá</span></div>
 <div class="bar mb"><i style="width:${f.i/f.q.length*100}%"></i></div>
 <div class="flash ${f.flip?'flip':''} ${f.dealt!==f.i?'deal':''}" onclick="fcFlip()" onpointermove="fcTilt(event,this)" onpointerleave="fcTilt(null,this)"><div class="in">
  <div class="face"><div class="word">${h(w.w)}</div><div class="ipa">${h(w.pos||'')} ${h(w.ipa||'')}</div><div class="mt"><button class="spk" onclick="event.stopPropagation();speak('${jsq(w.w)}')"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button></div><div class="small muted mt">Bấm vào thẻ để xem nghĩa</div></div>
  <div class="face back"><div class="vi">${h(w.vi)}</div><div class="ipa">${h(w.w)} ${h(w.ipa||'')}</div>${w.ex?`<div class="ex">“${h(w.ex)}”</div>`:''}</div>
 </div></div>
 ${(f.dealt=f.i,'')}${f.flip?(()=>{const k=wkey(it.set.id,w.w);return `<div class="rate"><button class="r1" onclick="fcRate(1)">Quên<small>ôn lại ${ivPreview(k,1)}</small></button><button class="r2" onclick="fcRate(3)">Khó<small>ôn lại ${ivPreview(k,3)}</small></button><button class="r3" onclick="fcRate(4)">Nhớ<small>ôn lại ${ivPreview(k,4)}</small></button><button class="r4" onclick="fcRate(5)">Dễ<small>ôn lại ${ivPreview(k,5)}</small></button></div>`})():`<button class="btn pri mt" style="width:100%" onclick="fcFlip()">Lật thẻ</button>`}
 </div>`;
}
function ivPreview(key,q){const c=Object.assign({ef:2.5,iv:0,reps:0},P().words[key]||{});if(q<3)return 'sau 10 phút';const reps=c.reps+1;let iv=reps===1?(q===5?3:1):reps===2?(q===5?6:3):Math.round(c.iv*c.ef*(q===5?1.3:q===3?0.8:1));iv=Math.max(1,iv);return iv===1?'ngày mai':iv<31?`sau ${iv} ngày`:`sau ${Math.round(iv/30)} tháng`}
function fcTilt(e,el){if(matchMedia('(prefers-reduced-motion: reduce)').matches||(e&&e.pointerType!=='mouse'))return;const inn=el.querySelector('.in');if(!e){inn.style.removeProperty('--rx');inn.style.removeProperty('--ry');return}const b=el.getBoundingClientRect();const x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;inn.style.setProperty('--rx',(-y*7).toFixed(2)+'deg');inn.style.setProperty('--ry',(x*9).toFixed(2)+'deg')}
function fcFlip(){FC.flip=!FC.flip;if(FC.flip)speak(FC.q[FC.i].w.w);render()}
function fcRate(q){const it=FC.q[FC.i];grade(wkey(it.set.id,it.w.w),q);FC.done++;if(q===1)FC.q.push(it);FC.i++;FC.flip=false;render()}
document.addEventListener('keydown',e=>{
 if(!FC||!['flash','review'].includes(R.v)||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 if(e.code==='Space'){e.preventDefault();fcFlip()}
 else if(FC.flip&&['1','2','3','4'].includes(e.key))fcRate([1,3,4,5][+e.key-1]);
});

/* --- Trắc nghiệm từ --- */
let QZ=null;
function distractors(set,w,field){const pool=[...set.words,...allSets().filter(s=>s.id!==set.id).flatMap(s=>s.words)].filter(x=>x.w!==w.w);const seen=new Set([w[field]]);const out=[];for(const x of shuffle(pool)){if(!seen.has(x[field])){seen.add(x[field]);out.push(x[field])}if(out.length===3)break}return out}
VIEWS.quiz=()=>{
 const s=setById(R.id);
 if(!QZ||QZ.src!==R.id){const ws=shuffle(s.words).slice(0,10);QZ={src:R.id,i:0,ok:0,items:ws.map(w=>{const dir=Math.random()<.6?'en':'vi';const f=dir==='en'?'vi':'w';const opts=shuffle([w[f],...distractors(s,w,f)]);return{w,dir,opts,ans:opts.indexOf(w[f]),pick:null}})}}
 const q=QZ;
 if(q.i>=q.items.length){const r=`<div class="fc-wrap"><div class="card" style="text-align:center"><div class="big-score">${q.ok}/${q.items.length}</div><p class="muted">câu đúng</p><div class="row" style="justify-content:center"><button class="btn" onclick="QZ=null;render()">Làm lại</button><button class="btn pri" onclick="QZ=null;go('set',{id:'${s.id}'})">Xong</button></div></div></div>`;return r}
 const it=q.items[q.i];
 return `<div class="fc-wrap"><div class="crumb" onclick="QZ=null;go('set',{id:'${s.id}'})">← ${h(s.title)}</div>
 <div class="row between mb"><span class="small muted">Câu ${q.i+1}/${q.items.length}</span><span class="small muted">Đúng: ${q.ok}</span></div><div class="bar mb"><i style="width:${q.i/q.items.length*100}%"></i></div>
 <div class="card"><div class="small muted">${it.dir==='en'?'Nghĩa của từ này là gì?':'Từ tiếng Anh nào có nghĩa này?'}</div>
 <div class="row mt"><div class="qbig">${h(it.dir==='en'?it.w.w:it.w.vi)}</div>${it.dir==='en'?`<button class="spk" onclick="speak('${jsq(it.w.w)}')"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>`:''}</div>
 <div class="opts">${it.opts.map((o,i)=>{let c='';if(it.pick!=null){if(i===it.ans)c='right';else if(i===it.pick)c='wrong'}return `<button class="opt ${c}" onclick="qzPick(${i})" ${it.pick!=null?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${h(o)}</span></button>`}).join('')}</div>
 ${it.pick!=null?`<div class="mt small">${it.pick===it.ans?'<b style="color:var(--ok)">Chính xác!</b>':'<b style="color:var(--bad)">Chưa đúng.</b>'} <b>${h(it.w.w)}</b> = ${h(it.w.vi)}${it.w.ex?` · <i>${h(it.w.ex)}</i>`:''}</div><button class="btn pri mt" onclick="QZ.i++;render()">Tiếp →</button>`:''}
 </div></div>`;
};
function qzPick(i){const it=QZ.items[QZ.i];if(it.pick!=null)return;it.pick=i;const ok=i===it.ans;if(ok)QZ.ok++;grade(wkey(QZ.src,it.w.w),ok?4:1);if(it.dir==='vi'||ok)speak(it.w.w);render()}

/* --- Nghe & viết --- */
let SP=null;
VIEWS.spell=()=>{
 const s=setById(R.id);
 if(!SP||SP.src!==R.id)SP={src:R.id,i:0,ok:0,items:shuffle(s.words).slice(0,10),res:null,hint:0};
 const q=SP;
 if(q.i>=q.items.length)return `<div class="fc-wrap"><div class="card" style="text-align:center"><div class="big-score">${q.ok}/${q.items.length}</div><p class="muted">từ viết đúng</p><div class="row" style="justify-content:center"><button class="btn" onclick="SP=null;render()">Làm lại</button><button class="btn pri" onclick="SP=null;go('set',{id:'${s.id}'})">Xong</button></div></div></div>`;
 const w=q.items[q.i];
 const hint=w.w.split('').map((c,i)=>i<q.hint||c===' '?c:'_').join(' ');
 return `<div class="fc-wrap"><div class="crumb" onclick="SP=null;go('set',{id:'${s.id}'})">← ${h(s.title)}</div>
 <div class="row between mb"><span class="small muted">Từ ${q.i+1}/${q.items.length}</span><span class="small muted">Đúng: ${q.ok}</span></div><div class="bar mb"><i style="width:${q.i/q.items.length*100}%"></i></div>
 <div class="card" style="text-align:center"><div class="row" style="justify-content:center"><button class="spk" style="width:64px;height:64px;font-size:26px" onclick="speak('${jsq(w.w)}')"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button><button class="spk" title="Đọc chậm" onclick="speak('${jsq(w.w)}',0.55)">🐢</button></div>
 <p class="mt"><b>Nghĩa:</b> ${h(w.vi)} <span class="muted small">(${h(w.pos||'')})</span></p>
 <p class="muted" style="letter-spacing:2px;font-family:monospace">${h(hint)}</p>
 <input type="text" id="spin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ bạn nghe được" style="text-align:center;font-size:18px;max-width:340px" onkeydown="if(event.key==='Enter')${q.res?'spNext()':'spCheck()'}" ${q.res?'disabled':''} value="${q.res?h(q.res.v):''}">
 ${q.res?`<div class="mt">${q.res.ok?'<b style="color:var(--ok)">Chính xác!</b>':`<b style="color:var(--bad)">Đáp án:</b> <b>${h(w.w)}</b>`}</div><button class="btn pri mt" onclick="spNext()">Tiếp →</button>`:`<div class="row mt" style="justify-content:center"><button class="btn" onclick="SP.hint++;render()">Gợi ý chữ cái</button><button class="btn pri" onclick="spCheck()">Kiểm tra</button></div>`}
 </div></div>`;
};
AFTER.spell=()=>{if(SP&&SP.i<SP.items.length){if(!SP.res&&!SP.spoken){SP.spoken=true;setTimeout(()=>{if(SP&&R.v==='spell'&&SP.items[SP.i])speak(SP.items[SP.i].w)},250)}const el=$('#spin');if(el&&!SP.res)el.focus();if(SP.res)setTimeout(()=>window.addEventListener('keydown',spEnter,{once:true}),50)}};
function spEnter(e){if(e.key==='Enter'&&R.v==='spell'&&SP&&SP.res)spNext()}
function spCheck(){const v=$('#spin').value;if(!v.trim())return;const w=SP.items[SP.i];const ok=norm(v)===norm(w.w);if(ok)SP.ok++;SP.res={ok,v};grade(wkey(SP.src,w.w),ok?(SP.hint?3:4):1);render()}
function spNext(){SP.i++;SP.res=null;SP.hint=0;SP.spoken=false;render()}

/* --- Ghép từ --- */
let MT=null;
VIEWS.match=()=>{
 const s=setById(R.id);
 if(!MT||MT.src!==R.id){const ws=shuffle(s.words).slice(0,6);MT={src:R.id,ws,L:shuffle(ws.map((w,i)=>i)),Rr:shuffle(ws.map((w,i)=>i)),sl:null,sr:null,done:new Set(),err:0,t0:Date.now(),bad:null}}
 const m=MT;
 if(m.done.size===m.ws.length){const sec=Math.round((Date.now()-m.t0)/1000);return `<div class="fc-wrap"><div class="card" style="text-align:center">${(setTimeout(celebrate,250),'')}${DONE_RING}<h2>Ghép xong ${m.ws.length} cặp!</h2><p class="muted">Thời gian ${sec} giây · ${m.err} lần sai</p><div class="row" style="justify-content:center"><button class="btn" onclick="MT=null;render()">Chơi lại</button><button class="btn pri" onclick="MT=null;go('set',{id:'${s.id}'})">Xong</button></div></div></div>`}
 return `<div class="fc-wrap"><div class="crumb" onclick="MT=null;go('set',{id:'${s.id}'})">← ${h(s.title)}</div><p class="sub">Chọn một từ bên trái và nghĩa tương ứng bên phải.</p>
 <div class="match"><div class="grid" style="gap:10px">${m.L.map(i=>`<div class="mi ${m.done.has(i)?'done':''} ${m.sl===i?'sel':''} ${m.bad&&m.bad[0]===i?'err':''}" onclick="mtPick('l',${i})">${h(m.ws[i].w)}</div>`).join('')}</div>
 <div class="grid" style="gap:10px">${m.Rr.map(i=>`<div class="mi ${m.done.has(i)?'done':''} ${m.sr===i?'sel':''} ${m.bad&&m.bad[1]===i?'err':''}" onclick="mtPick('r',${i})">${h(m.ws[i].vi)}</div>`).join('')}</div></div>
 <p class="small muted mt">Sai: ${m.err}</p></div>`;
};
function mtPick(side,i){const m=MT;if(m.done.has(i))return;m.bad=null;if(side==='l'){m.sl=i;speak(m.ws[i].w)}else m.sr=i;
 if(m.sl!=null&&m.sr!=null){if(m.sl===m.sr){m.done.add(i);grade(wkey(m.src,m.ws[i].w),4)}else{m.err++;m.bad=[m.sl,m.sr];grade(wkey(m.src,m.ws[m.sl].w),1)}m.sl=m.sr=null}
 render()}

 return `<div class="card tcard" ${t.skill?`data-skill="${h(t.skill)}"`:''}><div class="row between"><span class="tag ${t.skill?'sk':t.type==='ielts'?'':'acc'}">${h(t.skill||(t.type==='ielts'?'IELTS':'THPT'))}</span>${asg.has(t.id)?'<span class="tag warn">Được giao</span>':''}</div>

VIEWS.exam=()=>{

 return `<h1>Luyện đề</h1><p class="sub">Làm đề có tính giờ, chấm điểm ngay và xem giải thích từng câu.</p>

};

 }

 return `<div class="exam-head"><div class="row between"><b style="flex:1;min-width:0">${h(t.title)}</b>${hasP?`<div class="rtools"><button class="btn ghost" title="Chữ nhỏ hơn" onclick="pfs(-1)">A−</button><button class="btn ghost" title="Chữ lớn hơn" onclick="pfs(1)">A+</button><button class="btn" id="hlbtn" title="Bôi vàng: chọn chữ trong bài đọc để đánh dấu, bấm vào chỗ đã bôi để bỏ" onclick="hlToggle()">Bút dạ</button><button class="btn" id="fcbtn" title="Ẩn menu để tập trung đọc" onclick="focusToggle()">Tập trung</button></div>`:''}<span class="timer" id="timer"></span><button class="btn pri" onclick="submitTest()">Nộp bài</button></div>

 ${t.sections.map((s,si)=>`<h2 class="mt2">${h(s.title||('Phần '+(si+1)))}</h2>
  ${s.audioSrc?audioBox(s.audioSrc):''}${s.audio?`<div class="card mb row"><button class="btn acc" onclick="playAudio(${si})">▶ Phát bài nghe</button><button class="btn" onclick="speechSynthesis.cancel()">■ Dừng</button><span class="small muted" id="plays${si}">Đã phát ${EX.plays[si]||0} lần</span></div>`:''}

  <div class="card">${s.questions.map(q=>{n++;const k=n;

   if(q.t==='fill')return `<div class="q" id="q${k}"><div><span class="qn">${k}</span>${fmt(q.q)}</div><input type="text" class="fill" autocomplete="off" spellcheck="false" placeholder="Câu trả lời" oninput="ansFill(${k},this.value)"></div>`;
   return `<div class="q" id="q${k}"><div><span class="qn">${k}</span>${fmt(q.q)}</div><textarea class="prose mt" oninput="ansFill(${k},this.value);$('#wc${k}').textContent=wc(this.value)" placeholder="Viết bài của bạn ở đây..."></textarea><div class="small muted">Số từ: <b id="wc${k}">0</b>${q.min?` / tối thiểu ${q.min}`:''}</div></div>`;

 <div class="row mt2" style="justify-content:flex-end"><button class="btn pri" onclick="submitTest()">Nộp bài</button></div>`;

const wc=s=>(s.trim().match(/\S+/g)||[]).length;
function startTest(){const t=testById(R.id);EX={id:t.id,ans:{},t0:Date.now(),end:Date.now()+t.minutes*60000,plays:{}};R.running=true;render()}
function measureEH(){const e=$('.exam-head');document.documentElement.style.setProperty('--eh',(e?e.offsetHeight:0)+'px')}
addEventListener('resize',()=>{if(R.v==='test')measureEH()});
function pfs(d){const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pfs'))||16.5;const v=Math.max(14,Math.min(23,cur+d*1.5));document.documentElement.style.setProperty('--pfs',v+'px');try{localStorage.setItem('pfs',v)}catch(e){}}
try{const v=localStorage.getItem('pfs');if(v)document.documentElement.style.setProperty('--pfs',v+'px')}catch(e){}
function focusToggle(){const on=document.documentElement.classList.toggle('focus');$('#fcbtn')&&$('#fcbtn').classList.toggle('on',on);requestAnimationFrame(measureEH)}
function hlToggle(){const on=document.documentElement.classList.toggle('hl-on');$('#hlbtn')&&$('#hlbtn').classList.toggle('on',on)}
function hlApply(){if(!document.documentElement.classList.contains('hl-on'))return;const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed)return;const rg=sel.getRangeAt(0);const pa=rg.commonAncestorContainer.nodeType===1?rg.commonAncestorContainer:rg.commonAncestorContainer.parentNode;if(!pa.closest('.passage'))return;const m=document.createElement('mark');m.className='hl';try{m.appendChild(rg.extractContents());rg.insertNode(m)}catch(e){}sel.removeAllRanges()}
function hlRemove(e){const m=e.target.closest&&e.target.closest('mark.hl');if(!m||!getSelection().isCollapsed)return;m.replaceWith(...m.childNodes)}
AFTER.test=()=>{if(!R.running)return;measureEH();document.querySelectorAll('.player').forEach(initPlayer);clearInterval(timerH);const tick=()=>{const left=Math.max(0,EX.end-Date.now());const el=$('#timer');if(!el){clearInterval(timerH);return}const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',left<60000);if(left<=0){clearInterval(timerH);toast('Hết giờ! Bài đã được nộp.');submitTest(true)}};tick();timerH=setInterval(tick,1000)};
function audioBox(src){const m=/drive\.google\.com\/(?:file\/d\/|uc\?[^"]*id=|open\?id=)([\w-]+)/.exec(src);
 const direct=m?`https://drive.usercontent.google.com/download?id=${m[1]}&export=download`:src;
 const fb=m?`https://drive.google.com/file/d/${h(m[1])}/preview`:'';
 return `<div class="card mb player-wrap"><div class="player loading" data-src="${h(direct)}" data-fb="${fb}"><button class="pp" aria-label="Phát / tạm dừng"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></button><canvas class="wv" aria-label="Thanh tiến độ bài nghe"></canvas><span class="tm">0:00 / --:--</span></div>${m?`<p class="small muted player-note">Bài nghe lấy từ Google Drive. Nếu không phát được, <a href="https://drive.google.com/file/d/${h(m[1])}/view" target="_blank" rel="noopener">mở trong tab mới</a>.</p>`:''}</div>`}
function audioBoxOld(src){const m=/drive\.google\.com\/(?:file\/d\/|uc\?[^"]*id=|open\?id=)([\w-]+)/.exec(src);if(m)return `<div class="card mb"><iframe src="https://drive.google.com/file/d/${h(m[1])}/preview" style="width:100%;height:120px;border:0;border-radius:8px" allow="autoplay" loading="lazy" title="Bài nghe"></iframe><p class="small muted">Bài nghe phát từ Google Drive. Nếu không phát được, <a href="https://drive.google.com/file/d/${h(m[1])}/view" target="_blank" rel="noopener">mở trong tab mới</a>.</p></div>`;return `<div class="card mb"><audio controls preload="none" src="${h(src)}" style="width:100%"></audio></div>`}
function initPlayer(el){
 if(el._init)return;el._init=1;
 const a=new Audio();a.preload='metadata';a.src=el.dataset.src;
 const btn=el.querySelector('.pp'),cv=el.querySelector('.wv'),tm=el.querySelector('.tm');
 const N=160;let seed=0;for(const ch of el.dataset.src)seed=(seed*31+ch.charCodeAt(0))>>>0;
 const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 const base=Array.from({length:N},(_,i)=>.28+.5*Math.abs(Math.sin(i*.37+rnd()*2))*(.6+.4*rnd()));
 let live=new Float32Array(N).fill(0),raf=0;
 const fmtT=x=>isFinite(x)?`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`:'--:--';
 const css=v=>getComputedStyle(el).getPropertyValue(v).trim();
 function draw(){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,hh=cv.clientHeight;if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=hh*dpr}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,hh);
  const pr=a.duration?a.currentTime/a.duration:0,on=css('--sk')||'#233f7a',off=css('--line2')||'#ccc';
  const M=Math.max(24,Math.min(N,Math.floor(w/6)));
  if(!a.paused){const t=performance.now()/1000,ph=pr*M;for(let i=0;i<M;i++){const near=Math.max(0,1-Math.abs(i-ph)/9);const v=near*(.35+.3*Math.sin(t*7+i*1.3)*Math.sin(t*3.1+i*.7));live[i]+=(v-live[i])*.25}}
  else for(let i=0;i<M;i++)live[i]*=.9;
  const gap=3,bw=Math.max(1.5,(w-gap*(M-1))/M);
  for(let i=0;i<M;i++){const amp=Math.min(1,base[i]*.55+live[i]*.75);const bh=Math.max(3,amp*hh);const x=i*(bw+gap);
   g.fillStyle=(i+.5)/M<=pr?on:off;g.beginPath();g.roundRect?g.roundRect(x,(hh-bh)/2,bw,bh,bw/2):g.rect(x,(hh-bh)/2,bw,bh);g.fill()}
  tm.textContent=`${fmtT(a.currentTime)} / ${fmtT(a.duration)}`;
  if(!a.paused||live.some(v=>v>.01))raf=requestAnimationFrame(draw);else raf=0;
 }

const LINKERS=['however','moreover','furthermore','in addition','therefore','consequently','as a result','for example','for instance','on the other hand','in contrast','although','whereas','while','firstly','secondly','finally','in conclusion','to sum up','overall','in my opinion','because','since','despite','nevertheless','similarly','meanwhile','such as','thus','hence'];
const STOP=new Set('the a an and or but of to in on at for with is are was were be been being it this that these those i you he she we they my your our their its as by from not have has had do does did can could will would should may might must so if than then there here what which who when where why how very more most also about into over just some any all no one two'.split(' '));
const FILLERS=['um','uh','er','erm','ah','hmm','you know','i mean','basically'];
function textStats(t){
 const words=(t.toLowerCase().match(/[a-z']+/g)||[]);const n=words.length;
 const sents=t.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
 const paras=t.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).length||(t.trim()?1:0);
 const low=' '+t.toLowerCase().replace(/[^a-z' ]+/g,' ')+' ';
 const link=LINKERS.filter(l=>low.includes(' '+l+' '));
 const freq={};words.filter(w=>!STOP.has(w)&&w.length>3).forEach(w=>freq[w]=(freq[w]||0)+1);
 const rep=Object.entries(freq).filter(([w,c])=>c>=4).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const uniq=new Set(words).size;const longW=words.filter(w=>w.length>=8).length;
 const fill=FILLERS.map(f=>[f,(low.match(new RegExp(' '+f+' ','g'))||[]).length]).filter(x=>x[1]);
 return{n,sents:sents.length,paras,link,rep,uniq,ttr:n?uniq/n:0,longW,avgSent:sents.length?n/sents.length:0,fill};
}

async function recStart(limit){
 if(REC.on)return;REC.final='';REC.interim='';REC.chunks=[];REC.blob=null;if(REC.url){URL.revokeObjectURL(REC.url);REC.url=null}REC.limit=limit||0;

 try{REC.mr=new MediaRecorder(REC.stream);REC.mr.ondataavailable=e=>e.data.size&&REC.chunks.push(e.data);REC.mr.onstop=()=>{REC.blob=new Blob(REC.chunks,{type:REC.mr.mimeType||'audio/webm'});REC.url=URL.createObjectURL(REC.blob);REC.stream.getTracks().forEach(t=>t.stop());if(REC.onDone)REC.onDone()};REC.mr.start()}catch(e){toast('Trình duyệt không hỗ trợ ghi âm');return false}
 if(SR){try{const r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=true;r.onresult=ev=>{let it='';for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)REC.final+=x[0].transcript.trim()+' ';else it+=x[0].transcript}REC.interim=it;const el=$('#live');if(el)el.textContent=(REC.final+REC.interim)||'…'};r.onend=()=>{if(REC.on)try{r.start()}catch(e){}};r.start();REC.rec=r}catch(e){}}

}

 if(SK)return skView();
 const done=P().speaking||[];const cnt=id=>done.filter(x=>x.topic===id).length;
 return `<h1>Luyện Speaking</h1><p class="sub">Nghe câu hỏi, bấm ghi âm và trả lời. Máy chép lại lời bạn nói và đưa nhận xét nhanh, giáo viên chấm band sau.</p>
 ${SR?'':'<div class="explain mb">Trình duyệt này không hỗ trợ chép lời tự động. Hãy dùng Chrome hoặc Edge để có đầy đủ tính năng. Bạn vẫn ghi âm được.</div>'}
 <details class="card mb"><summary><b>Hướng dẫn luyện tập Speaking mỗi ngày (luyennoi.com)</b></summary>
  <ol class="small mt" style="line-height:1.8;padding-left:20px">

 <div class="card mb row between" style="background:var(--brand-soft)"><div><h3 style="margin:0">Thi thử Speaking đầy đủ</h3><div class="small muted">Part 1 (4 câu), Part 2 (1 phút chuẩn bị, 2 phút nói), Part 3 (3 câu). Khoảng 12 phút.</div></div><button class="btn pri" onclick="skMock()">Bắt đầu thi thử</button></div>
 <div class="seg mb"><button class="${spkTab==='p1'?'on':''}" onclick="spkTab='p1';render()">Part 1</button><button class="${spkTab==='p2'?'on':''}" onclick="spkTab='p2';render()">Part 2 & 3</button><button class="${spkTab==='mine'?'on':''}" onclick="spkTab='mine';render()">Bài đã nói (${done.length})</button></div>
 ${spkTab==='p1'?`<div class="grid g3">${allP1().map(t=>`<div class="card"><span class="tag">Part 1</span><h3 class="mt">${h(t.title)}</h3><p class="small muted">${t.qs.length} câu hỏi${cnt(t.id)?` · đã luyện ${cnt(t.id)} lần`:''}</p><button class="btn pri" onclick="skStart('${t.id}')">Luyện</button></div>`).join('')}</div>`:''}
 ${spkTab==='p2'?`<div class="grid g2">${allP2().map(t=>`<div class="card"><span class="tag acc">Part 2 & 3</span><h3 class="mt">${h(t.cue)}</h3><p class="small muted">${t.points.length} gợi ý · ${t.p3.length} câu Part 3${cnt(t.id)?` · đã luyện ${cnt(t.id)} lần`:''}</p><button class="btn pri" onclick="skStart('${t.id}')">Luyện</button></div>`).join('')}</div>`:''}
 ${spkTab==='mine'?skHistory(U.id):''}`;
};
function skHistory(sid){const l=(P(sid).speaking||[]).slice().reverse();if(!l.length)return '<div class="card empty">Chưa có bài nói nào.</div>';
 return `<div class="card">${l.map(x=>`<div class="list-item"><div><b class="small">${x.mock?'Thi thử Speaking':h(x.title)}</b><div class="small muted">${fdt(x.date)} · ${x.items.length} câu</div></div><div class="row">${x.grade&&x.grade.band!=null?`<span class="tag ok">Band ${x.grade.band}</span>`:'<span class="tag warn">Chờ chấm</span>'}<button class="btn sm" onclick="go('${U.role==='teacher'?'t-review':'skres'}',{kind:'speaking',rid:'${x.id}',sid:'${sid}'})">Xem</button></div></div>`).join('')}</div>`}
function skBuild(t){const items=[];if(t.qs)t.qs.forEach(q=>items.push({part:1,q,target:30}));else{items.push({part:2,q:t.cue,points:t.points,target:120,prep:60});t.p3.forEach(q=>items.push({part:3,q,target:45}))}return items}
function skStart(id){const t=spTopicById(id);SK={topic:id,title:t.title||t.cue,items:skBuild(t),i:0,res:[],phase:'ready'};render()}
function skMock(){const a=shuffle(allP1())[0],b=shuffle(allP2())[0];const items=[...shuffle(a.qs).slice(0,4).map(q=>({part:1,q,target:30})),{part:2,q:b.cue,points:b.points,target:120,prep:60},...b.p3.map(q=>({part:3,q,target:45}))];SK={topic:'mock',mock:true,title:'Thi thử: '+a.title+' / '+b.title,items,i:0,res:[],phase:'ready'};render()}
function skView(){
 const it=SK.items[SK.i];const last=SK.res[SK.i];
 const partTag=`<span class="tag ${it.part===2?'acc':''}">Part ${it.part}</span>`;
 let body='';
 if(SK.phase==='ready')body=`<button class="btn pri" onclick="skGo()">${it.prep?'Bắt đầu 1 phút chuẩn bị':'🎙 Bắt đầu trả lời'}</button>${it.prep?' <button class="btn" onclick="skRec()">Bỏ qua chuẩn bị, nói luôn</button>':''}`;
 else if(SK.phase==='prep')body=`<div class="row"><span class="timer" id="ptime">1:00</span><span class="muted small">Ghi chú nhanh ý tưởng ra giấy hoặc ô bên dưới.</span></div><textarea class="prose mt" style="min-height:90px" placeholder="Ghi chú…" oninput="SK.note=this.value">${h(SK.note||'')}</textarea><button class="btn pri mt" onclick="skRec()">Bắt đầu nói ngay</button>`;
 else if(SK.phase==='rec')body=`<div class="row"><span class="timer" id="rtime" style="color:var(--bad)">● 0:00</span><button class="btn pri" onclick="recStop()">■ Dừng</button><span class="small muted">Nên nói khoảng ${it.target} giây</span></div><div class="passage mt" id="live" style="min-height:70px;background:var(--bg)">${SR?'Đang nghe…':'(Trình duyệt không hỗ trợ chép lời)'}</div>`;
 else if(SK.phase==='done'&&last){const st=textStats(last.text);const wpm=last.dur?Math.round(st.n/last.dur*60):0;
  body=`${last.url?`<audio controls src="${last.url}" style="width:100%"></audio>`:''}<h3 class="mt">Lời bạn nói (máy chép lại)</h3><textarea class="prose" style="min-height:90px" oninput="skEdit(this.value)" placeholder="Không nhận được lời nói. Bạn có thể tự gõ lại câu trả lời.">${h(last.text)}</textarea>
  <div id="skstats">${statsHTML(st,{speaking:true,wpm,dur:last.dur,target:it.target})}</div>
  <div class="row mt"><button class="btn" onclick="skRetry()">↺ Nói lại</button><button class="btn pri" onclick="skNext()">${SK.i<SK.items.length-1?'Câu tiếp theo →':'Hoàn thành & lưu'}</button></div>`}
 return `<div class="fc-wrap" style="max-width:720px"><div class="crumb" onclick="skQuit()">← Speaking</div>
 <div class="row between mb"><b>${h(SK.title)}</b><span class="small muted">Câu ${SK.i+1}/${SK.items.length}</span></div><div class="bar mb"><i style="width:${SK.i/SK.items.length*100}%"></i></div>
 <div class="card">${partTag}<div class="row mt" style="flex-wrap:nowrap;align-items:flex-start"><div class="qbig" style="font-size:20px;flex:1">${h(it.q)}</div><button class="spk" onclick="speak(${h(JSON.stringify(it.q))})"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button></div>
 ${it.points?`<div class="mt">You should say:<ul style="margin:6px 0">${it.points.map(p=>`<li>${h(p)}</li>`).join('')}</ul></div>`:''}
 <div class="mt">${body}</div></div></div>`;
}
AFTER.speaking=()=>{if(SK&&SK.phase==='ready'&&!SK.spoken){SK.spoken=true;setTimeout(()=>{if(SK&&R.v==='speaking')speak(SK.items[SK.i].q)},300)}};
function skGo(){const it=SK.items[SK.i];if(it.prep){SK.phase='prep';render();let left=it.prep;clearInterval(SK.pt);SK.pt=setInterval(()=>{left--;const el=$('#ptime');if(el)el.textContent=fmtSec(left);if(left<=0||SK.phase!=='prep'){clearInterval(SK.pt);if(SK&&SK.phase==='prep')skRec()}},1000)}else skRec()}
async function skRec(){clearInterval(SK.pt);speechSynthesis.cancel();const it=SK.items[SK.i];SK.phase='rec';render();REC.onDone=()=>{SK.res[SK.i]={q:it.q,part:it.part,text:(REC.final+REC.interim).trim(),dur:REC.dur,blob:REC.blob,url:REC.url};SK.phase='done';render()};const ok=await recStart(it.part===2?130:it.part===3?90:60);if(!ok){SK.phase='ready';render()}}
function skEdit(v){const r=SK.res[SK.i];r.text=v;const st=textStats(v);$('#skstats').innerHTML=statsHTML(st,{speaking:true,wpm:r.dur?Math.round(st.n/r.dur*60):0,dur:r.dur,target:SK.items[SK.i].target})}
function skRetry(){SK.res[SK.i]=null;SK.phase='ready';SK.spoken=false;render()}
function skNext(){if(SK.i<SK.items.length-1){SK.i++;SK.phase='ready';SK.spoken=false;render();return}
 const id=uid('k');const items=SK.res.map((r,i)=>{if(!r)return null;const st=textStats(r.text);if(r.blob)IDB.put(id+'_'+i,r.blob);return{q:r.q,part:r.part,text:r.text,dur:r.dur,words:st.n,wpm:r.dur?Math.round(st.n/r.dur*60):0,audio:!!r.blob}}).filter(Boolean);
 const p=P();p.speaking=p.speaking||[];p.speaking.push({id,topic:SK.topic,mock:!!SK.mock,title:SK.title,date:Date.now(),items,grade:null});bump();save();SK=null;toast('Đã lưu bài nói. Giáo viên sẽ chấm và nhận xét.');go('skres',{kind:'speaking',rid:id,sid:U.id})}
function skQuit(){if(REC.on){recStop()}if(SK&&SK.res.some(Boolean)&&!confirm('Thoát sẽ mất các câu đã ghi âm. Vẫn thoát?'))return;clearInterval(SK&&SK.pt);SK=null;speechSynthesis.cancel();go('speaking')}

/* --- Xem / chấm bài nói & viết (dùng chung cho học viên & giáo viên) --- */
VIEWS.skres=()=>reviewView();
VIEWS.wres=()=>reviewView();
VIEWS['t-review']=()=>reviewView();
function reviewView(){
 const sid=R.sid;const p=P(sid);const isT=U.role==='teacher';const back=isT?`go('t-grade')`:(R.kind==='speaking'?`go('speaking')`:`go('writing')`);
 if(R.kind==='speaking'){
  const x=(p.speaking||[]).find(a=>a.id===R.rid);if(!x)return '<div class="empty">Không tìm thấy.</div>';const g=x.grade||{};
  return `<div class="crumb" onclick="${back}">← Quay lại</div><h1>${x.mock?'Thi thử Speaking':'Speaking · '+h(x.title)}</h1><p class="sub">${isT?h((stuById(sid)||{}).name||'')+' · ':''}${fdt(x.date)}</p>
  ${gradeBox('speaking',sid,x,['Fluency & Coherence','Lexical Resource','Grammar Range & Accuracy','Pronunciation'],['fc','lr','gra','pr'])}
  ${x.items.map((it,i)=>{const st=textStats(it.text);return `<div class="card mt"><span class="tag ${it.part===2?'acc':''}">Part ${it.part}</span> <b>${h(it.q)}</b>${it.audio?`<audio controls id="au_${x.id}_${i}" style="width:100%;margin-top:10px"></audio>`:''}<div class="passage mt" style="background:var(--bg)">${h(it.text)||'<i class="muted">(không có lời chép)</i>'}</div><div class="small muted mt">${it.dur}s · ${it.words} từ · ${it.wpm} từ/phút · đa dạng từ ${Math.round(st.ttr*100)}%${st.fill.length?' · từ đệm: '+st.fill.map(f=>f[0]+'×'+f[1]).join(', '):''}</div></div>`}).join('')}`;
 }
 const x=(p.writings||[]).find(a=>a.id===R.rid);if(!x)return '<div class="empty">Không tìm thấy.</div>';const w=wById(x.promptId);
 return `<div class="crumb" onclick="${back}">← Quay lại</div><h1>Writing Task ${w?w.task:''} · ${h(w?w.title:'(đề đã xóa)')}</h1><p class="sub">${isT?h((stuById(sid)||{}).name||'')+' · ':''}${fdt(x.date)} · ${wc(x.text)} từ · làm trong ${Math.round(x.dur/60)} phút</p>
 ${gradeBox('writing',sid,x,[w&&w.task===1?'Task Achievement':'Task Response','Coherence & Cohesion','Lexical Resource','Grammar Range & Accuracy'],['tr','cc','lr','gra'])}
 ${w?`<details class="card mt"><summary><b>Xem đề bài</b></summary><p>${fmt(w.prompt)}</p>${w.chart?chartSVG(w.chart):''}${w.img?`<img src="${h(w.img)}" style="max-width:100%">`:''}</details>`:''}
 ${w&&w.model?`<details class="card mt"><summary><b>Xem bài mẫu (band 8.0+)</b></summary><p class="small muted">Bài mẫu để tham khảo cách triển khai ý, không phải đáp án duy nhất.</p><p>${fmt(w.model)}</p></details>`:''}
 <div class="card mt"><h3>Bài viết</h3><div class="passage" style="background:var(--bg)">${h(x.text)}</div>${statsHTML(textStats(x.text),{writing:true,task:w?w.task:2,min:w?w.min:0})}</div>`;
}
AFTER.skres=AFTER['t-review']=()=>{if(R.kind!=='speaking')return;const x=(P(R.sid).speaking||[]).find(a=>a.id===R.rid);if(!x)return;x.items.forEach(async(it,i)=>{if(!it.audio)return;const b=await IDB.get(x.id+'_'+i);const el=$(`#au_${x.id}_${i}`);if(el){if(b)el.src=URL.createObjectURL(b);else el.replaceWith(Object.assign(document.createElement('div'),{className:'small muted',textContent:'(File ghi âm chỉ nghe được trên máy học viên đã ghi)'}))}})};
function gradeBox(kind,sid,x,labels,keys){
 const g=x.grade||{};
 if(U.role==='teacher')return `<div class="card"><h2>Chấm điểm</h2><div class="grid g4" style="gap:10px">${labels.map((l,i)=>`<div><label class="f">${l}</label><input type="number" min="0" max="9" step="0.5" id="g_${keys[i]}" value="${g[keys[i]]??''}"></div>`).join('')}</div>
  <label class="f">Nhận xét cho học viên</label><textarea class="prose" style="min-height:110px" id="g_com">${h(g.comment||'')}</textarea>
  <div class="row mt"><button class="btn pri" onclick="saveSWGrade('${kind}','${sid}','${x.id}',${h(JSON.stringify(keys))})">Lưu điểm</button>${g.band!=null?`<span class="tag ok">Overall ${g.band}</span>`:''}</div></div>`;
 if(g.band==null)return `<div class="card"><span class="tag warn">Đang chờ giáo viên chấm</span></div>`;
 return `<div class="card" style="text-align:center"><div class="big-score">Band ${g.band}</div><div class="grid g4 mt" style="gap:8px">${labels.map((l,i)=>`<div class="card stat"><div class="n">${g[keys[i]]??'–'}</div><div class="l">${l}</div></div>`).join('')}</div>${g.comment?`<div class="explain mt" style="text-align:left"><b>Nhận xét của giáo viên:</b><br>${fmt(g.comment)}</div>`:''}</div>`;
}
function saveSWGrade(kind,sid,id,keys){const list=kind==='speaking'?P(sid).speaking:P(sid).writings;const x=list.find(a=>a.id===id);const g={};keys.forEach(k=>{const v=$('#g_'+k).value;g[k]=v===''?null:+v});g.band=bandAvg(keys.map(k=>g[k]));g.comment=$('#g_com').value;g.gradedAt=Date.now();x.grade=g;save();render();toast(g.band!=null?`Đã lưu. Overall band ${g.band}`:'Đã lưu nhận xét (chưa đủ 4 tiêu chí để tính band)')}

/* --- Trang Writing --- */
let wTab=2;let WR=null;
VIEWS.writing=()=>{
 if(WR)return wrView();
 const mine=P().writings||[];const cnt=id=>mine.filter(x=>x.promptId===id).length;
 const asg=new Set(myAssignments(U.id).filter(a=>a.kind==='writing').map(a=>a.ref));
 return `<h1>Luyện Writing</h1><p class="sub">Viết bài có tính giờ, xem nhận xét tự động ngay và nhận band, nhận xét chi tiết từ giáo viên.</p>
 <div class="seg mb"><button class="${wTab===1?'on':''}" onclick="wTab=1;render()">Task 1</button><button class="${wTab===2?'on':''}" onclick="wTab=2;render()">Task 2</button><button class="${wTab==='mine'?'on':''}" onclick="wTab='mine';render()">Bài đã viết (${mine.length})</button></div>
 ${wTab==='mine'?wHistory(U.id):`<div class="grid g2">${allW().filter(w=>w.task===wTab).map(w=>`<div class="card"><div class="row between"><span class="tag ${w.task===1?'acc':''}">Task ${w.task}</span>${asg.has(w.id)?'<span class="tag warn">Được giao</span>':''}</div><h3 class="mt">${h(w.title)}</h3><p class="small muted" style="margin:0 0 8px">${h(w.prompt.split('\n')[0]).slice(0,150)}</p><p class="small muted">${w.minutes} phút · tối thiểu ${w.min} từ${cnt(w.id)?` · đã viết ${cnt(w.id)} lần`:''}</p><button class="btn pri" onclick="wStart('${w.id}')">Viết bài</button></div>`).join('')}</div>`}`;
};
function wHistory(sid){const l=(P(sid).writings||[]).slice().reverse();if(!l.length)return '<div class="card empty">Chưa có bài viết nào.</div>';
 return `<div class="card">${l.map(x=>{const w=wById(x.promptId);return `<div class="list-item"><div><b class="small">${w?'Task '+w.task+' · '+h(w.title):'(đề đã xóa)'}</b><div class="small muted">${fdt(x.date)} · ${wc(x.text)} từ</div></div><div class="row">${x.grade&&x.grade.band!=null?`<span class="tag ok">Band ${x.grade.band}</span>`:'<span class="tag warn">Chờ chấm</span>'}<button class="btn sm" onclick="go('${U.role==='teacher'?'t-review':'wres'}',{kind:'writing',rid:'${x.id}',sid:'${sid}'})">Xem</button></div></div>`}).join('')}</div>`}
function draftKey(id){return 'lopta_draft_'+U.id+'_'+id}
function wStart(id){const w=wById(id);let d='';try{d=localStorage.getItem(draftKey(id))||''}catch(e){}WR={id,t0:Date.now(),end:Date.now()+w.minutes*60000,text:d};render()}
function wrView(){const w=wById(WR.id);
 return `<div class="exam-head"><div class="row between"><b style="flex:1;min-width:0">Writing Task ${w.task} · ${h(w.title)}</b><span class="timer" id="timer"></span><button class="btn ghost" onclick="wQuit()">Thoát</button><button class="btn pri" onclick="wSubmit()">Nộp bài</button></div></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
 <div class="card"><p>${fmt(w.prompt)}</p>${w.chart?chartSVG(w.chart):''}${w.img?`<img src="${h(w.img)}" style="max-width:100%">`:''}<p class="small muted">Viết ít nhất ${w.min} từ.</p></div>
 <div class="card"><textarea class="prose" id="wtext" style="min-height:420px" placeholder="Viết bài ở đây. Để một dòng trống giữa các đoạn." oninput="wInput(this.value)">${h(WR.text)}</textarea><div class="row between small mt"><span>Số từ: <b id="wwc">${wc(WR.text)}</b> / ${w.min}</span><span class="muted" id="wsaved">Bản nháp tự lưu</span></div></div></div>`}
AFTER.writing=()=>{if(!WR)return;clearInterval(timerH);const tick=()=>{const left=Math.max(0,WR.end-Date.now());const el=$('#timer');if(!el){clearInterval(timerH);return}el.textContent=fmtSec(Math.floor(left/1000));el.classList.toggle('low',left<120000);if(left<=0){clearInterval(timerH);el.textContent='Hết giờ';}};tick();timerH=setInterval(tick,1000)};
function wInput(v){WR.text=v;$('#wwc').textContent=wc(v);try{localStorage.setItem(draftKey(WR.id),v)}catch(e){}}
function wQuit(){if(WR.text.trim()&&!confirm('Bản nháp được giữ lại để viết tiếp sau. Thoát?'))return;WR=null;clearInterval(timerH);go('writing')}
function wSubmit(){const w=wById(WR.id);const n=wc(WR.text);if(n<20){toast('Bài viết quá ngắn');return}if(!confirm(n<w.min?`Bài mới có ${n}/${w.min} từ. Vẫn nộp?`:'Nộp bài?'))return;
 const p=P();p.writings=p.writings||[];const x={id:uid('w'),promptId:w.id,text:WR.text,date:Date.now(),dur:Math.round((Date.now()-WR.t0)/1000),grade:null};p.writings.push(x);bump();save();try{localStorage.removeItem(draftKey(w.id))}catch(e){}WR=null;clearInterval(timerH);go('wres',{kind:'writing',rid:x.id,sid:U.id})}

/* --- Giáo viên: Chấm bài --- */
let gradeTab='pending';
VIEWS['t-grade']=()=>{
 const all=[];D.students.forEach(s=>{const p=P(s.id);(p.writings||[]).forEach(x=>all.push({s,kind:'writing',x}));(p.speaking||[]).forEach(x=>all.push({s,kind:'speaking',x}))});

 return `<h1>Chấm bài Speaking & Writing</h1><p class="sub">${pend.length} bài đang chờ chấm. Bài của học viên học ở máy khác sẽ hiện ở đây sau khi bạn nhập file kết quả.</p>
